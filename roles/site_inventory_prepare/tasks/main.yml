  loop: "{{ site_inventory_installed.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Report reusable private site configuration ready
  ansible.builtin.debug:
    msg:
      result: SITE_DATA_READY
      site: "{{ site.id }}"
      required_files: "{{ site_inventory_required_files }}"
)
      - pve_observed.ipv4 is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
      - (site_pve_source.content | b64decode | from_yaml).pve is mapping
      - (site_pve_source.content | b64decode | from_yaml).pve.node is defined
