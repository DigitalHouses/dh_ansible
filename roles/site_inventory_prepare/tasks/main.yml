---
# One reusable site-data dependency. Task 05 already downloaded the private
# Fleet checkout; materialize only this runner's requested component YAML.
# No PVE access, root worker, per-task handler or new credential provider.
- name: Validate local site data contract
  ansible.builtin.assert:
    that:
      - site is mapping
      - site.id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')
      - site.id == site.owner_slug ~ '-' ~ site.type
      - inventory_hostname == 'runner'
      - (ansible_connection | default('')) == 'local'
      - inventory_dir == '/var/lib/ansible/site-data/' ~ site.id
      - site_inventory_required_files is sequence
      - site_inventory_required_files is not string
      - site_inventory_required_files | length > 0
      - site_inventory_required_files | unique | list | length == site_inventory_required_files | length
    fail_msg: "SITE_DATA_IDENTITY_BLOCKED: expected one local, canonical site runner."

- name: Reject special or unsafe file names
  ansible.builtin.assert:
    that:
      - item is match('^[a-z][a-z0-9_-]*[.]yml$')
      - item not in ['all.yml', 'hosts.yml', 'secrets.yml', 'vault.yml', 'fleet.vault.yml']
    fail_msg: "SITE_DATA_SCOPE_BLOCKED: use only component YAML of this site."
  loop: "{{ site_inventory_required_files }}"
  loop_control:
    label: "{{ item }}"

- name: Check local private Fleet checkout from task 05
  ansible.builtin.stat:
    path: /var/lib/semaphore/.dh-credentials/fleet/.git
    follow: false
  register: site_inventory_fleet_git
  changed_when: false

- name: Require pre-existing private Fleet authorization
  ansible.builtin.assert:
    that:
      - site_inventory_fleet_git.stat.isdir | default(false)
      - not (site_inventory_fleet_git.stat.islnk | default(false))
    fail_msg: >-
      SITE_DATA_FLEET_NOT_READY: complete task 05 to download private Fleet
      credentials before using site-specific operations.

- name: Inspect requested component files inside this site's Fleet directory
  ansible.builtin.stat:
    path: "/var/lib/semaphore/.dh-credentials/fleet/inventories/{{ site.id }}/{{ item }}"
    follow: false
  loop: "{{ site_inventory_required_files }}"
  loop_control:
    label: "{{ item }}"
  register: site_inventory_sources
  changed_when: false

- name: Require canonical regular source files before any writes
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
    fail_msg: "SITE_DATA_MISSING_OR_UNSAFE: required component is absent in private Fleet."
  loop: "{{ site_inventory_sources.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Verify common Linux administrative access for site inventory writes
  ansible.builtin.include_role:
    name: infrastructure_access
  vars:
    infrastructure_access_capability: filesystem_manage

- name: Materialize site component files with standard Ansible file management
  ansible.builtin.copy:
    src: "/var/lib/semaphore/.dh-credentials/fleet/inventories/{{ site.id }}/{{ item }}"
    dest: "{{ inventory_dir }}/{{ item }}"
    remote_src: true
    owner: root
    group: semaphore
    mode: "0640"
  become: true
  loop: "{{ site_inventory_required_files }}"
  loop_control:
    label: "{{ item }}"
  no_log: true

- name: Verify installed site components and permissions
  ansible.builtin.stat:
    path: "{{ inventory_dir }}/{{ item }}"
    follow: false
  become: true
  loop: "{{ site_inventory_required_files }}"
  loop_control:
    label: "{{ item }}"
  register: site_inventory_installed
  changed_when: false

- name: Accept only regular files owned by root and readable by Semaphore
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'semaphore'
      - item.stat.mode == '0640'
    fail_msg: "SITE_DATA_PERMISSIONS_BLOCKED: managed component permissions drifted."
  loop: "{{ site_inventory_installed.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Report reusable private site configuration ready
  ansible.builtin.debug:
    msg:
      result: SITE_DATA_READY
      site: "{{ site.id }}"
      required_files: "{{ site_inventory_required_files }}"
