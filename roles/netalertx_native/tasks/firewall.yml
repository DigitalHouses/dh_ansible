---
# Install BEFORE the backend can be started. Fail closed when nftables is
# unavailable in this unprivileged guest; never bypass or silently ignore it.
- name: Ensure dedicated nftables include directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install GraphQL LAN isolation rule
  ansible.builtin.template:
    src: netalertx-nftables.conf.j2
    dest: /etc/nftables.d/dh-netalertx.nft
    owner: root
    group: root
    mode: "0644"
  register: netalertx_native_nft_rule

- name: Include managed NetAlertX rules in nftables startup configuration
  ansible.builtin.lineinfile:
    path: /etc/nftables.conf
    line: 'include "/etc/nftables.d/dh-netalertx.nft"'
    insertafter: EOF
    state: present
  register: netalertx_native_nft_include

- name: Validate entire nftables configuration without changing live rules
  ansible.builtin.command:
    argv: [nft, -c, -f, /etc/nftables.conf]
  changed_when: false

- name: Apply and persist GraphQL isolation before backend installation
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: "{{ 'restarted' if (netalertx_native_nft_rule.changed or netalertx_native_nft_include.changed) else 'started' }}"

- name: Inspect effective GraphQL isolation chain
  ansible.builtin.command:
    argv: [nft, list, chain, inet, dh_netalertx, input]
  register: netalertx_native_nft_effective
  changed_when: false

- name: Refuse backend installation without active loopback-only API policy
  ansible.builtin.assert:
    that:
      - "'iifname != "lo"' in netalertx_native_nft_effective.stdout"
      - "('tcp dport ' ~ (netalertx_native_api_port | string)) in netalertx_native_nft_effective.stdout"
      - "'drop' in netalertx_native_nft_effective.stdout"
    fail_msg: "GraphQL LAN isolation is not active. Native backend must NOT be started."
