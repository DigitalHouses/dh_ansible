---
- name: Check exact guest identity and approved install
  ansible.builtin.import_tasks: preflight.yml
- name: Install official dependencies
  ansible.builtin.import_tasks: packages.yml
- name: Apply shared Bonjour baseline to this verified new CT
  ansible.builtin.import_role:
    name: guest_network_discovery
  vars:
    guest_network_discovery_approved: "{{ netalertx_native_approved }}"
    guest_network_discovery_hostname: "{{ netalertx_native_expected_hostname }}"
    guest_network_discovery_ip: "{{ ansible_host }}"
    guest_network_discovery_cidr: "{{ netalertx_native_ipv4_cidr }}"
    guest_network_discovery_provider: avahi
    guest_network_discovery_delegate: runner
- name: Enforce GraphQL loopback-only firewall before installation
  ansible.builtin.import_tasks: firewall.yml
- name: Install pinned code, preserve persistent data
  ansible.builtin.import_tasks: install.yml
- name: Prepare runtime and units
  ansible.builtin.import_tasks: runtime.yml
- name: Configure minimal nginx integration
  ansible.builtin.import_tasks: nginx.yml
- name: Reconcile approved upstream hostname resolvers
  ansible.builtin.import_tasks: name_resolution.yml
- name: Start and verify services
  ansible.builtin.import_tasks: verify.yml
