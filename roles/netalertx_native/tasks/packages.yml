---
# Exact apt set from upstream v26.5.4 Proxmox installer, plus nginx.
# Do NOT perform apt dist-upgrade or re-run the destructive installer.
- name: Install official Debian 13 native dependencies
  ansible.builtin.apt:
    name:
      - tini
      - snmp
      - ca-certificates
      - curl
      - libwww-perl
      - arp-scan
      - perl
      - apt-utils
      - cron
      - sudo
      - php8.4
      - php8.4-cgi
      - php8.4-fpm
      - php8.4-sqlite3
      - php8.4-curl
      - sqlite3
      - dnsutils
      - net-tools
      - mtr
      - python3
      - python3-dev
      - python3-psutil
      - iproute2
      - nmap
      - fping
      - python3-pip
      - zip
      - usbutils
      - traceroute
      - nbtscan
      - avahi-daemon
      - avahi-utils
      - build-essential
      - git
      - gnupg2
      - lsb-release
      - debian-archive-keyring
      - python3-venv
      - nginx
      - nftables
    state: present
    update_cache: true
    cache_valid_time: 86400
