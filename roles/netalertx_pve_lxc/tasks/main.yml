---
# Generic LXC resource lifecycle. Called ONLY by the root-owned worker.
# This stage creates a STOPPED, link-down, protected guest. It never adopts
# an unknown VM/CT, starts the network, or touches another VMID.
- name: Verify controlled PVE provisioning contract
  ansible.builtin.assert:
    that:
      - netalertx_pve_worker_approved | default(false) | bool
      - netalertx.security.provision_approved | bool
      - netalertx.security.dhcp_exclusion_verified | bool
      - netalertx.deployment == 'native'
      - netalertx.platform == 'lxc'
      - netalertx.security.unprivileged | bool
      - (netalertx.vmid | int) not in (netalertx.security.protected_vmids | map('int') | list)
      - netalertx.hostname == 'netalertx-' ~ site.id
      - netalertx.os.distribution == 'debian'
      - netalertx.os.major_version | int == 13
      - netalertx.os.template is match('^local:vztmpl/debian-13-standard_[0-9.]+-[0-9]+_amd64\\.tar\\.zst$')
      - netalertx.os.template_sha256 is match('^[0-9a-f]{64}$')
      - netalertx.network.bridge is match('^vmbr[0-9]+$')
      - netalertx.network.ipv4 is match('^192\\.168\\.[0-9]+\\.[0-9]+/24$')
      - netalertx.network.gateway is match('^192\\.168\\.[0-9]+\\.[0-9]+$')
      - netalertx.network.dns is match('^192\\.168\\.[0-9]+\\.[0-9]+$')
      - netalertx.vmid | int == 1000 + (netalertx.network.ipv4.split('/')[0].split('.')[-1] | int)
      - netalertx.resources.cores | int >= 1
      - netalertx.resources.memory_mb | int >= 512
      - netalertx.resources.rootfs_gb | int >= 8
      - netalertx.resources.storage is match('^[a-zA-Z0-9_-]+$')
    fail_msg: "PVE provisioning blocked: worker authority, identity, DHCP gate or desired state failed."

- name: Verify trusted PVE host identity
  ansible.builtin.command:
    argv: [hostname, -s]
  delegate_to: dh_netalertx_pve
  become: false
  register: netalertx_pve_hostname
  changed_when: false

- name: Require PVE hostname matching canonical node
  ansible.builtin.assert:
    that: netalertx_pve_hostname.stdout == pve.node

- name: Inspect target CT config path via PVE only
  ansible.builtin.stat:
    path: "/etc/pve/lxc/{{ netalertx.vmid }}.conf"
  delegate_to: dh_netalertx_pve
  become: true
  register: netalertx_pve_target

- name: Reject VMID occupied by a QEMU guest
  ansible.builtin.command:
    argv: [qm, status, "{{ netalertx.vmid }}"]
  delegate_to: dh_netalertx_pve
  become: true
  register: netalertx_pve_qemu
  changed_when: false
  failed_when: false

- name: Require target VMID not owned by QEMU
  ansible.builtin.assert:
    that: netalertx_pve_qemu.rc != 0
    fail_msg: "VMID belongs to a VM; never adopt or overwrite."

- name: Inspect an existing LXC without changing it
  ansible.builtin.command:
    argv: [pct, config, "{{ netalertx.vmid }}"]
  delegate_to: dh_netalertx_pve
  become: true
  register: netalertx_pve_existing
  changed_when: false
  when: netalertx_pve_target.stat.exists

- name: Refuse takeover of an unknown or drifted LXC
  ansible.builtin.assert:
    that:
      - "('hostname: ' ~ netalertx.hostname) in netalertx_pve_existing.stdout_lines"
      - "('description: DigitalHouses native NetAlertX site=' ~ site.id) in netalertx_pve_existing.stdout_lines"
      - "'unprivileged: 1' in netalertx_pve_existing.stdout_lines"
      - "('ip=' ~ netalertx.network.ipv4) in netalertx_pve_existing.stdout"
      - "('bridge=' ~ netalertx.network.bridge) in netalertx_pve_existing.stdout"
      - "('gw=' ~ netalertx.network.gateway) in netalertx_pve_existing.stdout"
      - "('rootfs: ' ~ netalertx.resources.storage ~ ':') in netalertx_pve_existing.stdout"
    fail_msg: "Existing CT has no exact ownership marker or configuration drift; no automatic adoption."
  when: netalertx_pve_target.stat.exists

- name: Check Debian 13 LXC template SHA on PVE
  ansible.builtin.command:
    argv:
      - sha256sum
      - "/var/lib/vz/template/cache/{{ netalertx.os.template.split('/')[-1] }}"
  delegate_to: dh_netalertx_pve
  become: true
  changed_when: false
  register: netalertx_pve_template_sha
  when: not netalertx_pve_target.stat.exists

- name: Require pinned OS template bytes
  ansible.builtin.assert:
    that: netalertx_pve_template_sha.stdout.split()[0] == netalertx.os.template_sha256
    fail_msg: "Debian template differs from pinned SHA; blocked."
  when: not netalertx_pve_target.stat.exists

- name: Verify available PVE memory before creating a new CT
  ansible.builtin.command:
    argv: [free, -m]
  delegate_to: dh_netalertx_pve
  become: false
  register: netalertx_pve_free
  changed_when: false
  when: not netalertx_pve_target.stat.exists

- name: Require capacity for guest and 1 GiB host headroom
  ansible.builtin.assert:
    that: (netalertx_pve_free.stdout_lines[1].split()[-1] | int) >= ((netalertx.resources.memory_mb | int) + 1024)
  when: not netalertx_pve_target.stat.exists

- name: Create ONLY the absent LXC (stopped, protected, network disconnected)
  ansible.builtin.command:
    argv:
      - pct
      - create
      - "{{ netalertx.vmid }}"
      - "{{ netalertx.os.template }}"
      - --hostname
      - "{{ netalertx.hostname }}"
      - --description
      - "DigitalHouses native NetAlertX site={{ site.id }}"
      - --ostype
      - debian
      - --unprivileged
      - "1"
      - --features
      - "nesting={{ 1 if netalertx.security.nesting else 0 }}"
      - --cores
      - "{{ netalertx.resources.cores }}"
      - --memory
      - "{{ netalertx.resources.memory_mb }}"
      - --swap
      - "{{ netalertx.resources.swap_mb }}"
      - --rootfs
      - "{{ netalertx.resources.storage }}:{{ netalertx.resources.rootfs_gb }}"
      - --net0
      - "name=eth0,bridge={{ netalertx.network.bridge }},ip={{ netalertx.network.ipv4 }},gw={{ netalertx.network.gateway }},ip6=manual,link_down=1,firewall=1"
      - --nameserver
      - "{{ netalertx.network.dns }}"
      - --onboot
      - "0"
      - --start
      - "0"
      - --protection
      - "1"
  delegate_to: dh_netalertx_pve
  become: true
  register: netalertx_pve_created
  when: not netalertx_pve_target.stat.exists
  changed_when: true

- name: Verify exact final container owner marker and protection
  ansible.builtin.command:
    argv: [pct, config, "{{ netalertx.vmid }}"]
  delegate_to: dh_netalertx_pve
  become: true
  register: netalertx_pve_final
  changed_when: false

- name: Require expected identity and non-destructive PVE flags
  ansible.builtin.assert:
    that:
      - "('hostname: ' ~ netalertx.hostname) in netalertx_pve_final.stdout_lines"
      - "('description: DigitalHouses native NetAlertX site=' ~ site.id) in netalertx_pve_final.stdout_lines"
      - "'protection: 1' in netalertx_pve_final.stdout_lines"
      - "'unprivileged: 1' in netalertx_pve_final.stdout_lines"
      - "('ip=' ~ netalertx.network.ipv4) in netalertx_pve_final.stdout"
    fail_msg: "PVE config does not match desired ownership and safety constraints."

- name: Report stopped-only PVE phase without pretending application is installed
  ansible.builtin.debug:
    msg:
      phase: PVE_LXC_GUARDED
      vmid: "{{ netalertx.vmid }}"
      created: "{{ netalertx_pve_created.changed | default(false) }}"
      app_installed: false
      network_started: false
      other_guests_touched: false
