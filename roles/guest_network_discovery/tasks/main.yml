---
# Guarded new-guest network baseline. This role does not retrofit fleet hosts.
- name: Require approved LAN mDNS guest contract
  ansible.builtin.assert:
    that:
      - guest_network_discovery_approved is defined
      - guest_network_discovery_approved | bool
      - guest_network_discovery_hostname is defined
      - guest_network_discovery_hostname is match('^[a-z0-9][a-z0-9-]{1,62}$')
      - guest_network_discovery_ip is defined
      - guest_network_discovery_ip is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - guest_network_discovery_cidr is defined
      - guest_network_discovery_cidr is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$')
      - guest_network_discovery_provider is defined
      - guest_network_discovery_provider in ['avahi', 'native']
      - guest_network_discovery_delegate is defined
      - guest_network_discovery_delegate | length > 0
    fail_msg: GUEST_MDNS_CONTRACT_REQUIRED

- name: Read actual guest hostname
  ansible.builtin.command:
    argv: [hostname, -s]
  register: dh_guest_mdns_hostname
  changed_when: false

- name: Require approved guest identity before package changes
  ansible.builtin.assert:
    that:
      - dh_guest_mdns_hostname.stdout == guest_network_discovery_hostname
    fail_msg: GUEST_MDNS_HOSTNAME_MISMATCH

- name: Gather only minimal guest operating system facts
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Require Debian-family guest for Avahi installation
  ansible.builtin.assert:
    that:
      - guest_network_discovery_provider != 'avahi' or ansible_facts['os_family'] == 'Debian'
    fail_msg: GUEST_MDNS_PROVIDER_UNSUPPORTED

- name: Inspect pre-existing UDP mDNS listeners
  ansible.builtin.command:
    argv: [ss, -H, -u, -l, -n, -p]
  register: dh_guest_mdns_udp
  changed_when: false
  when: guest_network_discovery_provider == 'avahi'

- name: Reject competing non-Avahi responder
  ansible.builtin.assert:
    that:
      - >-
        (dh_guest_mdns_udp.stdout_lines |
         select('search', '[:.]5353(?:\s|$)') |
         reject('search', 'avahi-daemon') | list | length) == 0
    fail_msg: GUEST_MDNS_COMPETING_RESPONDER
  when: guest_network_discovery_provider == 'avahi'

- name: Install standard mDNS daemon on selected Debian guest
  ansible.builtin.apt:
    name: avahi-daemon
    state: present
  when: guest_network_discovery_provider == 'avahi'

- name: Enable Avahi without unnecessary restart
  ansible.builtin.systemd_service:
    name: avahi-daemon.service
    enabled: true
    state: started
  when: guest_network_discovery_provider == 'avahi'

- name: Verify responder active on the guest
  ansible.builtin.command:
    argv: [systemctl, is-active, avahi-daemon.service]
  register: dh_guest_mdns_service
  changed_when: false
  when: guest_network_discovery_provider == 'avahi'

- name: Require active Avahi responder
  ansible.builtin.assert:
    that:
      - dh_guest_mdns_service.stdout == 'active'
    fail_msg: GUEST_MDNS_DAEMON_NOT_ACTIVE
  when: guest_network_discovery_provider == 'avahi'

- name: Query actual mDNS A record from independent LAN node
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/dh-mdns-probe.py --name {{ guest_network_discovery_hostname }}.local --ip {{ guest_network_discovery_ip }} --cidr {{ guest_network_discovery_cidr }}"
  delegate_to: "{{ guest_network_discovery_delegate }}"
  become: false
  register: dh_guest_mdns_probe
  changed_when: false
  retries: 5
  delay: 3
  until: dh_guest_mdns_probe.rc == 0

- name: Require independent LAN self-publication
  ansible.builtin.assert:
    that:
      - "'GUEST_MDNS=VERIFIED' in dh_guest_mdns_probe.stdout_lines"
    fail_msg: GUEST_MDNS_LAN_VERIFICATION_FAILED
