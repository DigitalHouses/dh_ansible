---
- name: Require declarative existing ZFS media identity
  ansible.builtin.assert:
    that:
      - media_vm.storage is mapping
      - media_vm.storage.mode == 'readonly'
      - media_vm.storage.pool_name is match('^[a-zA-Z][a-zA-Z0-9_-]+$')
      - media_vm.storage.pool_guid is match('^[0-9]{8,24}$')
      - media_vm.storage.partition_partuuid is match('^[0-9a-f-]{36}$')
      - media_vm.storage.media_dataset is match('^[a-zA-Z][a-zA-Z0-9_-]+(/[a-zA-Z0-9_.-]+)+$')
      - media_vm.storage.media_dataset.split('/')[0] == media_vm.storage.pool_name
      - media_vm.os.distribution == 'debian'
      - media_vm.os.major_version | int == 13
      - media_vm.discovery.netbios_name is match('^[A-Z0-9-]{1,15}$')
      - media_vm.discovery.workgroup is match('^[A-Z0-9-]{1,15}$')

- name: Enable Debian contrib for supported ZFS packages
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/debian.sources
    regexp: '^(Components:\s*)main$'
    replace: '\1main contrib non-free-firmware'
  register: media_debian_sources

- name: Install QEMU Guest Agent, supported OpenZFS and Plex dependencies
  ansible.builtin.apt:
    name:
      - qemu-guest-agent
      - linux-headers-amd64
      - zfs-dkms
      - zfsutils-linux
      - zfs-zed
      - firmware-intel-graphics
      - intel-media-va-driver
      - vainfo
      - curl
      - gnupg
      - samba
      - wsdd2
      - smbclient
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Start QEMU Guest Agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent.service
    state: started

- name: Ensure APT signing-key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download official Plex repository signing key
  ansible.builtin.get_url:
    url: https://downloads.plex.tv/plex-keys/PlexSign.v2.key
    dest: /etc/apt/keyrings/plex_signing.asc
    mode: '0644'

- name: Convert official Plex signing key for APT
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --dearmor
      - -o
      - /etc/apt/keyrings/plexmediaserver.v2.gpg
      - /etc/apt/keyrings/plex_signing.asc
    creates: /etc/apt/keyrings/plexmediaserver.v2.gpg

- name: Configure official Plex APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/plex.list
    content: "deb [signed-by=/etc/apt/keyrings/plexmediaserver.v2.gpg] https://repo.plex.tv/deb/ public main\n"
    mode: '0644'

- name: Install Plex Media Server
  ansible.builtin.apt:
    name: plexmediaserver
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Give Plex Intel GPU render access
  ansible.builtin.user:
    name: plex
    groups:
      - video
      - render
    append: true
  register: media_plex_groups

- name: Disable generic ZFS auto-import and auto-mount for this dedicated readonly guest
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
  loop:
    - zfs-import-cache.service
    - zfs-mount.service

- name: Install persistent readonly ZFS media importer
  ansible.builtin.template:
    src: dh-media-zfs-mount.sh.j2
    dest: /usr/local/sbin/dh-media-zfs-mount
    owner: root
    group: root
    mode: '0755'

- name: Install systemd unit to mount only media dataset
  ansible.builtin.copy:
    src: dh-media-zfs.service
    dest: /etc/systemd/system/dh-media-zfs.service
    owner: root
    group: root
    mode: '0644'

- name: Enable and start readonly media dataset mount
  ansible.builtin.systemd_service:
    name: dh-media-zfs.service
    daemon_reload: true
    enabled: true
    state: started

- name: Advertise existing readonly media library over SMB
  ansible.builtin.template:
    src: media-smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'
    validate: 'testparm -s %s'
  register: media_smb_configuration

- name: Start Samba and Windows WS-Discovery services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: "{{ 'restarted' if media_smb_configuration.changed else 'started' }}"
  loop:
    - smbd.service
    - nmbd.service
    - wsdd2.service

- name: Confirm readonly guest SMB share is reachable
  ansible.builtin.command:
    argv:
      - smbclient
      - -N
      - //127.0.0.1/Media
      - -c
      - ls
  changed_when: false

- name: Start Plex with Intel video/render permissions
  ansible.builtin.systemd_service:
    name: plexmediaserver.service
    enabled: true
    state: "{{ 'restarted' if media_plex_groups.changed else 'started' }}"

- name: Validate existing library paths readable by Plex
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - plex
      - --
      - test
      - -r
      - "{{ '/' ~ media_vm.storage.media_dataset ~ '/' ~ item }}"
  loop:
    - movies
    - tvshows
    - music
  changed_when: false

- name: Inspect existing Plex library paths without changing its database
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - plex
      - --
      - python3
      - -c
      - |
        import sqlite3
        db = "/var/lib/plexmediaserver/Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.db"
        with sqlite3.connect("file:" + db + "?mode=ro", uri=True) as connection:
            for (path,) in connection.execute("SELECT root_path FROM section_locations"):
                print(path)
  register: media_existing_plex_paths
  changed_when: false

- name: Create missing Plex libraries using the installed Plex scanner
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - plex
      - --
      - /usr/lib/plexmediaserver/Plex Media Scanner
      - --add-section
      - "{{ item.title }}"
      - --type
      - "{{ item.type }}"
      - --agent
      - "{{ item.agent }}"
      - --location
      - "{{ '/' ~ media_vm.storage.media_dataset ~ '/' ~ item.folder }}"
      - --lang
      - ru
  loop:
    - {title: 'Фильмы', folder: movies, type: '1', agent: 'tv.plex.agents.movie'}
    - {title: 'Сериалы', folder: tvshows, type: '2', agent: 'tv.plex.agents.series'}
    - {title: 'Музыка', folder: music, type: '8', agent: 'tv.plex.agents.music'}
  when: ('/' ~ media_vm.storage.media_dataset ~ '/' ~ item.folder) not in media_existing_plex_paths.stdout_lines
  register: media_new_plex_sections

- name: Scan only newly created Plex libraries
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - plex
      - --
      - /usr/lib/plexmediaserver/Plex Media Scanner
      - --scan
      - --section
      - "{{ item.stdout | regex_search('ID [0-9]+') | regex_replace('ID ', '') }}"
  loop: "{{ media_new_plex_sections.results }}"
  when: item.changed | default(false)

- name: Validate Plex local HTTP service
  ansible.builtin.uri:
    url: http://127.0.0.1:32400/identity
    status_code: 200
    return_content: false
  register: media_plex_http
  changed_when: false

- name: Validate readonly ZFS import and pool GUID
  ansible.builtin.command:
    argv:
      - zpool
      - get
      - -H
      - -o
      - value
      - "{{ item }}"
      - "{{ media_vm.storage.pool_name }}"
  loop:
    - readonly
    - guid
  register: media_zfs_properties
  changed_when: false

- name: Verify final media service state
  ansible.builtin.assert:
    that:
      - media_zfs_properties.results[0].stdout == 'on'
      - media_zfs_properties.results[1].stdout == media_vm.storage.pool_guid
      - media_plex_http.status == 200

- name: Require declarative selection of media management applications
  ansible.builtin.assert:
    that:
      - media_vm.applications is mapping
      - media_vm.applications.radarr is boolean
      - media_vm.applications.sonarr is boolean

- name: Create shared media application group
  ansible.builtin.group:
    name: media
    system: true
    state: present

- name: Create native application users
  ansible.builtin.user:
    name: "{{ item.slug }}"
    group: media
    system: true
    home: "/var/lib/{{ item.slug }}"
    create_home: false
    shell: /usr/sbin/nologin
    state: present
  loop: "{{ media_arr_releases }}"
  when: media_vm.applications[item.slug] | bool

- name: Create application data directories on Debian system disk
  ansible.builtin.file:
    path: "/var/lib/{{ item.slug }}"
    state: directory
    owner: "{{ item.slug }}"
    group: media
    mode: '0775'
  loop: "{{ media_arr_releases }}"
  when: media_vm.applications[item.slug] | bool

- name: Create artifact cache on Debian system disk
  ansible.builtin.file:
    path: /var/cache/digitalhouses/media
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download pinned upstream Radarr/Sonarr release archives
  ansible.builtin.get_url:
    url: "{{ item.source }}"
    dest: "/var/cache/digitalhouses/media/{{ item.archive }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: '0644'
    timeout: 120
  loop: "{{ media_arr_releases }}"
  when: media_vm.applications[item.slug] | bool

- name: Extract native media management binaries
  ansible.builtin.unarchive:
    src: "/var/cache/digitalhouses/media/{{ item.archive }}"
    dest: /opt
    remote_src: true
    creates: "/opt/{{ item.name }}/{{ item.name }}"
    owner: root
    group: root
  loop: "{{ media_arr_releases }}"
  when: media_vm.applications[item.slug] | bool

- name: Install native Radarr/Sonarr service definitions
  ansible.builtin.template:
    src: media-arr.service.j2
    dest: "/etc/systemd/system/{{ item.slug }}.service"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ media_arr_releases }}"
  when: media_vm.applications[item.slug] | bool

- name: Enable and start native media management services
  ansible.builtin.systemd_service:
    name: "{{ item.slug }}.service"
    daemon_reload: true
    enabled: true
    state: started
  loop: "{{ media_arr_releases }}"
  when: media_vm.applications[item.slug] | bool

- name: Wait until native media applications listen on their ports
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item.port }}"
    state: started
    timeout: 120
  loop: "{{ media_arr_releases }}"
  when: media_vm.applications[item.slug] | bool

- name: Check HTTP access to native media application UI
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item.port }}/"
    status_code: [200, 302, 401, 403]
    return_content: false
  loop: "{{ media_arr_releases }}"
  when: media_vm.applications[item.slug] | bool
  changed_when: false

- name: Report installed Plex service and existing readonly ZFS media
  ansible.builtin.debug:
    msg:
      result: PLEX_READY
      media: "{{ '/' ~ media_vm.storage.media_dataset }}"
      plex: "http://{{ ansible_host }}:32400/web"
      pool_mode: readonly
      agent: active
