---
- name: Install Docker for Sambee
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
  when: media_vm.applications.sambee | default(true) | bool

- name: Ensure Docker running
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
  when: media_vm.applications.sambee | default(true) | bool

- name: Prepare Sambee application configuration directory
  ansible.builtin.file:
    path: /opt/dh-sambee
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: media_vm.applications.sambee | default(true) | bool

- name: Allow Sambee UID 1000 to persist its SQLite database
  ansible.builtin.file:
    path: /opt/dh-sambee/data
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0750'
    recurse: true
  when: media_vm.applications.sambee | default(true) | bool

- name: Declare the initial Sambee owner without storing a password
  ansible.builtin.template:
    src: media-sambee-config.toml.j2
    dest: /opt/dh-sambee/config.toml
    owner: root
    group: root
    mode: '0644'
  when: media_vm.applications.sambee | default(true) | bool

- name: Install Sambee container definition
  ansible.builtin.template:
    src: media-sambee-compose.yml.j2
    dest: /opt/dh-sambee/docker-compose.yml
    mode: '0644'
  when: media_vm.applications.sambee | default(true) | bool

- name: Start or reconcile Sambee service
  ansible.builtin.command:
    argv: [docker, compose, -f, /opt/dh-sambee/docker-compose.yml, up, -d]
  register: media_sambee_up
  changed_when: "'Started' in media_sambee_up.stderr or 'Created' in media_sambee_up.stderr"
  when: media_vm.applications.sambee | default(true) | bool

- name: Install guarded Sambee firstboot identity recovery helper
  ansible.builtin.copy:
    src: dh-sambee-firstboot-recovery.py
    dest: /usr/local/sbin/dh-sambee-firstboot-recovery
    owner: root
    group: root
    mode: '0700'
  when: media_vm.applications.sambee | bool

- name: Inspect whether empty preexisting Sambee admin state needs recovery
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/dh-sambee-firstboot-recovery
      - --check
      - --credentials-file
      - "/{{ media_vm.storage.pool_name }}/digitalhouses/credentials/{{ media_vm.file_access.accounts | selectattr('role', 'equalto', 'owner') | map(attribute='name') | first }}.txt"
  register: media_sambee_firstboot_recovery
  changed_when: false
  # Fresh Sambee creates the DB before its migration/user tables exist.
  # Retry ONLY that transient bootstrap state; all foreign/unsafe state
  # errors must fail closed immediately without snapshot or DB replacement.
  retries: 30
  delay: 2
  until: >-
    media_sambee_firstboot_recovery.rc == 0 or
    'SAMBEE_RECOVERY=BLOCKED_SAMBEE_RECOVERY_EXPECTED_TABLE_MISSING'
    not in (media_sambee_firstboot_recovery.stderr | default(''))
  failed_when: media_sambee_firstboot_recovery.rc != 0
  when: media_vm.applications.sambee | bool

- name: Stop only empty preexisting Sambee bootstrap container for protected recovery
  ansible.builtin.command:
    argv: [docker, compose, -f, /opt/dh-sambee/docker-compose.yml, stop, sambee]
  when:
    - media_vm.applications.sambee | bool
    - "'SAMBEE_RECOVERY=REQUIRED' in media_sambee_firstboot_recovery.stdout_lines"

- name: Preserve entire legacy Sambee database with atomic root-only snapshot
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/dh-sambee-firstboot-recovery
      - --apply
      - --credentials-file
      - "/{{ media_vm.storage.pool_name }}/digitalhouses/credentials/{{ media_vm.file_access.accounts | selectattr('role', 'equalto', 'owner') | map(attribute='name') | first }}.txt"
  register: media_sambee_firstboot_snapshot
  changed_when: "'SAMBEE_RECOVERY=BACKUP_SAVED_NEW_DATA_STAGED' in media_sambee_firstboot_snapshot.stdout_lines"
  when:
    - media_vm.applications.sambee | bool
    - "'SAMBEE_RECOVERY=REQUIRED' in media_sambee_firstboot_recovery.stdout_lines"

- name: Recreate only the Sambee container against verified clean application data
  ansible.builtin.command:
    argv: [docker, compose, -f, /opt/dh-sambee/docker-compose.yml, up, -d, --force-recreate, sambee]
  when:
    - media_vm.applications.sambee | bool
    - "'SAMBEE_RECOVERY=REQUIRED' in media_sambee_firstboot_recovery.stdout_lines"

- name: Wait for Sambee HTTP UI
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/
    status_code: [200, 302, 307, 401]
  retries: 30
  delay: 5
  register: media_sambee_http
  until: media_sambee_http.status in [200, 302, 307, 401]
  changed_when: false
  when: media_vm.applications.sambee | default(true) | bool

- name: Verify fresh Sambee bootstrap created the Fleet owner before password reconciliation
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/dh-sambee-firstboot-recovery
      - --verify-new-owner
      - --credentials-file
      - "/{{ media_vm.storage.pool_name }}/digitalhouses/credentials/{{ media_vm.file_access.accounts | selectattr('role', 'equalto', 'owner') | map(attribute='name') | first }}.txt"
  changed_when: false
  when:
    - media_vm.applications.sambee | bool
    - "'SAMBEE_RECOVERY=REQUIRED' in media_sambee_firstboot_recovery.stdout_lines"

- name: Install protected Sambee local-owner commissioning helper
  ansible.builtin.copy:
    src: dh-sambee-owner.py
    dest: /usr/local/sbin/dh-sambee-owner
    owner: root
    group: root
    mode: '0700'
  when: media_vm.applications.sambee | default(true) | bool

- name: Commission Sambee using the shared eight-character owner password
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/dh-sambee-owner
      - --credentials-file
      - "/{{ media_vm.storage.pool_name }}/digitalhouses/credentials/{{ media_vm.file_access.accounts | selectattr('role','equalto','owner') | map(attribute='name') | first }}.txt"
      - --compose-file
      - /opt/dh-sambee/docker-compose.yml
  register: media_sambee_owner
  changed_when: "'SAM_BEE_OWNER=COMMISSIONED' in media_sambee_owner.stdout or 'SAM_BEE_OWNER=RESTORED' in media_sambee_owner.stdout"
  no_log: true
  when: media_vm.applications.sambee | default(true) | bool

- name: Create Filestash service identity
  ansible.builtin.user:
    name: filestash
    system: true
    home: /var/lib/filestash
    create_home: true
    shell: /usr/sbin/nologin
  when: media_vm.applications.filestash | default(true) | bool

# The upstream native binary anchors its default data directory to its
# executable location, not to systemd WorkingDirectory. Keep code root-owned
# and mutable state under a dedicated, non-root-writable service directory.
- name: Create root-owned Filestash executable directory
  ansible.builtin.file:
    path: /opt/dh-filestash
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: media_vm.applications.filestash | default(true) | bool

- name: Create persistent native Filestash state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: filestash
    group: filestash
    mode: '0750'
  loop:
    - /opt/dh-filestash/data
    - /opt/dh-filestash/data/state
    - /opt/dh-filestash/data/state/log
    - /opt/dh-filestash/data/state/config
    - /opt/dh-filestash/data/state/db
    - /opt/dh-filestash/data/state/certs
    - /opt/dh-filestash/data/state/plugins
    - /opt/dh-filestash/data/state/search
  when: media_vm.applications.filestash | default(true) | bool

- name: Download upstream native Filestash executable
  ansible.builtin.get_url:
    url: https://downloads.filestash.app/latest/filestash_linux_x86_64.bin
    dest: /opt/dh-filestash/filestash
    owner: root
    group: root
    mode: '0755'
    force: false
    timeout: 180
  register: media_filestash_binary
  when: media_vm.applications.filestash | default(true) | bool

- name: Install Filestash service definition
  ansible.builtin.template:
    src: media-filestash.service.j2
    dest: /etc/systemd/system/filestash.service
    owner: root
    group: root
    mode: '0644'
  register: media_filestash_unit
  when: media_vm.applications.filestash | default(true) | bool

- name: Install Filestash single-login SMB backend reconciler
  ansible.builtin.copy:
    src: dh-filestash-smb-config.py
    dest: /usr/local/sbin/dh-filestash-smb-config
    owner: root
    group: root
    mode: '0700'
  when: media_vm.applications.filestash | default(true) | bool

- name: Reconcile Filestash SMB passthrough without creating web users
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/dh-filestash-smb-config
      - --repair-broken-idp
      - --credential-file
      - "/{{ media_vm.storage.pool_name }}/digitalhouses/credentials/{{ media_vm.file_access.accounts | selectattr('role', 'equalto', 'owner') | map(attribute='name') | first }}.txt"
  register: media_filestash_smb
  changed_when: "'FILESTASH_SMB=RECONCILED' in media_filestash_smb.stdout"
  when: media_vm.applications.filestash | default(true) | bool

- name: Inspect protected Filestash administrator environment
  ansible.builtin.stat:
    path: /etc/digitalhouses/filestash.env
  register: media_filestash_admin_env
  when: media_vm.applications.filestash | default(true) | bool

- name: Refuse unclaimed Filestash admin setup on reachable HTTP port
  ansible.builtin.assert:
    that:
      - media_filestash_admin_env.stat.isreg | default(false)
      - media_filestash_admin_env.stat.pw_name == 'root'
      - media_filestash_admin_env.stat.mode == '0600'
    fail_msg: MEDIA_FILESTASH_ADMIN_CREDENTIALS_NOT_COMMISSIONED
  when: media_vm.applications.filestash | default(true) | bool

- name: Inspect protected Filestash admin hash format
  ansible.builtin.slurp:
    src: /etc/digitalhouses/filestash.env
  register: media_filestash_admin_credential
  no_log: true
  when: media_vm.applications.filestash | default(true) | bool

- name: Refuse an empty or invalid Filestash administrative bcrypt hash
  ansible.builtin.assert:
    that:
      - (media_filestash_admin_credential.content | b64decode | trim) is match("^ADMIN_PASSWORD=[$]2[aby][$][0-9]{2}[$][./A-Za-z0-9]{53}$")
    fail_msg: MEDIA_FILESTASH_ADMIN_HASH_INVALID
  no_log: true
  when: media_vm.applications.filestash | default(true) | bool

- name: Start Filestash
  ansible.builtin.systemd_service:
    name: filestash.service
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if media_filestash_unit.changed or media_filestash_binary.changed or media_filestash_smb.changed else 'started' }}"
  when: media_vm.applications.filestash | default(true) | bool

- name: Wait for Filestash HTTP UI
  ansible.builtin.uri:
    url: http://127.0.0.1:8334/
    status_code: [200, 301, 302, 307, 401]
  retries: 20
  delay: 4
  register: media_filestash_http
  until: media_filestash_http.status in [200, 301, 302, 307, 401]
  changed_when: false
  when: media_vm.applications.filestash | default(true) | bool

# An HTTP 200 on "/" is not proof: encrypted IDP drift can render only
# a 307 to "/?error=Not Valid&trace=unpacking idp" for every user.
- name: Verify actual Filestash SMB username and password entrypoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:8334/api/session/auth/?action=redirect&label=DigitalHouses%20SMB"
    follow_redirects: none
    status_code: 200
    return_content: true
  register: media_filestash_auth_entrypoint
  retries: 5
  delay: 2
  until: media_filestash_auth_entrypoint.status == 200
  changed_when: false
  when: media_vm.applications.filestash | default(true) | bool

- name: Refuse Filestash login page without SMB owner credential fields
  ansible.builtin.assert:
    that:
      - "'name=\"user\"' in media_filestash_auth_entrypoint.content"
      - "'name=\"password\"' in media_filestash_auth_entrypoint.content"
    fail_msg: FILESTASH_SMB_IDP_LOGIN_BROKEN
  when: media_vm.applications.filestash | default(true) | bool

- name: Download official Jellyfin APT signing key
  ansible.builtin.get_url:
    url: https://repo.jellyfin.org/jellyfin_team.gpg.key
    dest: /etc/apt/keyrings/jellyfin.asc
    mode: '0644'
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Convert Jellyfin signing key for APT
  ansible.builtin.command:
    argv: [gpg, --batch, --dearmor, -o, /etc/apt/keyrings/jellyfin.gpg, /etc/apt/keyrings/jellyfin.asc]
    creates: /etc/apt/keyrings/jellyfin.gpg
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Configure official Debian 13 Jellyfin package repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/jellyfin.sources
    content: |
      Types: deb
      URIs: https://repo.jellyfin.org/debian
      Suites: trixie
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/jellyfin.gpg
    mode: '0644'
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Refresh APT after adding or reconciling Jellyfin repository
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Install Jellyfin native media server
  ansible.builtin.apt:
    name: jellyfin
    state: present
    update_cache: false
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Give Jellyfin declared media library and GPU access
  ansible.builtin.user:
    name: jellyfin
    groups:
      - media_group
      - render
      - video
    append: true
  register: media_jellyfin_groups
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Start Jellyfin
  ansible.builtin.systemd_service:
    name: jellyfin.service
    enabled: true
    state: "{{ 'restarted' if media_jellyfin_groups.changed else 'started' }}"
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Verify Jellyfin HTTP service
  ansible.builtin.uri:
    url: http://127.0.0.1:8096/
    status_code: [200, 301, 302, 307]
  retries: 25
  delay: 4
  register: media_jellyfin_http
  until: media_jellyfin_http.status in [200, 301, 302, 307]
  changed_when: false
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Commission Jellyfin administrator through the protected site passport
  ansible.builtin.import_tasks: jellyfin_bootstrap.yml
  when: media_vm.applications.jellyfin | default(true) | bool
