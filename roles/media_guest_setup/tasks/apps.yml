---
- name: Install Docker for Sambee
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
  when: media_vm.applications.sambee | default(true) | bool

- name: Ensure Docker running
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
  when: media_vm.applications.sambee | default(true) | bool

- name: Prepare Sambee application configuration directory
  ansible.builtin.file:
    path: /opt/dh-sambee
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: media_vm.applications.sambee | default(true) | bool

- name: Allow Sambee UID 1000 to persist its SQLite database
  ansible.builtin.file:
    path: /opt/dh-sambee/data
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0750'
    recurse: true
  when: media_vm.applications.sambee | default(true) | bool

- name: Install Sambee container definition
  ansible.builtin.template:
    src: media-sambee-compose.yml.j2
    dest: /opt/dh-sambee/docker-compose.yml
    mode: '0644'
  when: media_vm.applications.sambee | default(true) | bool

- name: Start or reconcile Sambee service
  ansible.builtin.command:
    argv: [docker, compose, -f, /opt/dh-sambee/docker-compose.yml, up, -d]
  register: media_sambee_up
  changed_when: "'Started' in media_sambee_up.stderr or 'Created' in media_sambee_up.stderr"
  when: media_vm.applications.sambee | default(true) | bool

- name: Wait for Sambee HTTP UI
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/
    status_code: [200, 302, 307, 401]
  retries: 30
  delay: 5
  register: media_sambee_http
  until: media_sambee_http.status in [200, 302, 307, 401]
  changed_when: false
  when: media_vm.applications.sambee | default(true) | bool

- name: Create Filestash service identity
  ansible.builtin.user:
    name: filestash
    system: true
    home: /var/lib/filestash
    create_home: true
    shell: /usr/sbin/nologin
  when: media_vm.applications.filestash | default(true) | bool

# The upstream native binary anchors its default data directory to its
# executable location, not to systemd WorkingDirectory. Keep code root-owned
# and mutable state under a dedicated, non-root-writable service directory.
- name: Create root-owned Filestash executable directory
  ansible.builtin.file:
    path: /opt/dh-filestash
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: media_vm.applications.filestash | default(true) | bool

- name: Create persistent native Filestash state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: filestash
    group: filestash
    mode: '0750'
  loop:
    - /opt/dh-filestash/data
    - /opt/dh-filestash/data/state
    - /opt/dh-filestash/data/state/log
    - /opt/dh-filestash/data/state/config
    - /opt/dh-filestash/data/state/db
    - /opt/dh-filestash/data/state/certs
    - /opt/dh-filestash/data/state/plugins
    - /opt/dh-filestash/data/state/search
  when: media_vm.applications.filestash | default(true) | bool

- name: Download upstream native Filestash executable
  ansible.builtin.get_url:
    url: https://downloads.filestash.app/latest/filestash_linux_x86_64.bin
    dest: /opt/dh-filestash/filestash
    owner: root
    group: root
    mode: '0755'
    force: false
    timeout: 180
  register: media_filestash_binary
  when: media_vm.applications.filestash | default(true) | bool

- name: Install Filestash service definition
  ansible.builtin.template:
    src: media-filestash.service.j2
    dest: /etc/systemd/system/filestash.service
    owner: root
    group: root
    mode: '0644'
  register: media_filestash_unit
  when: media_vm.applications.filestash | default(true) | bool

- name: Install Filestash single-login SMB backend reconciler
  ansible.builtin.copy:
    src: dh-filestash-smb-config.py
    dest: /usr/local/sbin/dh-filestash-smb-config
    owner: root
    group: root
    mode: '0700'
  when: media_vm.applications.filestash | default(true) | bool

- name: Reconcile Filestash SMB passthrough without creating web users
  ansible.builtin.command:
    argv: [/usr/local/sbin/dh-filestash-smb-config]
  register: media_filestash_smb
  changed_when: "'FILESTASH_SMB=RECONCILED' in media_filestash_smb.stdout"
  when: media_vm.applications.filestash | default(true) | bool

- name: Inspect protected Filestash administrator environment
  ansible.builtin.stat:
    path: /etc/digitalhouses/filestash.env
  register: media_filestash_admin_env
  when: media_vm.applications.filestash | default(true) | bool

- name: Refuse unclaimed Filestash admin setup on reachable HTTP port
  ansible.builtin.assert:
    that:
      - media_filestash_admin_env.stat.isreg | default(false)
      - media_filestash_admin_env.stat.pw_name == 'root'
      - media_filestash_admin_env.stat.mode == '0600'
    fail_msg: MEDIA_FILESTASH_ADMIN_CREDENTIALS_NOT_COMMISSIONED
  when: media_vm.applications.filestash | default(true) | bool

- name: Start Filestash
  ansible.builtin.systemd_service:
    name: filestash.service
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if media_filestash_unit.changed or media_filestash_binary.changed or media_filestash_smb.changed else 'started' }}"
  when: media_vm.applications.filestash | default(true) | bool

- name: Wait for Filestash HTTP UI
  ansible.builtin.uri:
    url: http://127.0.0.1:8334/
    status_code: [200, 301, 302, 307, 401]
  retries: 20
  delay: 4
  register: media_filestash_http
  until: media_filestash_http.status in [200, 301, 302, 307, 401]
  changed_when: false
  when: media_vm.applications.filestash | default(true) | bool

- name: Download official Jellyfin APT signing key
  ansible.builtin.get_url:
    url: https://repo.jellyfin.org/jellyfin_team.gpg.key
    dest: /etc/apt/keyrings/jellyfin.asc
    mode: '0644'
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Convert Jellyfin signing key for APT
  ansible.builtin.command:
    argv: [gpg, --batch, --dearmor, -o, /etc/apt/keyrings/jellyfin.gpg, /etc/apt/keyrings/jellyfin.asc]
    creates: /etc/apt/keyrings/jellyfin.gpg
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Configure official Debian 13 Jellyfin package repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/jellyfin.sources
    content: |
      Types: deb
      URIs: https://repo.jellyfin.org/debian
      Suites: trixie
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/jellyfin.gpg
    mode: '0644'
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Refresh APT after adding or reconciling Jellyfin repository
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Install Jellyfin native media server
  ansible.builtin.apt:
    name: jellyfin
    state: present
    update_cache: false
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Give Jellyfin declared media library and GPU access
  ansible.builtin.user:
    name: jellyfin
    groups:
      - media_group
      - render
      - video
    append: true
  register: media_jellyfin_groups
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Start Jellyfin
  ansible.builtin.systemd_service:
    name: jellyfin.service
    enabled: true
    state: "{{ 'restarted' if media_jellyfin_groups.changed else 'started' }}"
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Verify Jellyfin HTTP service
  ansible.builtin.uri:
    url: http://127.0.0.1:8096/
    status_code: [200, 301, 302, 307]
  retries: 25
  delay: 4
  register: media_jellyfin_http
  until: media_jellyfin_http.status in [200, 301, 302, 307]
  changed_when: false
  when: media_vm.applications.jellyfin | default(true) | bool

- name: Commission Jellyfin administrator through the protected site passport
  ansible.builtin.import_tasks: jellyfin_bootstrap.yml
  when: media_vm.applications.jellyfin | default(true) | bool
