---
# Deploy only a local root-only password rotation facility, NOT a public
# password change endpoint. HTTPS user-facing workflow remains gated.
- name: Stage privileged password transaction code without executing it
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item | regex_replace('[.]py$', '') }}"
    owner: root
    group: root
    mode: '0700'
  loop:
    - dh-media-password-transaction.py
    - dh-media-password-adapters.py
    - dh-media-password-rotate.py

- name: Store trusted site-only password rotation manifest without secrets
  ansible.builtin.copy:
    dest: /etc/digitalhouses/media-password-rotation.json
    content: "{{ {'schema': 1, 'owner': (media_vm.file_access.accounts | selectattr('role', 'equalto', 'owner') | map(attribute='name') | first), 'pool': media_vm.storage.pool_name, 'guest_ipv4': media_vm.network.ipv4.split('/')[0], 'apps': {'jellyfin': (media_vm.applications.jellyfin | default(false) | bool), 'sambee': (media_vm.applications.sambee | default(false) | bool), 'filestash': (media_vm.applications.filestash | default(false) | bool), 'radarr': (media_vm.applications.radarr | bool), 'sonarr': (media_vm.applications.sonarr | bool), 'prowlarr': (media_vm.applications.prowlarr | bool), 'qbittorrent': (media_vm.applications.qbittorrent | bool)}} | to_nice_json }}\n"
    owner: root
    group: root
    mode: '0600'

- name: Require mandatory native media authentication adapters
  ansible.builtin.assert:
    that:
      - media_vm.applications.radarr | bool
      - media_vm.applications.sonarr | bool
      - media_vm.applications.prowlarr | bool
      - media_vm.applications.qbittorrent | bool
    fail_msg: MEDIA_PASSWORD_ROTATION_REQUIRED_APPS_MISSING

- name: Confirm no customer-facing password change route exists on HTTP
  ansible.builtin.assert:
    that:
      - media_owner_rotation_pending is defined
      - not (media_owner_rotation_pending.stat.exists | default(false))
    fail_msg: MEDIA_PASSWORD_ROTATION_PENDING_RECOVERY
