---
# Standalone first-party HTTPS password management. No Ansible runtime needed
# after provisioning. Never forward credentials through the HTTP port 80.
- name: Require exact guest IPv4 portal identity and correct password rotation primitives
  ansible.builtin.assert:
    that:
      - media_vm.network.ipv4 is match('^[0-9.]+/24$')
      - media_vm.network.ipv4.split('/')[0] == ansible_host
    fail_msg: MEDIA_ACCOUNT_SITE_IP_REQUIRED

- name: Install OS TLS certificate generation support
  ansible.builtin.apt:
    name: openssl
    state: present

- name: Prepare root-only account certificate directory
  ansible.builtin.file:
    path: /etc/digitalhouses/media-account-pki
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Inspect existing local trust anchor
  ansible.builtin.stat:
    path: /etc/digitalhouses/media-account-pki/ca.key
  register: media_account_ca_key

- name: Inspect existing trust certificate
  ansible.builtin.stat:
    path: /etc/digitalhouses/media-account-pki/ca.crt
  register: media_account_ca_cert

- name: Never silently replace a partial local CA
  ansible.builtin.assert:
    that:
      - media_account_ca_key.stat.exists == media_account_ca_cert.stat.exists
    fail_msg: MEDIA_ACCOUNT_CA_PARTIAL_OR_DRIFT

- name: Create local private CA if absent
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:3072
      - -nodes
      - -sha256
      - -days
      - '3650'
      - -subj
      - '/CN=DigitalHouses Media Local CA'
      - -keyout
      - /etc/digitalhouses/media-account-pki/ca.key
      - -out
      - /etc/digitalhouses/media-account-pki/ca.crt
  when: not media_account_ca_key.stat.exists
  no_log: true

- name: Inspect server private key
  ansible.builtin.stat:
    path: /etc/digitalhouses/media-account-pki/server.key
  register: media_account_server_key

- name: Inspect HTTPS server certificate
  ansible.builtin.stat:
    path: /etc/digitalhouses/media-account-pki/server.crt
  register: media_account_server_cert

- name: Reject partial or drifted server TLS identity
  ansible.builtin.assert:
    that:
      - media_account_server_key.stat.exists == media_account_server_cert.stat.exists
    fail_msg: MEDIA_ACCOUNT_TLS_PARTIAL_OR_DRIFT

- name: Issue server CSR with persistent private key if absent
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -newkey
      - rsa:3072
      - -nodes
      - -keyout
      - /etc/digitalhouses/media-account-pki/server.key
      - -out
      - /etc/digitalhouses/media-account-pki/server.csr
      - -subj
      - "/CN={{ media_vm.network.ipv4.split('/')[0] }}"
  when: not media_account_server_key.stat.exists
  no_log: true

- name: Create local HTTPS certificate SAN extension
  ansible.builtin.copy:
    dest: /etc/digitalhouses/media-account-pki/server.ext
    owner: root
    group: root
    mode: '0600'
    content: |
      basicConstraints=CA:FALSE
      keyUsage=digitalSignature,keyEncipherment
      extendedKeyUsage=serverAuth
      subjectAltName=IP:{{ media_vm.network.ipv4.split('/')[0] }}

- name: Sign HTTPS certificate with local private CA
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -req
      - -in
      - /etc/digitalhouses/media-account-pki/server.csr
      - -CA
      - /etc/digitalhouses/media-account-pki/ca.crt
      - -CAkey
      - /etc/digitalhouses/media-account-pki/ca.key
      - -CAcreateserial
      - -out
      - /etc/digitalhouses/media-account-pki/server.crt
      - -days
      - '397'
      - -sha256
      - -extfile
      - /etc/digitalhouses/media-account-pki/server.ext
  when: not media_account_server_cert.stat.exists
  no_log: true

- name: Protect local CA and HTTPS server private keys
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: '0600'
  loop:
    - /etc/digitalhouses/media-account-pki/ca.key
    - /etc/digitalhouses/media-account-pki/server.key

- name: Validate server TLS chain
  ansible.builtin.command:
    argv:
      - openssl
      - verify
      - -CAfile
      - /etc/digitalhouses/media-account-pki/ca.crt
      - /etc/digitalhouses/media-account-pki/server.crt
  changed_when: false

- name: Create HTTPS account HTML directory
  ansible.builtin.file:
    path: /var/www/dh-media-portal/account
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install self-service password page
  ansible.builtin.copy:
    src: dh-media-account.html
    dest: /var/www/dh-media-portal/account/index.html
    owner: root
    group: root
    mode: '0644'

- name: Install local-only native account API
  ansible.builtin.copy:
    src: dh-media-account-api.py
    dest: /usr/local/sbin/dh-media-account-api
    owner: root
    group: root
    mode: '0700'
  register: media_account_api_installed

- name: Set exact account HTTPS and LAN identity from Fleet
  ansible.builtin.copy:
    dest: /etc/digitalhouses/media-account-portal.json
    owner: root
    group: root
    mode: '0600'
    content: "{{ {'ipv4': media_vm.network.ipv4} | to_json }}\n"
  register: media_account_identity_changed

- name: Install native root-owned local API service
  ansible.builtin.copy:
    src: dh-media-account-api.service
    dest: /etc/systemd/system/dh-media-account-api.service
    owner: root
    group: root
    mode: '0644'
  register: media_account_service_changed

- name: Reload systemd when account service was changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: media_account_service_changed.changed

- name: Start or restart protected local account API
  ansible.builtin.systemd_service:
    name: dh-media-account-api.service
    enabled: true
    state: "{{ 'restarted' if media_account_api_installed.changed or media_account_identity_changed.changed or media_account_service_changed.changed else 'started' }}"

- name: Add HTTPS-only nginx account site
  ansible.builtin.template:
    src: media-account-nginx.conf.j2
    dest: /etc/nginx/sites-enabled/dh-media-account-https.conf
    owner: root
    group: root
    mode: '0644'
  register: media_account_https_changed

- name: Redirect HTTP account access to HTTPS without proxying passwords
  ansible.builtin.template:
    src: media-portal-nginx.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: '0644'
  register: media_account_http_changed

- name: Refresh portal front page with account management link
  ansible.builtin.template:
    src: media-portal-index.html.j2
    dest: /var/www/dh-media-portal/index.html
    owner: root
    group: root
    mode: '0644'
  register: media_account_portal_changed

- name: Validate full nginx configuration before applying
  ansible.builtin.command:
    argv: [nginx, -t]
  changed_when: false

- name: Apply HTTPS and HTTP routing
  ansible.builtin.systemd_service:
    name: nginx.service
    state: "{{ 'reloaded' if media_account_https_changed.changed or media_account_http_changed.changed else 'started' }}"

- name: Verify authenticated local HTTPS certificate and account form
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --show-error
      - --fail
      - --max-time
      - '6'
      - --cacert
      - /etc/digitalhouses/media-account-pki/ca.crt
      - "https://{{ media_vm.network.ipv4.split('/')[0] }}/account/"
  register: media_account_portal_check
  changed_when: false
  failed_when: "'Сменить общий пароль' not in media_account_portal_check.stdout"

- name: Require local account backend active
  ansible.builtin.command:
    argv: [systemctl, is-active, dh-media-account-api.service]
  register: media_account_backend_status
  changed_when: false
  failed_when: media_account_backend_status.stdout != 'active'

- name: Report independent media password portal readiness
  ansible.builtin.debug:
    msg:
      result: PASS
      owner_password_change: HTTPS_ONLY
      pve_root_password_recovery: SEPARATE
      url: "https://{{ media_vm.network.ipv4.split('/')[0] }}/account/"
      client_ca_trust_required: true
      ansible_runtime_dependency: false
