---
- name: Install one-time Jellyfin initialization helper
  ansible.builtin.copy:
    src: dh-jellyfin-bootstrap.py
    dest: /usr/local/sbin/dh-jellyfin-bootstrap
    owner: root
    group: root
    mode: '0700'

- name: Check protected Jellyfin shared owner credential exists
  ansible.builtin.stat:
    path: /{{ media_vm.storage.pool_name }}/digitalhouses/credentials/{{ media_vm.file_access.accounts | selectattr('role','equalto','owner') | map(attribute='name') | first }}.txt
  register: media_jellyfin_admin_passport

- name: Refuse open Jellyfin wizard without protected the shared eight-character owner credential
  ansible.builtin.assert:
    that:
      - media_jellyfin_admin_passport.stat.isreg | default(false)
      - media_jellyfin_admin_passport.stat.pw_name == 'root'
      - media_jellyfin_admin_passport.stat.mode == '0640'
    fail_msg: MEDIA_JELLYFIN_ADMIN_CREDENTIALS_NOT_COMMISSIONED
  no_log: true

- name: Run Jellyfin setup with protected failure-stage reporting
  block:
    - name: Complete and verify Jellyfin setup without disclosing owner password
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/dh-jellyfin-bootstrap
          - --credential-file
          - "/{{ media_vm.storage.pool_name }}/digitalhouses/credentials/{{ media_vm.file_access.accounts | selectattr('role','equalto','owner') | map(attribute='name') | first }}.txt"
          - --media-root
          - "/{{ media_vm.storage.media_dataset }}"
      register: media_jellyfin_bootstrap
      changed_when: >-
        'JELLYFIN_WIZARD=COMPLETED' in media_jellyfin_bootstrap.stdout
        or '=CREATED' in media_jellyfin_bootstrap.stdout
      no_log: true
  rescue:
    - name: Read strictly whitelisted Jellyfin failure stage without credentials
      ansible.builtin.command:
        argv: [/usr/local/sbin/dh-jellyfin-bootstrap, --inspect-stage]
      register: media_jellyfin_stage_diagnostic
      changed_when: false
      failed_when: false
    - name: Block commissioning on Jellyfin stage error
      ansible.builtin.fail:
        msg: "MEDIA_JELLYFIN_BOOTSTRAP_BLOCKED {{ media_jellyfin_stage_diagnostic.stdout if media_jellyfin_stage_diagnostic.rc == 0 else 'JELLYFIN_STAGE_UNAVAILABLE' }}"


# A configured QSV encoder alone does not enable HEVC hardware decoding.
# Keep approved existing codecs and opt into the N100's HEVC Main10 decoder.
- name: Read current Jellyfin video acceleration configuration
  ansible.builtin.slurp:
    src: /etc/jellyfin/encoding.xml
  register: media_jellyfin_hevc_config

- name: Require Jellyfin QSV and hardware codec list before modification
  ansible.builtin.assert:
    that:
      - "'<HardwareAccelerationType>qsv</HardwareAccelerationType>' in (media_jellyfin_hevc_config.content | b64decode)"
      - "'<HardwareDecodingCodecs>' in (media_jellyfin_hevc_config.content | b64decode)"
      - "'</HardwareDecodingCodecs>' in (media_jellyfin_hevc_config.content | b64decode)"
    fail_msg: MEDIA_JELLYFIN_QSV_CONFIGURATION_DRIFT

- name: Enable only missing Jellyfin HEVC hardware decoder
  when: "'<string>hevc</string>' not in (media_jellyfin_hevc_config.content | b64decode)"
  block:
    - name: Check there are no active Jellyfin FFmpeg sessions to interrupt
      ansible.builtin.command:
        argv: [pgrep, -u, jellyfin, -x, ffmpeg]
      register: media_jellyfin_hevc_active_transcode
      changed_when: false
      failed_when: media_jellyfin_hevc_active_transcode.rc not in [1]

    - name: Stop Jellyfin before editing persistent decoding settings
      ansible.builtin.systemd_service:
        name: jellyfin.service
        state: stopped

    - name: Preserve existing decoder selections and add HEVC
      ansible.builtin.replace:
        path: /etc/jellyfin/encoding.xml
        regexp: '(<HardwareDecodingCodecs>\n)'
        replace: '\1    <string>hevc</string>\n'
        backup: true
      register: media_jellyfin_hevc_rewrite

    - name: Require HEVC decoder config was actually updated
      ansible.builtin.assert:
        that:
          - media_jellyfin_hevc_rewrite.changed
        fail_msg: MEDIA_JELLYFIN_HEVC_DECODER_REWRITE_NOT_APPLIED
  always:
    - name: Ensure Jellyfin is started after configuration work
      ansible.builtin.systemd_service:
        name: jellyfin.service
        state: started

- name: Read back persistent hardware decoding codec selections
  ansible.builtin.slurp:
    src: /etc/jellyfin/encoding.xml
  register: media_jellyfin_hevc_after

- name: Require HEVC hardware decoding to be enabled
  ansible.builtin.assert:
    that:
      - "'<string>hevc</string>' in (media_jellyfin_hevc_after.content | b64decode)"
      - "'<string>h264</string>' in (media_jellyfin_hevc_after.content | b64decode)"
    fail_msg: MEDIA_JELLYFIN_HEVC_QSV_DECODE_NOT_ENABLED
