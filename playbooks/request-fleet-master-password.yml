---
# Task 06: one-time encrypted Fleet Vault password entry via Semaphore Secret survey.
# The master password is stored locally for reboots. No root worker, provider or service.
- name: 06 — Сохранить master password Fleet Vault
  hosts: site_runner
  gather_facts: false
  become: false
  vars:
    dh_auth_dir: /var/lib/semaphore/.dh-credentials
    dh_fleet_dir: "{{ dh_auth_dir }}/fleet"
    dh_vault_path: "{{ dh_fleet_dir }}/secrets/fleet.vault.yml"
    dh_password_file: "{{ dh_auth_dir }}/fleet-vault-password"
    dh_candidate_file: "{{ dh_auth_dir }}/.vault-password-new"
  pre_tasks:
    - name: Load runner identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"
    - name: Confirm local runner context
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == 'runner'
          - (ansible_connection | default('')) == 'local'
          - site.id is defined
          - site.id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')
          - fleet_master_password is defined
          - fleet_master_password | length >= 8
        fail_msg: "Set a master password through the hidden Semaphore Secret field"
      no_log: true
    - name: Check runner hostname
      ansible.builtin.command: hostname
      register: dh_runner_hostname
      changed_when: false
    - name: Validate runner hostname
      ansible.builtin.assert:
        that: dh_runner_hostname.stdout == 'ansible-' ~ site.id
  tasks:
    - name: Confirm private Fleet was downloaded by task 05
      ansible.builtin.stat:
        path: "{{ dh_vault_path }}"
      register: dh_fleet_vault
    - name: Require private Vault checkout
      ansible.builtin.assert:
        that: dh_fleet_vault.stat.isreg | default(false)
        fail_msg: "Run task 05 (GitHub access) before task 06"
    - name: Verify local credentials directory
      ansible.builtin.stat:
        path: "{{ dh_auth_dir }}"
      register: dh_auth_dir_info
    - name: Require user-owned private directory
      ansible.builtin.assert:
        that:
          - dh_auth_dir_info.stat.isdir | default(false)
          - dh_auth_dir_info.stat.mode == '0700'
          - dh_auth_dir_info.stat.pw_name == 'semaphore'
    - name: Store master password only after successful Vault verification
      block:
        - name: Save candidate master password without logging it
          ansible.builtin.copy:
            dest: "{{ dh_candidate_file }}"
            content: "{{ fleet_master_password }}\n"
            mode: '0600'
          no_log: true
        - name: Verify password can decrypt the Fleet Vault
          ansible.builtin.shell: |
            /opt/ansible/venv/bin/ansible-vault view --vault-password-file "{{ dh_candidate_file }}" "{{ dh_vault_path }}" >/dev/null 2>&1
          args:
            executable: /bin/bash
          register: dh_unlock_check
          changed_when: false
          failed_when: false
          no_log: true
        - name: Refuse incorrect master password
          ansible.builtin.assert:
            that: dh_unlock_check.rc == 0
            fail_msg: "Vault decryption failed. Previous working password was left unchanged."
        - name: Commit verified password for future tasks and reboots
          ansible.builtin.command:
            argv:
              - mv
              - -f
              - --
              - "{{ dh_candidate_file }}"
              - "{{ dh_password_file }}"
          no_log: true
      always:
        - name: Remove any uncommitted candidate file
          ansible.builtin.file:
            path: "{{ dh_candidate_file }}"
            state: absent
          no_log: true
    - name: Verify stored password file permissions
      ansible.builtin.stat:
        path: "{{ dh_password_file }}"
      register: dh_password_stat
    - name: Accept one-time local master password
      ansible.builtin.assert:
        that:
          - dh_password_stat.stat.isreg | default(false)
          - dh_password_stat.stat.mode == '0600'
          - dh_password_stat.stat.pw_name == 'semaphore'
    - name: Show success without printing any credential
      ansible.builtin.debug:
        msg:
          result: FLEET_VAULT_UNLOCKED
          site: "{{ site.id }}"
          password_saved_for_reboots: true
          password_exposed_in_log: false
