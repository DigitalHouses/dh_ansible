---
# Task 06: one secret entry per runner; validates and stores the Vault password.
# New sites use their own encrypted secrets/sites/<site>.vault.yml.
# Previously accepted runners remain compatible with legacy Fleet Vault.
- name: 06 — Подключить Ansible Vault credentials объекта
  hosts: site_runner
  gather_facts: false
  become: false
  vars:
    dh_auth_dir: /var/lib/semaphore/.dh-credentials
    dh_fleet_dir: "{{ dh_auth_dir }}/fleet"
    dh_vault_path: >-
      {{
        dh_fleet_dir ~ '/secrets/sites/' ~ site.id ~ '.vault.yml'
        if (site.credentials_profile | default('fleet_legacy_v1')) == 'site_vault_v1'
        else dh_fleet_dir ~ '/secrets/fleet.vault.yml'
      }}
    dh_password_file: >-
      {{
        dh_auth_dir ~ '/site-vault-password'
        if (site.credentials_profile | default('fleet_legacy_v1')) == 'site_vault_v1'
        else dh_auth_dir ~ '/fleet-vault-password'
      }}
    dh_candidate_file: "{{ dh_auth_dir }}/.vault-password-new"
  pre_tasks:
    - name: Load immutable local runner identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Require one site and hidden Vault password
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == 'runner'
          - (ansible_connection | default('')) == 'local'
          - site.id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')
          - (site.credentials_profile | default('fleet_legacy_v1')) in ['fleet_legacy_v1', 'site_vault_v1']
          - fleet_master_password is defined
          - fleet_master_password | length >= 8
        fail_msg: "SITE_VAULT_PASSWORD_REQUIRED: enter password in Semaphore Secret field"
      no_log: true

    - name: Read runner hostname
      ansible.builtin.command:
        argv: [hostname]
      register: dh_runner_hostname
      changed_when: false

    - name: Confirm exact runner hostname for this site
      ansible.builtin.assert:
        that:
          - dh_runner_hostname.stdout == 'ansible-' ~ site.id

  tasks:
    - name: Inspect encrypted Vault file from private Fleet checkout
      ansible.builtin.stat:
        path: "{{ dh_vault_path }}"
        follow: false
      register: dh_fleet_vault

    - name: Refuse absent or unexpected encrypted Vault
      ansible.builtin.assert:
        that:
          - dh_fleet_vault.stat.isreg | default(false)
          - not (dh_fleet_vault.stat.islnk | default(false))
        fail_msg: "SITE_VAULT_MISSING: encrypted Vault must be committed in private Fleet before enrollment"

    - name: Inspect local credential directory
      ansible.builtin.stat:
        path: "{{ dh_auth_dir }}"
        follow: false
      register: dh_auth_dir_info

    - name: Require private Semaphore-owned credential directory
      ansible.builtin.assert:
        that:
          - dh_auth_dir_info.stat.isdir | default(false)
          - not (dh_auth_dir_info.stat.islnk | default(false))
          - dh_auth_dir_info.stat.mode == '0700'
          - dh_auth_dir_info.stat.pw_name == 'semaphore'

    - name: Save the checked Vault password without disclosing it
      block:
        - name: Write one protected password candidate
          ansible.builtin.copy:
            dest: "{{ dh_candidate_file }}"
            content: "{{ fleet_master_password }}\n"
            mode: '0600'
          no_log: true
          diff: false

        - name: Decrypt selected Vault using standard ansible-vault
          ansible.builtin.command:
            argv:
              - /opt/ansible/venv/bin/ansible-vault
              - view
              - --vault-id
              - "{{ site.id ~ '@' ~ dh_candidate_file }}"
              - "{{ dh_vault_path }}"
          register: dh_vault_check
          changed_when: false
          failed_when: false
          no_log: true

        - name: Require successful Vault decryption
          ansible.builtin.assert:
            that:
              - dh_vault_check.rc == 0
            fail_msg: "SITE_VAULT_PASSWORD_INCORRECT: previous working password unchanged"
          no_log: true

        - name: Parse the decrypted site payload in memory
          ansible.builtin.set_fact:
            dh_site_vault_candidate: "{{ dh_vault_check.stdout | from_yaml }}"
          no_log: true

        - name: Verify per-site Vault contains only this site
          ansible.builtin.assert:
            that:
              - dh_site_vault_candidate.site_secrets is mapping
              - dh_site_vault_candidate.site_secrets.site_id == site.id
              - dh_site_vault_candidate.site_secrets.credentials is mapping
            fail_msg: "SITE_VAULT_WRONG_SITE"
          when: (site.credentials_profile | default('fleet_legacy_v1')) == 'site_vault_v1'
          no_log: true

        - name: Verify legacy Fleet Vault contains this site's credentials
          ansible.builtin.assert:
            that:
              - dh_site_vault_candidate.fleet_secrets.sites[site.id] is mapping
            fail_msg: "FLEET_LEGACY_SITE_NOT_FOUND"
          when: (site.credentials_profile | default('fleet_legacy_v1')) == 'fleet_legacy_v1'
          no_log: true

        - name: Commit the verified password for all subsequent tasks
          ansible.builtin.command:
            argv:
              - mv
              - -f
              - --
              - "{{ dh_candidate_file }}"
              - "{{ dh_password_file }}"
          no_log: true
      always:
        - name: Remove any uncommitted password candidate
          ansible.builtin.file:
            path: "{{ dh_candidate_file }}"
            state: absent
          no_log: true

    - name: Verify stored password mode and owner
      ansible.builtin.stat:
        path: "{{ dh_password_file }}"
        follow: false
      register: dh_password_stat

    - name: Accept reusable Vault password for this runner
      ansible.builtin.assert:
        that:
          - dh_password_stat.stat.isreg | default(false)
          - not (dh_password_stat.stat.islnk | default(false))
          - dh_password_stat.stat.mode == '0600'
          - dh_password_stat.stat.pw_name == 'semaphore'

    - name: Confirm credential enrollment without revealing any secret
      ansible.builtin.debug:
        msg:
          result: SITE_VAULT_READY
          site: "{{ site.id }}"
          credentials_profile: "{{ site.credentials_profile | default('fleet_legacy_v1') }}"
          password_saved_for_reboots: true
          next_tasks_need_password: false
