---
# Stage-aware credential readiness. Fresh site requires only the PVE root@pam
# password; GitHub/MQTT/Cloudflare are optional until relevant capabilities
# are commissioned. The password comes from the native Semaphore Variable
# Group Secret type=var, encrypted in transit to Ansible by Semaphore 2.20.
- name: 06 — Verify site credentials against the actual PVE
  hosts: site_runner
  gather_facts: false
  become: false
  vars:
    dh_pve_ca_file: "{{ inventory_dir }}/pve-root-ca.pem"
    dh_pve_port: 8006

  pre_tasks:
    - name: Load canonical local site identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Load observed PVE endpoint from host-root bootstrap
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve-runtime.yml"

    - name: Require the actual local runner
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == 'runner'
          - (ansible_connection | default('')) == 'local'
          - site.id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')
          - pve_observed.ipv4 is match('^[0-9]+(\\.[0-9]+){3}$')

    - name: Read runner hostname
      ansible.builtin.command:
        argv: [hostname]
      register: dh_runner_host
      changed_when: false

    - name: Refuse checks against another site
      ansible.builtin.assert:
        that: dh_runner_host.stdout == 'ansible-' ~ site.id

  tasks:
    - name: Determine if the mandatory PVE root password is present
      ansible.builtin.set_fact:
        dh_pve_secret_present: "{{ DH_PVE_ROOT_PASSWORD is defined and (DH_PVE_ROOT_PASSWORD | default('') | length > 0) }}"
        dh_pve_status: MISSING
      no_log: true

    - name: Inspect host-root commissioned certificate authority
      ansible.builtin.stat:
        path: "{{ dh_pve_ca_file }}"
        follow: false
      register: dh_pve_ca
      changed_when: false

    - name: Mark missing PVE trust or password without submitting credentials
      ansible.builtin.set_fact:
        dh_pve_status: >-
          {{
            'MISSING' if not dh_pve_secret_present
            else 'PVE_TRUST_NOT_COMMISSIONED'
          }}
      when: >-
        (not dh_pve_secret_present)
        or pve_observed.source | default('') != 'host_root_vmbr0'
        or pve_observed.tls_sha256_fingerprint is not defined
        or not dh_pve_ca.stat.isreg | default(false)
        or dh_pve_ca.stat.islnk | default(false)
      no_log: true

    - name: Verify trusted PVE endpoint and authenticate root@pam
      when:
        - dh_pve_secret_present
        - pve_observed.source | default('') == 'host_root_vmbr0'
        - pve_observed.tls_sha256_fingerprint is defined
        - dh_pve_ca.stat.isreg | default(false)
        - not dh_pve_ca.stat.islnk | default(false)
      block:
        - name: Read live PVE TLS certificate fingerprint without a password
          ansible.builtin.shell: |
            set -o pipefail
            openssl s_client -connect "{{ pve_observed.ipv4 }}:{{ dh_pve_port }}" -servername "{{ pve_observed.ipv4 }}" </dev/null 2>/dev/null |
              openssl x509 -noout -fingerprint -sha256
          args:
            executable: /bin/bash
          register: dh_pve_tls
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Classify connectivity or changed server identity
          ansible.builtin.set_fact:
            dh_pve_status: >-
              {{
                'UNREACHABLE' if dh_pve_tls.rc != 0
                else 'PVE_TLS_IDENTITY_MISMATCH' if
                ('sha256 Fingerprint=' ~ pve_observed.tls_sha256_fingerprint) not in dh_pve_tls.stdout
                else 'AUTH_PENDING'
              }}

        - name: Authenticate over certificate-validated Proxmox API
          ansible.builtin.uri:
            url: "https://{{ pve_observed.api_hostname | default(pve_observed.ipv4) }}:{{ dh_pve_port }}/api2/json/access/ticket"
            method: POST
            body_format: form-urlencoded
            body:
              username: root@pam
              password: "{{ DH_PVE_ROOT_PASSWORD }}"
            ca_path: "{{ dh_pve_ca_file }}"
            validate_certs: true
            use_proxy: false
            follow_redirects: none
            return_content: true
            status_code: [200, 401, 403, 500, 502, 503]
            timeout: 15
          register: dh_pve_auth
          failed_when: false
          changed_when: false
          no_log: true
          when: dh_pve_status == 'AUTH_PENDING'

        - name: Classify PVE authentication without revealing tickets
          ansible.builtin.set_fact:
            dh_pve_status: >-
              {{
                'READY' if (dh_pve_auth.status | default(-1) == 200
                  and (dh_pve_auth.json.data.ticket | default('') | length > 10))
                else 'AUTH_FAILED' if (dh_pve_auth.status | default(-1)) in [401, 403]
                else 'PVE_TLS_OR_API_UNAVAILABLE'
              }}
          when: dh_pve_status == 'AUTH_PENDING'
          no_log: true

    - name: Confirm authenticated read-only Proxmox node access
      ansible.builtin.uri:
        url: "https://{{ pve_observed.api_hostname | default(pve_observed.ipv4) }}:{{ dh_pve_port }}/api2/json/nodes"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ dh_pve_auth.json.data.ticket }}"
        ca_path: "{{ dh_pve_ca_file }}"
        validate_certs: true
        use_proxy: false
        follow_redirects: none
        return_content: true
        status_code: [200, 401, 403, 500, 502, 503]
        timeout: 15
      register: dh_pve_nodes
      failed_when: false
      changed_when: false
      no_log: true
      when: dh_pve_status == 'READY'

    - name: Verify root authorization and actual PVE node identity
      ansible.builtin.set_fact:
        dh_pve_status: >-
          {{
            'READY' if (
              dh_pve_nodes.status | default(-1) == 200
              and pve_observed.node in (
                dh_pve_nodes.json.data | default([])
                | map(attribute='node') | list
              )
            )
            else 'INSUFFICIENT_PRIVILEGES' if
              (dh_pve_nodes.status | default(-1)) in [401, 403]
            else 'PVE_NODE_MISMATCH' if (dh_pve_nodes.status | default(-1)) == 200
            else 'PVE_API_UNAVAILABLE'
          }}
      when: dh_pve_status == 'READY'
      no_log: true

    - name: Report credential readiness by stage
      ansible.builtin.debug:
        msg:
          site: "{{ site.id }}"
          pve:
            credential: root@pam
            status: "{{ dh_pve_status }}"
          github_provision: NOT_APPLICABLE_UNTIL_TASK_07
          mqtt: NOT_APPLICABLE_UNTIL_AGENT_COMMISSIONING
          cloudflare: NOT_APPLICABLE_UNTIL_TUNNEL_COMMISSIONING
          overall: "{{ 'READY' if dh_pve_status == 'READY' else 'BLOCKED' }}"
          password_or_ticket_logged: false

    - name: Block downstream tasks unless mandatory PVE credentials pass
      ansible.builtin.assert:
        that: dh_pve_status == 'READY'
        fail_msg: "CREDENTIAL_READINESS_BLOCKED: PVE={{ dh_pve_status }}. Correct Task 05 input, PVE TLS trust or connectivity."
