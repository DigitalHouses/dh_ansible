---
# Stage-aware credential readiness. Fresh site requires only the PVE root@pam
# password; GitHub/MQTT/Cloudflare are optional until relevant capabilities
# are commissioned. The password comes from the native Semaphore Variable
# Group Secret type=var, encrypted in transit to Ansible by Semaphore 2.20.
- name: 06 — Verify site credentials against the actual PVE
  hosts: site_runner
  gather_facts: false
  become: false
  vars:
    dh_pve_ca_file: "{{ inventory_dir }}/pve-root-ca.pem"
    dh_pve_port: 8006

  pre_tasks:
    - name: Load canonical local site identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Load observed PVE endpoint from host-root bootstrap
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve-runtime.yml"

    - name: Require the actual local runner
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == 'runner'
          - (ansible_connection | default('')) == 'local'
          - site.id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')
          - pve_observed.ipv4 is match('^[0-9]+(\\.[0-9]+){3}$')

    - name: Read runner hostname
      ansible.builtin.command:
        argv: [hostname]
      register: dh_runner_host
      changed_when: false

    - name: Refuse checks against another site
      ansible.builtin.assert:
        that: dh_runner_host.stdout == 'ansible-' ~ site.id

  tasks:
    - name: Determine if the mandatory PVE root password is present
      ansible.builtin.set_fact:
        dh_pve_secret_present: "{{ DH_PVE_ROOT_PASSWORD is defined and (DH_PVE_ROOT_PASSWORD | default('') | length > 0) }}"
        dh_pve_status: MISSING
      no_log: true

    - name: Inspect host-root commissioned certificate authority
      ansible.builtin.stat:
        path: "{{ dh_pve_ca_file }}"
        follow: false
      register: dh_pve_ca
      changed_when: false

    - name: Mark missing PVE trust or password without submitting credentials
      ansible.builtin.set_fact:
        dh_pve_status: >-
          {{
            'MISSING' if not dh_pve_secret_present
            else 'PVE_TRUST_NOT_COMMISSIONED'
          }}
      when: >-
        (not dh_pve_secret_present)
        or pve_observed.source | default('') != 'host_root_vmbr0'
        or pve_observed.tls_sha256_fingerprint is not defined
        or not dh_pve_ca.stat.isreg | default(false)
        or dh_pve_ca.stat.islnk | default(false)
      no_log: true

    # PVE 8 cluster CA may lack keyUsage: Ansible uri/Python 3.13 enforces
    # X509_STRICT and rejects this CA despite valid TLS chain/name. A local
    # Python standard-library verifier narrows ONLY that strict flag while
    # keeping CA verification, hostname validation and fingerprint pinning.
    # The password and ephemeral ticket stay in stdin/process memory, never
    # in process argv, task output, a file or an unvalidated TLS connection.
    - name: Check root@pam and PVE node with verified legacy-compatible TLS
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/pve-https-credential-check.py"
        stdin: >-
          {{
            {
              'ip': pve_observed.ipv4,
              'api_hostname': pve_observed.api_hostname | default(pve_observed.ipv4),
              'port': dh_pve_port,
              'ca_file': dh_pve_ca_file,
              'fingerprint': pve_observed.tls_sha256_fingerprint,
              'node': pve_observed.node,
              'password': DH_PVE_ROOT_PASSWORD
            } | to_json
          }}
        stdin_add_newline: false
      register: dh_pve_check
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true
      when:
        - dh_pve_secret_present
        - pve_observed.source | default('') == 'host_root_vmbr0'
        - pve_observed.tls_sha256_fingerprint is defined
        - dh_pve_ca.stat.isreg | default(false)
        - not dh_pve_ca.stat.islnk | default(false)

    - name: Classify PVE TLS, identity, authentication and node access
      ansible.builtin.set_fact:
        dh_pve_status: >-
          {{
            dh_pve_check.stdout if (
              dh_pve_check.rc | default(1) == 0
              and dh_pve_check.stdout in [
                'READY', 'AUTH_FAILED', 'INSUFFICIENT_PRIVILEGES',
                'PVE_NODE_MISMATCH', 'PVE_TLS_IDENTITY_MISMATCH',
                'PVE_TLS_CERT_UNTRUSTED', 'UNREACHABLE',
                'PVE_TLS_OR_API_UNAVAILABLE'
              ]
            ) else 'PVE_TLS_OR_API_UNAVAILABLE'
          }}
      no_log: true
      when:
        - dh_pve_secret_present
        - pve_observed.source | default('') == 'host_root_vmbr0'
        - pve_observed.tls_sha256_fingerprint is defined
        - dh_pve_ca.stat.isreg | default(false)
        - not dh_pve_ca.stat.islnk | default(false)

    - name: Block PVE enrollment unless root@pam and pinned TLS are ready
      ansible.builtin.assert:
        that: dh_pve_status == 'READY'
        fail_msg: "CREDENTIAL_READINESS_BLOCKED: PVE={{ dh_pve_status }}. No PVE SSH changes made."

    - name: Inspect trusted SSH host key from PVE bootstrap
      ansible.builtin.stat:
        path: /var/lib/semaphore/.ssh/dh_pve_known_hosts
        follow: false
      register: dh_pve_known

    - name: Verify SSH host identity was seeded by the actual PVE Bootstrap
      ansible.builtin.assert:
        that:
          - dh_pve_known.stat.isreg | default(false)
          - not dh_pve_known.stat.islnk | default(false)
          - dh_pve_known.stat.pw_name == 'semaphore'
          - dh_pve_known.stat.mode == '0600'
        fail_msg: PVE_SSH_HOST_TRUST_NOT_SEEDED

    - name: Inspect existing site SSH key files
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /var/lib/semaphore/.ssh/dh_pve_admin_ed25519
        - /var/lib/semaphore/.ssh/dh_pve_admin_ed25519.pub
      register: dh_pve_key_files
      no_log: true

    - name: Refuse incomplete or unsafe site SSH identities
      ansible.builtin.assert:
        that:
          - dh_pve_key_files.results[0].stat.exists == dh_pve_key_files.results[1].stat.exists
          - not dh_pve_key_files.results[0].stat.exists or (
              dh_pve_key_files.results[0].stat.isreg
              and dh_pve_key_files.results[0].stat.pw_name == 'semaphore'
              and dh_pve_key_files.results[0].stat.mode == '0600'
              and not dh_pve_key_files.results[0].stat.islnk
            )
          - not dh_pve_key_files.results[1].stat.exists or (
              dh_pve_key_files.results[1].stat.isreg
              and dh_pve_key_files.results[1].stat.pw_name == 'semaphore'
              and not dh_pve_key_files.results[1].stat.islnk
            )
        fail_msg: PVE_SSH_KEYPAIR_UNSAFE

    - name: Generate site-scoped ED25519 key when no key exists
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - "dh-pve-{{ site.id }}"
          - -f
          - /var/lib/semaphore/.ssh/dh_pve_admin_ed25519
      when: not dh_pve_key_files.results[0].stat.exists
      no_log: true

    - name: Read the public half of the site SSH key
      ansible.builtin.command:
        argv: [cat, /var/lib/semaphore/.ssh/dh_pve_admin_ed25519.pub]
      register: dh_pve_pubkey
      changed_when: false
      no_log: true

    - name: Verify the public key belongs to this site
      ansible.builtin.assert:
        that:
          - dh_pve_pubkey.stdout is match(
              '^ssh-ed25519 [A-Za-z0-9+/=]+ dh-pve-' ~ site.id ~ '$'
            )
        fail_msg: PVE_SSH_PUBLIC_KEY_SITE_MISMATCH

    - name: Probe existing pin-verified noninteractive SSH key access
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -o
          - BatchMode=yes
          - -o
          - IdentitiesOnly=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - ConnectTimeout=7
          - -o
          - UserKnownHostsFile=/var/lib/semaphore/.ssh/dh_pve_known_hosts
          - -i
          - /var/lib/semaphore/.ssh/dh_pve_admin_ed25519
          - "root@{{ pve_observed.ipv4 }}"
          - /usr/bin/id
          - -u
      register: dh_pve_existing_ssh
      changed_when: false
      failed_when: false
      no_log: true

    - name: Register password-based first connection to pinned PVE host
      ansible.builtin.add_host:
        name: dh_pve_initial_password
        groups: dh_pve_first_enrollment
        ansible_host: "{{ pve_observed.ipv4 }}"
        ansible_user: root
        ansible_connection: ssh
        ansible_password: "{{ DH_PVE_ROOT_PASSWORD }}"
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/dh_pve_known_hosts
          -o PreferredAuthentications=password,keyboard-interactive
          -o PubkeyAuthentication=no
          -o ConnectTimeout=10
        ansible_python_interpreter: /usr/bin/python3
        expected_pve_site: "{{ site.id }}"
        expected_pve_node: "{{ pve_observed.node }}"
        expected_pve_ip: "{{ pve_observed.ipv4 }}"
        site_public_key_b64: "{{ dh_pve_pubkey.stdout | b64encode }}"
      when: dh_pve_existing_ssh.rc != 0 or dh_pve_existing_ssh.stdout != '0'
      no_log: true

    - name: Register strict public-key-based PVE verification target
      ansible.builtin.add_host:
        name: dh_pve_verified_key
        groups: dh_pve_key_probe
        ansible_host: "{{ pve_observed.ipv4 }}"
        ansible_user: root
        ansible_connection: ssh
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/dh_pve_admin_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/dh_pve_known_hosts
          -o ConnectTimeout=10
        ansible_python_interpreter: /usr/bin/python3
        expected_pve_site: "{{ site.id }}"
        expected_pve_node: "{{ pve_observed.node }}"
        expected_pve_ip: "{{ pve_observed.ipv4 }}"

# Only on first enrollment: after root@pam API validation and strict SSH host
# pinning, authorize the runner's PUBLIC key using the saved root password.
# Standard Ansible SSH transports the password via sshpass; it is never argv.
- name: 06 — Authorize site SSH key on the verified Proxmox node if necessary
  hosts: dh_pve_first_enrollment
  gather_facts: false
  become: false
  tasks:
    - name: Authorize only the site public key after validating PVE node identity
      ansible.builtin.script: >-
        {{ playbook_dir }}/../scripts/pve-authorize-ssh-key.py
        --site {{ expected_pve_site }}
        --node {{ expected_pve_node }}
        --ip {{ expected_pve_ip }}
        --key-b64 {{ site_public_key_b64 }}
      register: dh_pve_enrollment
      changed_when: "'PVE_NATIVE_SSH_KEY=AUTHORIZED' in dh_pve_enrollment.stdout"
      no_log: true

# Executed on EVERY Task 06 run, including the first: no stored password is
# required here, and the PVE host SSH key is verified against Bootstrap's pin.
- name: 06 — Verify managed PVE root SSH access by authorized site key
  hosts: dh_pve_key_probe
  gather_facts: false
  become: false
  tasks:
    - name: Verify remote SSH account is root
      ansible.builtin.command:
        argv: [id, -u]
      register: dh_pve_remote_uid
      changed_when: false

    - name: Verify PVE node name
      ansible.builtin.command:
        argv: [hostname, -s]
      register: dh_pve_remote_node
      changed_when: false

    - name: Verify live bridge address
      ansible.builtin.command:
        argv: [ip, -4, -o, addr, show, dev, vmbr0]
      register: dh_pve_remote_addr
      changed_when: false

    - name: Verify expected root privileges and exact live node
      ansible.builtin.assert:
        that:
          - dh_pve_remote_uid.stdout == '0'
          - dh_pve_remote_node.stdout == expected_pve_node
          - expected_pve_ip in dh_pve_remote_addr.stdout
        fail_msg: PVE_NATIVE_SSH_IDENTITY_MISMATCH

    - name: Confirm read-only PVE guest listing
      ansible.builtin.command:
        argv: [qm, list]
      register: dh_pve_guest_probe
      changed_when: false

    - name: Report full PVE credential and infrastructure readiness
      ansible.builtin.debug:
        msg:
          site: "{{ expected_pve_site }}"
          pve:
            credential: root@pam
            status: READY
          pve_ssh:
            identity: "semaphore -> root"
            status: READY
          github_provision: NOT_APPLICABLE_UNTIL_TASK_07
          mqtt: NOT_APPLICABLE_UNTIL_AGENT_COMMISSIONING
          cloudflare: NOT_APPLICABLE_UNTIL_TUNNEL_COMMISSIONING
          overall: READY
          password_or_ticket_logged: false
