---
# A user-triggered local request with no elevation from Semaphore and no remote hosts.
- name: Request on-demand Remote Desktop Commander installation
  hosts: site_runner
  gather_facts: false
  become: false
  pre_tasks:
    - name: Load site identity from local inventory
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"
    - name: Require exactly one local runner
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname in ['runner', 'localhost']
          - (ansible_connection | default('')) == 'local'
          - site.id is defined
          - site.owner_slug is defined
          - site.type is defined
    - name: Read local runner hostname
      ansible.builtin.command:
        argv: [hostname]
      register: remote_request_hostname
      changed_when: false
      check_mode: false
    - name: Require matching site slug
      ansible.builtin.assert:
        that:
          - site.id == site.owner_slug ~ '-' ~ site.type
          - remote_request_hostname.stdout == 'ansible-' ~ site.id
    - name: Check fixed-purpose root watcher
      ansible.builtin.command:
        argv: [systemctl, is-active, dh-remote-commander-install.path]
      register: remote_request_watcher
      changed_when: false
      check_mode: false
    - name: Require prepared on-demand installer
      ansible.builtin.assert:
        that:
          - remote_request_watcher.stdout == 'active'
  tasks:
    - name: Check existing Remote Commander service
      ansible.builtin.command:
        argv: [systemctl, is-active, digitalhouses-remote-commander.service]
      register: remote_request_existing
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Show authorization link immediately in the task output
      ansible.builtin.debug:
        msg:
          component: Remote Desktop Commander
          authorization_url: "https://mcp.desktopcommander.app/device/verify"
          instruction: "Откройте ссылку. Если нужен код, он появится ниже после запуска агента."
          note: "Если агент уже авторизован, повторный код не требуется."

    - name: Capture previous worker status timestamp to reject stale success
      ansible.builtin.stat:
        path: /run/dh-remote-commander-install.status
      register: remote_request_previous_status

    - name: Generate unique Remote Commander request ID
      ansible.builtin.command:
        argv: [cat, /proc/sys/kernel/random/uuid]
      register: remote_request_id
      changed_when: false
      check_mode: false

    - name: Send fixed-purpose install or pairing request
      ansible.builtin.copy:
        dest: /var/lib/semaphore/dh-remote-commander.request
        content: "{{ 'PAIR' if remote_request_existing.stdout == 'active' else 'INSTALL' }}:{{ remote_request_id.stdout }}\n"
        mode: "0600"

    - name: Wait for a NEW worker status (not the previous task result)
      ansible.builtin.stat:
        path: /run/dh-remote-commander-install.status
      register: remote_request_new_status
      changed_when: false
      until: >-
        remote_request_new_status.stat.exists | default(false)
        and
        (
          not (remote_request_previous_status.stat.exists | default(false))
          or
          (remote_request_new_status.stat.mtime | float) >
          (remote_request_previous_status.stat.mtime | float)
        )
      retries: 30
      delay: 2

    - name: Await root worker result, including explicit failure
      ansible.builtin.command:
        argv: [cat, /run/dh-remote-commander-install.status]
      register: remote_request_result
      changed_when: false
      failed_when: false
      until: remote_request_result.stdout in ['PASS', 'FAILED']
      retries: 120
      delay: 5

    - name: Read managed service status for actionable diagnostics
      ansible.builtin.command:
        argv: [systemctl, is-active, digitalhouses-remote-commander.service]
      register: remote_request_active
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Report installer failure instead of retrying silently
      ansible.builtin.fail:
        msg: >-
          Remote Desktop Commander не запущен:
          worker={{ remote_request_result.stdout | default('UNKNOWN') }},
          service={{ remote_request_active.stdout | default('UNKNOWN') }}.
          Ссылка авторизации: https://mcp.desktopcommander.app/device/verify .
          Одноразовый код НЕ выдавался или недоступен;
          для диагностики нужен root-only журнал
          /var/log/dh-remote-commander-install.log внутри runner CT.
      when: >-
        remote_request_result.stdout != 'PASS'
        or remote_request_active.stdout != 'active'

    - name: Read the authorization result for THIS request only
      ansible.builtin.command:
        argv: [cat, /run/dh-remote-commander-pairing.status]
      register: remote_pairing_record
      changed_when: false
      failed_when: false
      until: >-
        remote_pairing_record.stdout.startswith('PAIR|' ~ remote_request_id.stdout ~ '|')
      retries: 5
      delay: 2

    - name: Show actual one-time code AND clickable authorization URL
      ansible.builtin.debug:
        msg:
          authorization_url: "{{ remote_pairing_record.stdout.split('|')[4] }}"
          one_time_code: "{{ remote_pairing_record.stdout.split('|')[3] }}"
          instruction: "Откройте authorization_url и подтвердите one_time_code."
          expires: "Код действителен ограниченное время; при истечении запустите задачу 40 повторно."
      when:
        - remote_pairing_record.stdout.split('|') | length == 5
        - remote_pairing_record.stdout.split('|')[2] == 'CODE'

    - name: Show already-authorized agent status
      ansible.builtin.debug:
        msg:
          authorization_url: "https://mcp.desktopcommander.app/device/verify"
          state: ALREADY_AUTHORIZED
          one_time_code: NOT_REQUIRED
      when:
        - remote_pairing_record.stdout.split('|') | length >= 3
        - remote_pairing_record.stdout.split('|')[2] == 'CONNECTED'

    - name: Refuse false success when no active code was issued
      ansible.builtin.fail:
        msg: >-
          Агент запущен, но одноразовый код не получен.
          Статус={{ remote_pairing_record.stdout.split('|')[2] | default('UNKNOWN') }}.
          Ссылка: https://mcp.desktopcommander.app/device/verify .
          Проверьте root-only journalctl -u digitalhouses-remote-commander.service
          на runner и повторите задачу 40 после устранения причины.
      when: >-
        remote_pairing_record.stdout.split('|') | length < 3
        or remote_pairing_record.stdout.split('|')[2] not in ['CODE', 'CONNECTED']

    - name: Report service availability separately from remote authorization
      ansible.builtin.debug:
        msg:
          result: SERVICE_ACTIVE
          site: "{{ site.id }}"
          component: remote_desktop_commander
          pairing_state: "{{ remote_pairing_record.stdout.split('|')[2] }}"
          authorization_url: "https://mcp.desktopcommander.app/device/verify"
          note: "Подтвердите код в браузере, затем проверьте статус Online через Desktop Commander. ACTIVE не означает Online."
