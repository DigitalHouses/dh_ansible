---
# A user-triggered local request with no elevation from Semaphore and no remote hosts.
- name: Request on-demand Remote Desktop Commander installation
  hosts: site_runner
  gather_facts: false
  become: false
  pre_tasks:
    - name: Load site identity from local inventory
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"
    - name: Require exactly one local runner
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname in ['runner', 'localhost']
          - (ansible_connection | default('')) == 'local'
          - site.id is defined
          - site.owner_slug is defined
          - site.type is defined
    - name: Read local runner hostname
      ansible.builtin.command:
        argv: [hostname]
      register: remote_request_hostname
      changed_when: false
      check_mode: false
    - name: Require matching site slug
      ansible.builtin.assert:
        that:
          - site.id == site.owner_slug ~ '-' ~ site.type
          - remote_request_hostname.stdout == 'ansible-' ~ site.id
    - name: Check fixed-purpose root watcher
      ansible.builtin.command:
        argv: [systemctl, is-active, dh-remote-commander-install.path]
      register: remote_request_watcher
      changed_when: false
      check_mode: false
    - name: Require prepared on-demand installer
      ansible.builtin.assert:
        that:
          - remote_request_watcher.stdout == 'active'
  tasks:
    - name: Check installed Remote Commander
      ansible.builtin.command:
        argv: [systemctl, is-active, digitalhouses-remote-commander.service]
      register: remote_request_existing
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Explain installation progress and device pairing
      ansible.builtin.debug:
        msg:
          - "The local root-owned watcher installs Remote Commander; Node.js/npm may take several minutes."
          - "Semaphore will show the live confirmation URL and one-time code below."
          - "Only a sanitized short-lived code is readable by Semaphore; no journal or secrets are shared."
          - "Authorization requires opening the URL in your own browser."

    - name: Generate unique Remote Commander request ID
      ansible.builtin.command:
        argv: [cat, /proc/sys/kernel/random/uuid]
      register: remote_request_id
      changed_when: false
      check_mode: false

    - name: Send fixed-purpose install or pairing request
      ansible.builtin.copy:
        dest: /var/lib/semaphore/dh-remote-commander.request
        content: "{{ 'PAIR' if remote_request_existing.stdout == 'active' else 'INSTALL' }}:{{ remote_request_id.stdout }}\n"
        mode: "0600"

    - name: Await managed Remote Commander service
      ansible.builtin.command:
        argv: [systemctl, is-active, digitalhouses-remote-commander.service]
      register: remote_request_active
      changed_when: false
      failed_when: false
      until: remote_request_active.stdout == 'active'
      retries: 90
      delay: 10
      check_mode: false

    - name: Await sanitized OAuth pairing status
      ansible.builtin.command:
        argv: [cat, /run/dh-remote-commander-pairing.status]
      register: remote_pairing_record
      changed_when: false
      failed_when: false
      until: remote_pairing_record.stdout.startswith('PAIR|' ~ remote_request_id.stdout ~ '|')
      retries: 60
      delay: 2
      check_mode: false

    - name: Show actual one-time pairing code and URL inside Semaphore
      ansible.builtin.debug:
        msg:
          pairing_code: "{{ remote_pairing_record.stdout.split('|')[3] }}"
          verification_url: "{{ remote_pairing_record.stdout.split('|')[4] }}"
          action: "Open verification_url in your browser, sign in, and confirm pairing_code."
          expires: "Provider code expires 15 minutes after issuance. Re-run this task if the device issues a new code."
      when: remote_pairing_record.stdout.split('|')[2] == 'CODE'

    - name: Explain connected or pending authorization
      ansible.builtin.debug:
        msg:
          authorization_state: "{{ remote_pairing_record.stdout.split('|')[2] }}"
          verification_url: "https://mcp.desktopcommander.app/device/verify"
          note: "If WAITING, the code has not appeared yet or is expired; inspect the agent on PVE. CONNECTED means the agent reported authorization."
      when: remote_pairing_record.stdout.split('|')[2] != 'CODE'

    - name: Report installed service and independent connection check
      ansible.builtin.debug:
        msg:
          result: PASS
          site: "{{ site.id }}"
          component: remote_desktop_commander
          service_status: ACTIVE
          pairing_state: "{{ remote_pairing_record.stdout.split('|')[2] }}"
          note: "Service ACTIVE alone does not prove the device is Online in Remote MCP."
