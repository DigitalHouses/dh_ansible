---
# Task 40: a normal Ansible software/service operation, not a bespoke root worker.
# Administrative rights are a site/target infrastructure prerequisite.
- name: Install and pair Remote Desktop Commander using shared Ansible become
  hosts: site_runner
  gather_facts: false
  become: false
  vars:
    infrastructure_access_capability: software_manage
  pre_tasks:
    - name: Load site identity from local inventory
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Require only the canonical site-local runner
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == 'runner'
          - (ansible_connection | default('')) == 'local'
          - site.id is defined
          - site.owner_slug is defined
          - site.type is defined
          - site.id == site.owner_slug ~ '-' ~ site.type

    - name: Read local runner hostname
      ansible.builtin.command:
        argv: [hostname]
      register: remote_runner_hostname
      changed_when: false

    - name: Verify the runner host identity
      ansible.builtin.assert:
        that:
          - remote_runner_hostname.stdout == 'ansible-' ~ site.id

  tasks:
    - name: Verify reusable administrative access to this managed Linux target
      ansible.builtin.include_role:
        name: infrastructure_access

    - name: Install and manage Remote Commander through the existing Ansible role
      ansible.builtin.include_role:
        name: runner_remote_commander
        apply:
          become: true

    - name: Require active Remote Commander managed service
      ansible.builtin.command:
        argv: [systemctl, is-active, digitalhouses-remote-commander.service]
      register: remote_service_active
      changed_when: false

    - name: Require Remote Commander autostart
      ansible.builtin.command:
        argv: [systemctl, is-enabled, digitalhouses-remote-commander.service]
      register: remote_service_enabled
      changed_when: false

    - name: Confirm managed service activation
      ansible.builtin.assert:
        that:
          - remote_service_active.stdout == 'active'
          - remote_service_enabled.stdout == 'enabled'

    - name: Obtain exact systemd service invocation ID
      ansible.builtin.command:
        argv: [systemctl, show, -P, InvocationID, digitalhouses-remote-commander.service]
      register: remote_service_invocation
      changed_when: false

    - name: Validate journal identity before reading any pairing output
      ansible.builtin.assert:
        that:
          - remote_service_invocation.stdout is match('^[a-f0-9]{32}$')
        fail_msg: "REMOTE_COMMANDER_INVOCATION_UNAVAILABLE"

    - name: Read only filtered device-pairing status from this service invocation
      ansible.builtin.shell: |
        set -o pipefail
        journalctl -q --no-pager -o cat \
          "_SYSTEMD_INVOCATION_ID={{ remote_service_invocation.stdout }}" \
          --since '-13 min' |
          python3 -c '
        import re, sys
        output = sys.stdin.read()
        if "Device ready" in output or "Desktop Commander Remote is connected" in output:
            print("CONNECTED")
        else:
            # v0.2.52 prints both a complete verification URL AND a separate
            # user_code after "Make sure the code matches:". Do not depend on
            # a particular server-generated query-string shape.
            codes = re.findall(
                r"(?:https://mcp\.desktopcommander\.app/device/verify\?user_code=|Make sure the code matches:\s*)([A-Z0-9]{4}-?[A-Z0-9]{4})",
                output,
            )
            if codes:
                print("CODE|" + codes[-1])
            elif "Device startup failed" in output:
                print("WAITING|DEVICE_STARTUP_FAILED")
            elif "Device code received" in output or "Please complete authentication:" in output:
                print("WAITING|CODE_NOT_PARSED")
            elif "Connecting this computer" in output or "Authenticating with Remote MCP server" in output:
                print("WAITING|AUTH_REQUEST_PENDING")
            else:
                print("WAITING|NO_AUTH_LOGS_IN_INVOCATION")
        '
      args:
        executable: /bin/bash
      become: true
      register: remote_pair_status
      failed_when: false
      changed_when: false
      until: >-
        remote_pair_status.stdout == 'CONNECTED'
        or remote_pair_status.stdout.startswith('CODE|')
      retries: 45
      delay: 1
      no_log: true

    - name: Report sanitized pairing diagnosis when no code was found
      ansible.builtin.debug:
        msg:
          state: REMOTE_COMMANDER_CODE_NOT_AVAILABLE
          stage: "{{ remote_pair_status.stdout | default('NO_COMMAND_OUTPUT', true) }}"
          note: "Only a classified stage, never raw agent journals or credentials"
      when: remote_pair_status.stdout != 'CONNECTED' and not remote_pair_status.stdout.startswith('CODE|')

    - name: Require actual authorization status or fresh device code
      ansible.builtin.assert:
        that:
          - remote_pair_status.stdout == 'CONNECTED' or remote_pair_status.stdout.startswith('CODE|')
        fail_msg: >-
          REMOTE_COMMANDER_PAIRING_NOT_READY:
          agent service is running but no pairing code or authorization
          is available from its current invocation. This is not Online.

    - name: Show the confirmation code if browser pairing is needed
      ansible.builtin.debug:
        msg:
          authorization_url: "https://mcp.desktopcommander.app/device/verify"
          one_time_code: "{{ remote_pair_status.stdout.split('|')[1] }}"
          instruction: "Подтвердите код на сайте, затем проверьте Online в ChatGPT."
      when: remote_pair_status.stdout.startswith('CODE|')

    - name: Show status for an already authorized agent
      ansible.builtin.debug:
        msg:
          authorization_url: "https://mcp.desktopcommander.app/device/verify"
          state: ALREADY_AUTHORIZED
          one_time_code: NOT_REQUIRED
      when: remote_pair_status.stdout == 'CONNECTED'

    - name: Report managed service, separately from provider Online state
      ansible.builtin.debug:
        msg:
          result: SERVICE_ACTIVE
          site: "{{ site.id }}"
          component: remote_desktop_commander
          pairing_state: "{{ 'CONNECTED' if remote_pair_status.stdout == 'CONNECTED' else 'CODE' }}"
          privilege_model: ANSIBLE_BECOME
          note: "Service active does not prove that the remote device is Online."
