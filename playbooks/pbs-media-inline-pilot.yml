---
# Final PBS A/B leg: install ONLY the PBS server package on the existing
# Debian 13 Media VM; do not replace kernel, re-create VMs, wipe any pool or
# increase CPU/RAM. This can be rerun without reformatting.
- name: PBS inline pilot | Load exact site identity and register guests
  hosts: site_runner
  gather_facts: false
  tasks:
    - name: Load observed PVE identity
      ansible.builtin.include_vars:
        file: "/var/lib/ansible/site-data/{{ site.id }}/pve-runtime.yml"
    - name: Load exact private Media VM declaration
      ansible.builtin.include_vars:
        file: "/var/lib/ansible/site-data/{{ site.id }}/media_vm.yml"
    - name: Load private PBS pilot declaration
      ansible.builtin.include_vars:
        file: "/var/lib/ansible/site-data/{{ site.id }}/pbs.yml"
    - name: Require final PBS experiment on one existing Media VM and only Hitachi
      ansible.builtin.assert:
        that:
          - "site.id == 'serzhan-home'"
          - "pve_observed.ipv4 == '192.168.11.6'"
          - "media_vm.vmid | int == 2232"
          - "media_vm.name == 'mediaserver-serzhan'"
          - "media_vm.resources.cores | int == 2"
          - "media_vm.resources.memory_mb | int == 4096"
          - "media_vm.resources.ballooning == false"
          - "media_vm.storage.disk.wwn == '0x5000cca22bc6ef0d'"
          - "pbs.media_vm_pilot.phase in ['ready_for_install', 'installation_complete']"
          - "pbs.media_vm_pilot.vmid | int == media_vm.vmid | int"
          - "pbs.media_vm_pilot.name == media_vm.name"
          - "pbs.media_vm_pilot.ipv4 == media_vm.network.ipv4"
          - "pbs.media_vm_pilot.pool_guid == '40733622006301358'"
          - "pbs.media_vm_pilot.physical_wwn == media_vm.storage.disk.wwn"
          - "pbs.media_vm_pilot.physical_serial == media_vm.storage.disk.serial"
          - "pbs.media_vm_pilot.physical_bytes | int == media_vm.storage.disk.size_bytes | int"
          - "pbs.media_vm_pilot.pbs_package == 'proxmox-backup-server'"
          - "pbs.media_vm_pilot.preserve_debian_kernel | bool"
          - "pbs.media_vm_pilot.preserve_media_services | bool"
          - "pbs.media_vm_pilot.safety.never_touch_other_guest_volumes | bool"
          - "pbs.media_vm_pilot.safety.never_recreate_vm | bool"
          - "pbs.media_vm_pilot.datastore == 'pbs-media-pilot'"
          - "pbs.media_vm_pilot.zfs_dataset == 'serzhan-pool/backups/pbs-media-pilot'"
          - "pbs.media_vm_pilot.refquota_gib | int == 128"
        fail_msg: PBS_MEDIA_INLINE_SITE_SCOPE_MISMATCH
    - name: Register commissioned PVE for non-destructive identity checks
      ansible.builtin.add_host:
        name: inline_media_pve
        groups: dh_inline_media_pve
        ansible_host: "{{ pve_observed.ipv4 }}"
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/dh_pve_admin_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/dh_pve_known_hosts
          -o ConnectTimeout=10
        pbs: "{{ pbs }}"
        media_vm: "{{ media_vm }}"
        site: "{{ site }}"
      changed_when: false
    - name: Register already commissioned Media VM with strictly pinned SSH
      ansible.builtin.add_host:
        name: inline_media_guest
        groups: dh_inline_media_guest
        ansible_host: "{{ media_vm.network.ipv4.split('/')[0] }}"
        ansible_user: debian
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/dh_pve_admin_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/dh_media_guest_known_hosts
          -o ConnectTimeout=10
        pbs: "{{ pbs }}"
        media_vm: "{{ media_vm }}"
      changed_when: false

- name: PBS inline pilot | Read-only PVE proof before apt package actions
  hosts: dh_inline_media_pve
  gather_facts: false
  tasks:
    - name: Require commissioned root access
      ansible.builtin.include_role:
        name: infrastructure_access
      vars:
        infrastructure_access_capability: host_manage
    - name: Read Media VM runtime state
      ansible.builtin.command:
        argv: [qm, status, '2232']
      changed_when: false
      register: media_state
    - name: Read Media VM resource and PCI config
      ansible.builtin.command:
        argv: [qm, config, '2232']
      changed_when: false
      register: media_config
    - name: Verify current SATA controller assignment is unique
      ansible.builtin.command:
        argv: [grep, -RlF, '0000:2b:00.0', /etc/pve/qemu-server]
      changed_when: false
      register: pci_owner
    - name: Verify CT1231 continues running for benchmark
      ansible.builtin.command:
        argv: [pct, status, '1231']
      changed_when: false
      register: ct_status
    - name: Verify old standalone PBS VM is absent
      ansible.builtin.stat:
        path: /etc/pve/qemu-server/2233.conf
        follow: false
      register: old_pbs_vm
    - name: Require exact managed VM, unmodified resources, exclusive PCI
      ansible.builtin.assert:
        that:
          - "media_state.stdout == 'status: running'"
          - "'name: mediaserver-serzhan' in media_config.stdout_lines"
          - "'cores: 2' in media_config.stdout_lines"
          - "'memory: 4096' in media_config.stdout_lines"
          - "'balloon: 0' in media_config.stdout_lines"
          - "'cpulimit: 1.5' in media_config.stdout_lines"
          - "'hostpci0: 0000:2f:00.0,pcie=1' in media_config.stdout_lines"
          - "'hostpci1: 0000:2b:00.0,pcie=1' in media_config.stdout_lines"
          - "pci_owner.stdout_lines == ['/etc/pve/qemu-server/2232.conf']"
          - "not old_pbs_vm.stat.exists"
          - "ct_status.stdout == 'status: running'"
        fail_msg: PBS_MEDIA_INLINE_PVE_OR_RESOURCE_DRIFT

- name: PBS inline pilot | Install PBS 4 on existing Debian 13 without kernel change
  hosts: dh_inline_media_guest
  gather_facts: true
  become: true
  tasks:
    - name: Require reusable native guest administrator access
      ansible.builtin.include_role:
        name: infrastructure_access
      vars:
        infrastructure_access_capability: software_manage
    - name: Require current Debian VM, distro and kernel identity
      ansible.builtin.assert:
        that:
          - "ansible_facts['distribution'] == 'Debian'"
          - "ansible_facts['distribution_major_version'] == '13'"
          - "ansible_facts['hostname'] == 'mediaserver-serzhan'"
          - "ansible_facts['default_ipv4']['address'] == '192.168.11.232'"
          - "'deb13' in ansible_facts['kernel']"
        fail_msg: PBS_MEDIA_INLINE_DEBIAN_GUEST_IDENTITY_DRIFT
    - name: Capture original Debian kernel before PBS package installation
      ansible.builtin.set_fact:
        original_debian_kernel: "{{ ansible_facts['kernel'] }}"
    - name: Validate currently imported ZFS pool GUID and health
      ansible.builtin.command:
        argv: [zpool, list, -H, -o, name,guid,health, serzhan-pool]
      register: pool_state
      changed_when: false
    - name: Require exactly the newly recreated healthy pool
      ansible.builtin.assert:
        that:
          - "pool_state.stdout.split() == ['serzhan-pool', '40733622006301358', 'ONLINE']"
        fail_msg: PBS_MEDIA_INLINE_POOL_GUID_DRIFT
    - name: Validate existing Hitachi VDEV and no pool data errors
      ansible.builtin.command:
        argv: [zpool, status, -P, serzhan-pool]
      register: zpool_status
      changed_when: false
    - name: Require original single physical disk remains intact
      ansible.builtin.assert:
        that:
          - "'wwn-0x5000cca22bc6ef0d-part1' in zpool_status.stdout"
          - "'errors: No known data errors' in zpool_status.stdout"
    - name: Verify physical system root is not the SATA Hitachi disk
      ansible.builtin.command:
        argv: [lsblk, -dn, -o, NAME,SERIAL,WWN,SIZE]
      register: current_disks
      changed_when: false
    - name: Require physical Hitachi still identified and present
      ansible.builtin.assert:
        that:
          - "'PK1331PAGH7VHS' in current_disks.stdout"
          - "'0x5000cca22bc6ef0d' in current_disks.stdout"
    - name: Check existing Media services before installation
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop:
        - plexmediaserver.service
        - jellyfin.service
        - radarr.service
        - sonarr.service
        - prowlarr.service
        - qbittorrent.service
      register: media_services_before
      changed_when: false
    - name: Confirm all original services running
      ansible.builtin.assert:
        that:
          - "media_services_before.results | map(attribute='stdout') | unique | list == ['active']"
    - name: Confirm PBS HTTPS port not in use before PBS installation
      ansible.builtin.command:
        argv: [bash, -lc, "test -z \"$(ss -lntH '( sport = :8007 )')\" || systemctl is-active --quiet proxmox-backup-proxy.service"]
      changed_when: false
    - name: Require at least 15 GiB free on existing Debian boot disk
      ansible.builtin.command:
        argv: [df, -BG, --output=avail, /]
      register: boot_space
      changed_when: false
    - name: Block if system root has insufficient free space
      ansible.builtin.assert:
        that:
          - "boot_space.stdout_lines[-1] | regex_replace('[^0-9]', '') | int > 15"
        fail_msg: PBS_MEDIA_INLINE_BOOT_DISK_LOW
    - name: Download verified official Proxmox Trixie APT signing key
      ansible.builtin.get_url:
        url: https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
        dest: /usr/share/keyrings/proxmox-archive-keyring.gpg
        owner: root
        group: root
        mode: '0644'
        checksum: sha256:136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45
      register: pbs_keyring
    - name: Configure official PBS 4 Trixie no-subscription APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/dh-pbs-no-subscription.sources
        owner: root
        group: root
        mode: '0644'
        content: |
          Types: deb
          URIs: http://download.proxmox.com/debian/pbs
          Suites: trixie
          Components: pbs-no-subscription
          Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    - name: Update APT repository metadata after adding PBS source
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
    - name: Simulate PBS installation before changing any installed packages
      ansible.builtin.command:
        argv: [apt-get, -s, install, proxmox-backup-server]
      register: pbs_apt_simulate
      changed_when: false
    - name: Forbid installation simulation that would remove packages or install PVE kernel
      ansible.builtin.assert:
        that:
          - "'Remv ' not in pbs_apt_simulate.stdout"
          - "not (pbs_apt_simulate.stdout is search('(?m)^Inst (?:proxmox-default-kernel|proxmox-kernel-[0-9]|pve-kernel-|proxmox-backup) '))"
        fail_msg: PBS_MEDIA_INLINE_APT_BREAKS_MEDIA_OR_INSTALLS_KERNEL
    - name: Install only PBS server package, never the Proxmox kernel metapackage
      ansible.builtin.apt:
        name: proxmox-backup-server
        state: present
        install_recommends: false
        fail_on_autoremove: true
    - name: Confirm effective Debian kernel was not replaced during install
      ansible.builtin.command:
        argv: [uname, -r]
      register: installed_kernel
      changed_when: false
    - name: Require original Debian kernel unchanged
      ansible.builtin.assert:
        that:
          - "installed_kernel.stdout == original_debian_kernel"
    - name: Verify media and PBS service states after package installation
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop:
        - proxmox-backup.service
        - proxmox-backup-proxy.service
        - plexmediaserver.service
        - jellyfin.service
        - radarr.service
        - sonarr.service
        - prowlarr.service
        - qbittorrent.service
      register: media_services_after
      changed_when: false
      retries: 10
      delay: 3
      until: media_services_after.rc == 0
    - name: Require all PBS plus original media applications active
      ansible.builtin.assert:
        that:
          - "media_services_after.results | map(attribute='stdout') | unique | list == ['active']"
    - name: Verify PBS v4 package and existing ZFS remain functional
      ansible.builtin.command:
        argv: [proxmox-backup-manager, versions]
      register: pbs_versions
      changed_when: false
    - name: Require PBS server version 4
      ansible.builtin.assert:
        that:
          - "'proxmox-backup-server' in pbs_versions.stdout"
          - "'4.' in pbs_versions.stdout"
    - name: Report isolated PBS installation success
      ansible.builtin.debug:
        msg:
          result: PBS_INLINE_MEDIA_SERVER_INSTALLED
          vmid: 2232
          pbs_url: https://192.168.11.232:8007
          unchanged_debian_kernel: "{{ installed_kernel.stdout }}"
          cpu_vcpus: 2
          ram_mb: 4096
          original_media_services: active
          pool_guid: '40733622006301358'
