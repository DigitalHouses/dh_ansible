---
- name: Apply and verify TrueNAS runtime policy
  hosts: site_runner
  gather_facts: false
  become: false

  pre_tasks:
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve.yml"
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve_access.yml"
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve_host.yml"
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/truenas.yml"
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/truenas_provision.yml"

    - name: Register persistent PVE host write transport
      ansible.builtin.add_host:
        name: pve_write_host
        groups: pve_write_target
        ansible_host: "{{ pve.host }}"
        ansible_user: "{{ pve_access.host.user }}"
        ansible_ssh_private_key_file: "{{ pve_access.host.identity_file }}"
        ansible_ssh_common_args: >-
          -o BatchMode=yes
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile={{ pve_access.host.known_hosts_file }}
        ansible_become: true
        ansible_become_method: sudo
        ansible_python_interpreter: /usr/bin/python3
      changed_when: false

  roles:
    - role: fleet_secrets
    - role: pve_host_write_access
    - role: truenas_runtime_audit
    - role: truenas_runtime_plan
    - role: truenas_runtime_apply

  post_tasks:
    - name: Re-audit TrueNAS runtime after apply
      ansible.builtin.include_role:
        name: truenas_runtime_audit
        allow_duplicates: true

    - name: Re-plan TrueNAS runtime after apply
      ansible.builtin.include_role:
        name: truenas_runtime_plan
        allow_duplicates: true

    - name: Require exact TrueNAS runtime idempotent state
      ansible.builtin.assert:
        that:
          - truenas_runtime_plan.result == "PASS"
          - truenas_runtime_plan.memory_action == "NOOP"
          - truenas_runtime_plan.tmpfs_action == "NOOP"
          - truenas_runtime_plan.init_policy_action == "NOOP"
        fail_msg: "TrueNAS runtime post-apply verification did not converge to exact NOOP."
