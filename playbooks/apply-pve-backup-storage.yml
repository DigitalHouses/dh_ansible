---
- name: Apply PVE TrueNAS backup storage
  hosts: site_runner
  gather_facts: false
  become: false

  pre_tasks:
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/truenas.yml"
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/truenas_provision.yml"
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve.yml"
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve_access.yml"
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve_host.yml"

    - name: Register persistent PVE host write transport
      ansible.builtin.add_host:
        name: pve_write_host
        groups: pve_write_target
        ansible_host: "{{ pve.host }}"
        ansible_user: "{{ pve_access.host.user }}"
        ansible_ssh_private_key_file: "{{ pve_access.host.identity_file }}"
        ansible_ssh_common_args: >-
          -o BatchMode=yes
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile={{ pve_access.host.known_hosts_file }}
        ansible_become: true
        ansible_become_method: sudo
        ansible_python_interpreter: /usr/bin/python3
      changed_when: false

  roles:
    - role: fleet_secrets
    - role: pve_host_write_access
    - role: pve_backup_storage_audit
    - role: pve_backup_storage_plan
    - role: pve_backup_storage_apply

  post_tasks:
    - name: Re-audit PVE backup storage after apply
      ansible.builtin.include_role:
        name: pve_backup_storage_audit
        allow_duplicates: true

    - name: Re-plan PVE backup storage after apply
      ansible.builtin.include_role:
        name: pve_backup_storage_plan
        allow_duplicates: true

    - name: Require exact PVE backup storage convergence
      ansible.builtin.assert:
        that:
          - pve_backup_storage_plan.result == "PASS"
          - pve_backup_storage_plan.action == "NOOP"
        fail_msg: "PVE backup storage post-apply verification did not converge to exact NOOP."

    - name: Report PVE backup storage acceptance
      ansible.builtin.debug:
        msg:
          site: "{{ site.id }}"
          storage_id: "{{ pve.backup_storage.id }}"
          mountpoint: "/mnt/pve/{{ pve.backup_storage.id }}"
          result: PASS
