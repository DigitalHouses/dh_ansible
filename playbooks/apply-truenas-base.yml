---
- name: Apply fresh TrueNAS base
  hosts: site_runner
  gather_facts: false
  become: false

  pre_tasks:
    - name: Load site runner variables
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/runner.yml"

    - name: Load site identity variables
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Load PVE variables
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve.yml"

    - name: Load PVE standard access variables
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve_access.yml"

    - name: Load PVE host identity variables
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve_host.yml"

    - name: Load current TrueNAS lifecycle variables
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/truenas.yml"

    - name: Load fresh TrueNAS provisioning variables
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/truenas_provision.yml"

    - name: Require ephemeral Fleet Vault password file
      ansible.builtin.assert:
        that:
          - fleet_vault_password_file_override is defined
          - fleet_vault_password_file_override | length > 0
        fail_msg: >-
          Pass an ephemeral 0600 Fleet Vault password file for this run.
          Persistent runner-local Vault password files are not accepted.

    - name: Migrate initial flat PVE secrets into fleet site namespace
      fleet_vault_update:
        path: "{{ fleet_vault_file_override | mandatory }}"
        vault_password_file: "{{ fleet_vault_password_file_override }}"
        site_id: "{{ site.id }}"
        migrate_flat_pve: true
        site_update: {}
      register: fleet_vault_schema_migration
      no_log: true

    - name: Register persistent PVE host write transport
      ansible.builtin.add_host:
        name: pve_write_host
        groups: pve_write_target
        ansible_host: "{{ pve.host }}"
        ansible_user: "{{ pve_access.host.user }}"
        ansible_ssh_private_key_file: "{{ pve_access.host.identity_file }}"
        ansible_ssh_common_args: >-
          -o BatchMode=yes
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile={{ pve_access.host.known_hosts_file }}
        ansible_become: true
        ansible_become_method: sudo
        ansible_python_interpreter: /usr/bin/python3
      changed_when: false

  roles:
    - role: fleet_secrets

    - role: pve_host_write_access

    - role: pve_audit
      vars:
        pve_audit_token_secret_effective: "{{ site_secrets.pve.audit_token_secret }}"

    - role: truenas_provision_plan

    - role: truenas_base_apply
      vars:
        pve_write_token_secret_effective: "{{ site_secrets.pve.write_token_secret }}"
        fleet_vault_password_file: "{{ fleet_vault_password_file_override }}"
