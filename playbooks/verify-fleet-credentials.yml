---
# Task 07: read-only reuse acceptance for credentials saved by tasks 05 and 06.
# No GitHub login, password survey, PVE access, or background service.
- name: Verify saved GitHub and Fleet credentials work in a new Semaphore task
  hosts: site_runner
  gather_facts: false
  become: false
  vars:
    dh_credentials_dir: /var/lib/semaphore/.dh-credentials
    dh_gh_bin: "{{ dh_credentials_dir }}/gh_2.102.0_linux_amd64/bin/gh"
    dh_fleet_checkout: "{{ dh_credentials_dir }}/fleet"
    dh_password_file: "{{ dh_credentials_dir }}/fleet-vault-password"
  pre_tasks:
    - name: Load this runner's site identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Require the current local site runner
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == 'runner'
          - (ansible_connection | default('')) == 'local'
          - site.id is defined
          - site.id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')

    - name: Read actual hostname
      ansible.builtin.command:
        argv: [hostname]
      register: dh_credentials_hostname
      changed_when: false

    - name: Check actual site identity
      ansible.builtin.assert:
        that: dh_credentials_hostname.stdout == 'ansible-' ~ site.id

  tasks:
    - name: Check required saved files without reading their contents
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ dh_gh_bin }}"
        - "{{ dh_fleet_checkout }}/.git"
        - "{{ dh_fleet_checkout }}/secrets/fleet.vault.yml"
        - "{{ dh_password_file }}"
      register: dh_credentials_files
      changed_when: false

    - name: Require task 05 and 06 saved credentials
      ansible.builtin.assert:
        that:
          - dh_credentials_files.results | length == 4
          - dh_credentials_files.results | map(attribute='stat.exists') | list == [true, true, true, true]
          - dh_credentials_files.results[3].stat.isreg | default(false)
          - dh_credentials_files.results[3].stat.mode == '0600'
          - dh_credentials_files.results[3].stat.pw_name == 'semaphore'
        fail_msg: "CREDENTIALS_NOT_READY: complete tasks 05 and 06 once"

    - name: Confirm saved GitHub authorization without device code or login
      ansible.builtin.command:
        argv:
          - "{{ dh_gh_bin }}"
          - api
          - repos/DigitalHouses/dh_ansible_fleet_detail
          - --jq
          - .full_name
      environment:
        GH_CONFIG_DIR: "{{ dh_credentials_dir }}/gh"
        GH_PROMPT_DISABLED: "1"
        GIT_TERMINAL_PROMPT: "0"
      register: dh_saved_github_auth
      changed_when: false
      no_log: true

    - name: Verify current token still reads the private Fleet
      ansible.builtin.assert:
        that:
          - dh_saved_github_auth.stdout == 'DigitalHouses/dh_ansible_fleet_detail'
        fail_msg: "GITHUB_AUTH_REUSE_FAILED: rerun 05 only if token is invalid"

    - name: Load credentials from saved Vault password through the shared role
      ansible.builtin.include_role:
        name: fleet_credentials

    - name: Verify that this site's credential namespace is available
      ansible.builtin.assert:
        that:
          - fleet_site_credentials is mapping
          - fleet_site_credentials | length > 0
        fail_msg: "FLEET_SITE_CREDENTIALS_MISSING"
      no_log: true

    - name: Report read-only credentials reuse
      ansible.builtin.debug:
        msg:
          result: CREDENTIALS_REUSE_PASS
          site: "{{ site.id }}"
          github_authorization_reused: true
          vault_master_password_reused: true
          site_credentials_selected: true
          administrator_input_required: false
          infrastructure_changed: false
