---
- name: Set site Backblaze B2 credentials in Fleet Vault
  hosts: site_runner
  gather_facts: false
  become: false

  vars_prompt:
    - name: backblaze_b2_account_id_input
      prompt: "Backblaze B2 Application Key ID / Account ID"
      private: true
      confirm: true

    - name: backblaze_b2_application_key_input
      prompt: "Backblaze B2 Application Key"
      private: true
      confirm: true

  pre_tasks:
    - name: Load site identity variables
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Require ephemeral Fleet Vault password file
      ansible.builtin.assert:
        that:
          - fleet_vault_password_file_override is defined
          - fleet_vault_password_file_override | length > 0
        fail_msg: >-
          Backblaze B2 credential storage requires the operator-held Fleet master password.

    - name: Validate Backblaze B2 credential input
      ansible.builtin.assert:
        that:
          - backblaze_b2_account_id_input | length > 0
          - backblaze_b2_application_key_input | length >= 8
        fail_msg: "Backblaze B2 credentials are incomplete."
      no_log: true

  tasks:
    - name: Persist site Backblaze B2 credentials in encrypted Fleet Vault
      fleet_vault_update:
        path: "{{ fleet_vault_file_override | mandatory }}"
        vault_password_file: "{{ fleet_vault_password_file_override }}"
        site_id: "{{ site.id }}"
        migrate_flat_pve: true
        site_update:
          backblaze_b2:
            account_id: "{{ backblaze_b2_account_id_input }}"
            application_key: "{{ backblaze_b2_application_key_input }}"
      register: backblaze_b2_vault_update
      no_log: true

    - name: Report Fleet Vault Backblaze B2 credential state
      ansible.builtin.debug:
        msg:
          site: "{{ site.id }}"
          result: PASS
          vault_changed: "{{ backblaze_b2_vault_update.changed }}"
          secret_values_reported: false
