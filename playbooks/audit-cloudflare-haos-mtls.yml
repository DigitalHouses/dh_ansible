        fail_msg: "HAOS origin /api/ did not return expected HTTP 401. Stop before any Cloudflare work."

    - name: Inspect existing public hostname resolution without changing DNS
      ansible.builtin.command:
        argv: [getent, ahostsv4, "{{ haos.cloudflare.hostname }}"]
      register: haos_mtls_dns
