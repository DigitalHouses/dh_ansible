---
- name: Set site TrueNAS SMB password in Fleet Vault
  hosts: site_runner
  gather_facts: false
  become: false

  vars_prompt:
    - name: truenas_smb_password_input
      prompt: "TrueNAS SMB password"
      private: true
      confirm: true

  pre_tasks:
    - name: Load site identity variables
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Require ephemeral Fleet Vault password file
      ansible.builtin.assert:
        that:
          - fleet_vault_password_file_override is defined
          - fleet_vault_password_file_override | length > 0
        fail_msg: >-
          Pass an ephemeral 0600 Fleet Vault password file for this run.

    - name: Validate site SMB password policy
      ansible.builtin.assert:
        that:
          - truenas_smb_password_input | length >= 8
        fail_msg: "TrueNAS SMB password must contain at least 8 characters."
      no_log: true

  tasks:
    - name: Persist site SMB password in encrypted Fleet Vault
      fleet_vault_update:
        path: "{{ fleet_vault_file_override | mandatory }}"
        vault_password_file: "{{ fleet_vault_password_file_override }}"
        site_id: "{{ site.id }}"
        migrate_flat_pve: true
        site_update:
          truenas:
            smb_password: "{{ truenas_smb_password_input }}"
      register: truenas_smb_vault_update
      no_log: true

    - name: Report Fleet Vault SMB password state
      ansible.builtin.debug:
        msg:
          site: "{{ site.id }}"
          result: PASS
          vault_changed: "{{ truenas_smb_vault_update.changed }}"
          secret_value_reported: false
