---
- name: Apply fleet-wide TrueNAS administrator credential
  hosts: site_runner
  gather_facts: false
  become: false

  pre_tasks:
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/truenas.yml"
    - ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/truenas_provision.yml"

  roles:
    - role: fleet_secrets
    - role: site_runtime_human_admin_secret

  tasks:
    - name: Build explicit administrator credential rotation plan
      ansible.builtin.include_role:
        name: truenas_human_admin_plan
      vars:
        truenas_human_admin_force_password_rotation: true

    - name: Require explicit rotation action
      ansible.builtin.assert:
        that:
          - truenas_human_admin_plan_result.result == "PASS"
          - truenas_human_admin_plan_result.admin.action == "RESET_PASSWORD"
          - truenas_human_admin_plan_result.admin.reason == "explicit_fleet_password_rotation"
        fail_msg: "Explicit TrueNAS administrator credential rotation plan was not accepted."

    - name: Apply explicit administrator credential rotation
      ansible.builtin.include_role:
        name: truenas_human_admin_apply

    - name: Re-plan administrator without forced rotation
      ansible.builtin.include_role:
        name: truenas_human_admin_plan
        allow_duplicates: true
      vars:
        truenas_human_admin_force_password_rotation: false

    - name: Require exact post-rotation convergence
      ansible.builtin.assert:
        that:
          - truenas_human_admin_plan_result.result == "PASS"
          - truenas_human_admin_plan_result.admin.action == "NOOP"
          - truenas_human_admin_apply_result.password_login_verified | bool
        fail_msg: "TrueNAS administrator credential rotation did not converge."

    - name: Report sanitized administrator credential acceptance
      ansible.builtin.debug:
        msg:
          site: "{{ site.id }}"
          result: PASS
          username: "{{ truenas_provision.human_admin.username }}"
          password_login_verified: true
          secret_values_reported: false
