---
# Semaphore single-button phase: audit first, then provision if approved in Fleet.\n# No modifications of old guests, backup jobs or host disks.
- name: Audit and plan media-server Debian QEMU VM and PCI ownership
  hosts: site_runner
  gather_facts: false
  become: false

  pre_tasks:
    - name: Require exactly two independent engineer actions from Semaphore survey
      ansible.builtin.assert:
        that:
          - media_vm_action is defined
          - media_vm_action in ['create', 'recreate', 'keep']
          - media_raw_disk_action is defined
          - media_raw_disk_action in ['import', 'erase']
        fail_msg: "MEDIA_ACTIONS_REQUIRED: select both VM and Raw Disk actions in task 80 Run dialog."

    - name: Load canonical site identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Load canonical PVE identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve.yml"


    # Generic dependency: future automated Fleet Detail refresh is inserted
    # here, behind its own trusted authorization and exact site scope.
    - name: Resolve reusable site inventory prerequisite
      ansible.builtin.include_role:
        name: site_inventory_prepare
      vars:
        site_inventory_required_files:
          - media_vm.yml

    - name: Load desired media server VM state
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/media_vm.yml"

    - name: Fail closed unless private Fleet declares SMB access identities
      ansible.builtin.assert:
        that:
          - media_vm.file_access is defined
          - media_vm.file_access is mapping
          - media_vm.file_access.accounts is defined
          - media_vm.file_access.accounts is sequence
          - media_vm.file_access.accounts is not string
          - media_vm.file_access.accounts | length > 0
        fail_msg: MEDIA_FILE_ACCESS_FLEET_REQUIRED

    - name: Validate canonical storage inventory
      ansible.builtin.assert:
        that:
          - media_vm.storage.pool_name == site.id ~ '-pool'
          - media_vm.storage.media_dataset == media_vm.storage.pool_name ~ '/media'
          - media_vm.storage.disk.serial is match('^[A-Za-z0-9_-]{8,40}$')
          - media_vm.storage.disk.wwn is match('^0x[0-9a-f]{16}$')
          - media_vm.storage.legacy_pool is not defined or media_vm.storage.legacy_pool.guid is match('^[0-9]{8,24}$')
          - media_raw_disk_action != 'erase' or media_vm.storage.destructive_without_backup | default(false) | bool
          - media_vm.storage.layout.datasets is sequence
          - media_vm.storage.layout.directories is sequence
        fail_msg: MEDIA_STORAGE_INVENTORY_INVALID

    - name: Enforce site-local runner
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == 'runner'
          - (ansible_connection | default('')) == 'local'
          - site.id == site.owner_slug ~ '-' ~ site.type


  tasks:
    - name: Require commissioned fixed-purpose PVE audit worker
      ansible.builtin.command:
        argv: [systemctl, is-active, dh-pve-access-audit.path]
      register: media_pve_audit_watcher
      changed_when: false
      failed_when: false

    - name: Reject unavailable PVE audit privilege boundary
      ansible.builtin.assert:
        that:
          - media_pve_audit_watcher.stdout == 'active'
        fail_msg: "MEDIA_PVE_AUDIT_NOT_COMMISSIONED: root worker absent."

    - name: Create unique PCI plan request ID
      ansible.builtin.command:
        argv: [cat, /proc/sys/kernel/random/uuid]
      register: media_plan_nonce
      changed_when: false

    - name: Request fixed-purpose read-only media PCI plan
      ansible.builtin.copy:
        dest: /var/lib/semaphore/dh-pve-access-audit.request
        content: "MEDIA_PLAN:{{ media_plan_nonce.stdout }}\n"
        mode: '0600'
      changed_when: false

    - name: Await exact request identity from protected worker
      ansible.builtin.command:
        argv: [cat, /run/dh-pve-access-audit.status]
      register: media_plan_worker_status
      changed_when: false
      failed_when: false
      retries: 120
      delay: 3
      until: >-
        media_plan_worker_status.stdout in [
          'PASS:' ~ media_plan_nonce.stdout,
          'FAILED:' ~ media_plan_nonce.stdout
        ]

    - name: Fail when PVE audit did not complete
      ansible.builtin.assert:
        that:
          - media_plan_worker_status.stdout == 'PASS:' ~ media_plan_nonce.stdout
        fail_msg: "MEDIA_PVE_PLAN_FAILED: inspect root-only dh-pve-access-audit log."

    - name: Read sanitized PCI plan produced by privileged audit
      ansible.builtin.slurp:
        src: /run/dh-pve-media-plan.json
      register: media_plan_report
      changed_when: false

    - name: Parse authorized media plan
      ansible.builtin.set_fact:
        media_plan_summary: "{{ media_plan_report.content | b64decode | from_json }}"
      changed_when: false

    - name: Verify plan provenance and exact target identity
      ansible.builtin.assert:
        that:
          - media_plan_summary.nonce == media_plan_nonce.stdout
          - media_plan_summary.site == site.id
          - media_plan_summary.name == media_vm.name
          - media_plan_summary.vmid | int == media_vm.vmid | int
          - media_plan_summary.result == 'PLAN_ONLY'
        fail_msg: "MEDIA_PVE_PLAN_PROVENANCE_MISMATCH: stale or foreign worker result."

    - name: Show audited current hardware and blockers
      ansible.builtin.debug:
        msg: "{{ media_plan_summary }}"

    - name: Provision only when canonical Fleet authorizes media server
      ansible.builtin.assert:
        that:
          - (media_plan_summary.gpu_owners | map(attribute='vmid') | list | difference([media_vm.vmid | int])) | length == 0
          - (media_plan_summary.sata_owners | map(attribute='vmid') | list | difference([media_vm.vmid | int])) | length == 0
          - media_vm.approvals.gpu_cutover | bool
          - media_vm.approvals.sata_cutover | bool
        fail_msg: "MEDIA_PCI_ALREADY_OWNED_OR_NOT_APPROVED"
      when: media_vm.approvals.provision | default(false) | bool

    - name: Create deployment request ID
      ansible.builtin.command:
        argv: [cat, /proc/sys/kernel/random/uuid]
      register: media_deploy_nonce
      changed_when: false
      when: media_vm.approvals.provision | default(false) | bool

    - name: Submit fixed-purpose media deploy to existing PVE root worker
      ansible.builtin.copy:
        dest: /var/lib/semaphore/dh-pve-access-audit.request
        content: "MEDIA_DEPLOY_{{ media_vm_action | upper }}_{{ media_raw_disk_action | upper }}:{{ media_deploy_nonce.stdout }}\n"
        mode: '0600'
      changed_when: false
      when: media_vm.approvals.provision | default(false) | bool

    - name: Await media VM provisioning on PVE
      ansible.builtin.command:
        argv: [cat, /run/dh-pve-access-audit.status]
      register: media_deploy_worker
      changed_when: false
      failed_when: false
      retries: 240
      delay: 5
      until: >-
        media_deploy_worker.stdout in [
          'PASS:' ~ media_deploy_nonce.stdout,
          'FAILED:' ~ media_deploy_nonce.stdout
        ]
      when: media_vm.approvals.provision | default(false) | bool

    - name: Require successful VM deployment
      ansible.builtin.assert:
        that:
          - media_deploy_worker.stdout == 'PASS:' ~ media_deploy_nonce.stdout
        fail_msg: "MEDIA_DEPLOY_FAILED: inspect dh-pve-access-audit root-worker log."
      when: media_vm.approvals.provision | default(false) | bool

    - name: Report media VM provisioning status
      ansible.builtin.debug:
        msg:
          vmid: "{{ media_vm.vmid }}"
          name: "{{ media_vm.name }}"
          ipv4: "{{ media_vm.network.ipv4 }}"
          result: "{{ 'DEPLOYED' if media_vm.approvals.provision | default(false) | bool else 'AUDIT_ONLY' }}"
