---
# Task 80 — native Ansible after Tiny Bootstrap, not the legacy root worker.
# The ONLY destructive disk action is a one-time, exact site-approved NTFS
# conversion, re-verified first on PVE and again from inside the media VM.
- name: Media 80 | Verify private site inventory and prepare commissioned PVE
  hosts: site_runner
  gather_facts: false
  become: false
  vars:
    media_github_api: "https://api.github.com/repos/DigitalHouses/site-{{ site.id }}"
    media_github_headers:
      Authorization: "Bearer {{ DH_GITHUB_PROVISION_TOKEN }}"
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
  pre_tasks:
    - name: Require independent VM and physical-disk actions
      ansible.builtin.assert:
        that:
          - media_vm_action is defined
          - media_vm_action in ['create', 'keep', 'recreate']
          - media_raw_disk_action is defined
          - media_raw_disk_action in ['import', 'erase']
        fail_msg: MEDIA_ACTIONS_REQUIRED

    - name: Load commissioned site identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Read observed PVE IP and pinned TLS identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve-runtime.yml"

    - name: Require correct local site and preexisting native credentials
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'runner'
          - ansible_play_hosts_all | length == 1
          - (ansible_connection | default('')) == 'local'
          - site.id == site.owner_slug ~ '-' ~ site.type
          - pve_observed.source == 'host_root_vmbr0'
          - pve_observed.ipv4 is match('^[0-9]+(\\.[0-9]+){3}$')
          - pve_observed.node | length > 0
          - DH_GITHUB_PROVISION_TOKEN is defined
          - DH_GITHUB_PROVISION_TOKEN | default('') | length > 20
          - DH_MQTT_PASSWORD is defined
          - DH_MQTT_PASSWORD | default('') | length > 0
          - lookup('ansible.builtin.env', 'DH_MQTT_USERNAME') | length > 0
        fail_msg: MEDIA_NATIVE_SITE_IDENTITY_OR_CREDENTIALS_NOT_READY
      no_log: true

    - name: Verify reusable administrative file-management rights on runner
      ansible.builtin.include_role:
        name: infrastructure_access
      vars:
        infrastructure_access_capability: filesystem_manage

  tasks:
    - name: Read exact private GitHub site repository metadata
      ansible.builtin.uri:
        url: "{{ media_github_api }}"
        method: GET
        headers: "{{ media_github_headers }}"
        validate_certs: true
        status_code: 200
        timeout: 25
      register: media_site_repo
      no_log: true
      changed_when: false

    - name: Refuse foreign or public site configuration
      ansible.builtin.assert:
        that:
          - media_site_repo.json.private == true
          - media_site_repo.json.owner.login == 'DigitalHouses'
          - media_site_repo.json.name == 'site-' ~ site.id
          - media_site_repo.json.default_branch == 'main'
          - not media_site_repo.json.archived
        fail_msg: MEDIA_SITE_REPOSITORY_IDENTITY_MISMATCH
      no_log: true

    - name: Read private site identity marker
      ansible.builtin.uri:
        url: "{{ media_github_api }}/contents/.digitalhouses/site.json?ref=main"
        method: GET
        headers: "{{ media_github_headers }}"
        validate_certs: true
        status_code: 200
        timeout: 20
      register: media_site_marker
      changed_when: false
      no_log: true

    - name: Validate private repository site marker
      ansible.builtin.assert:
        that:
          - (media_site_marker.json.content | b64decode | from_json).schema == 1
          - (media_site_marker.json.content | b64decode | from_json).site_id == site.id
          - (media_site_marker.json.content | b64decode | from_json).purpose == 'digitalhouses_ansible_site'
        fail_msg: MEDIA_SITE_MARKER_MISMATCH
      no_log: true

    - name: Download only this site's media VM declaration
      ansible.builtin.uri:
        url: "{{ media_github_api }}/contents/inventories/{{ site.id }}/media_vm.yml?ref=main"
        method: GET
        headers: "{{ media_github_headers }}"
        validate_certs: true
        status_code: 200
        timeout: 20
      register: media_site_file
      changed_when: false
      no_log: true

    - name: Require small canonical YAML with a verifiable SHA
      ansible.builtin.assert:
        that:
          - media_site_file.json.encoding == 'base64'
          - media_site_file.json.size | int < 32768
          - media_site_file.json.sha is match('^[0-9a-f]{40}$')
          - media_site_file.json.path == 'inventories/' ~ site.id ~ '/media_vm.yml'
        fail_msg: MEDIA_SITE_FILE_INVALID
      no_log: true

    - name: Parse approved media VM declaration (nonsecret)
      ansible.builtin.set_fact:
        media_vm: "{{ (media_site_file.json.content | b64decode | from_yaml).media_vm }}"
      no_log: true

    - name: Require specific declared VM, hardware, pool and network boundaries
      ansible.builtin.assert:
        that:
          - media_vm.name == 'mediaserver-' ~ site.owner_slug
          - media_vm.vmid | int >= 2200
          - media_vm.vmid | int <= 2254
          - media_vm.vmid | int == 2000 + (media_vm.network.ipv4.split('/')[0].split('.')[-1] | int)
          - media_vm.network.bridge == 'vmbr0'
          - media_vm.network.static_ipv4_verified | bool
          - media_vm.storage.pool_name == site.owner_slug ~ '-pool'
          - media_vm.storage.media_dataset == media_vm.storage.pool_name ~ '/media'
          - media_vm.storage.disk.wwn is match('^0x[0-9a-f]{16}$')
          - media_vm.storage.disk.serial is match('^[A-Za-z0-9_-]{8,40}$')
          - media_vm.storage.disk.size_bytes | int > 100000000000
          - media_vm.pci.gpu is match('^[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}[.][0-7]$')
          - media_vm.pci.sata_controller is match('^[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}[.][0-7]$')
          - media_vm.resources.cores | int == 2
          - media_vm.resources.memory_mb | int == 4096
          - media_vm.resources.ballooning == false
          - media_vm.approvals.provision == true
          - media_vm.approvals.gpu_cutover == true
          - media_vm.approvals.sata_cutover == true
          - media_vm.storage.one_time_ntfs_erase.approved == true
          - media_vm.storage.one_time_ntfs_erase.scope == 'first_create_only'
          - media_vm.storage.one_time_ntfs_erase.wwn == media_vm.storage.disk.wwn
          - media_vm.storage.one_time_ntfs_erase.serial == media_vm.storage.disk.serial
          - media_vm.storage.one_time_ntfs_erase.size_bytes == media_vm.storage.disk.size_bytes
          - media_vm.storage.one_time_ntfs_erase.partition_partuuid == media_vm.storage.disk.observed_partuuid
          - media_vm.storage.one_time_ntfs_erase.partition_label == media_vm.storage.disk.observed_label
          - media_vm.storage.destructive_without_backup == true
          - media_vm.backup_export.pve_host == pve_observed.ipv4
          - media_vm_action != 'create' or media_raw_disk_action == 'erase'
          - media_vm_action != 'recreate' or media_raw_disk_action != 'erase' or (media_vm.storage.import_pool_guid is defined and (media_vm.storage.import_pool_guid is match('^[0-9]+$')))
          - media_vm_action != 'keep' or (media_raw_disk_action == 'erase' or media_vm.storage.import_pool_guid is defined)
        fail_msg: MEDIA_NATIVE_VM_DISK_IDENTITY_OR_APPROVAL_BLOCKED

    - name: Validate media file and backup account contracts
      ansible.builtin.import_tasks: media-accounts-preflight.yml
      vars:
        pve:
          host: "{{ pve_observed.ipv4 }}"
          node: "{{ pve_observed.node }}"

    - name: Verify PVE host SSH key and commissioned private key exist
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /var/lib/semaphore/.ssh/dh_pve_known_hosts
        - /var/lib/semaphore/.ssh/dh_pve_admin_ed25519
      register: media_ssh_credentials
      changed_when: false

    - name: Require managed SSH trust before PVE actions
      ansible.builtin.assert:
        that:
          - media_ssh_credentials.results | map(attribute='stat.isreg', default=false) | select('equalto', true) | list | length == 2
          - media_ssh_credentials.results | map(attribute='stat.mode', default='') | select('equalto', '0600') | list | length == 2
        fail_msg: MEDIA_PVE_SSH_TRUST_MISSING

    - name: Materialize only approved media metadata on the runner
      ansible.builtin.copy:
        dest: "{{ inventory_dir }}/media_vm.yml"
        content: "{{ {'media_vm': media_vm} | to_nice_yaml(indent=2) }}"
        owner: root
        group: semaphore
        mode: '0640'
      become: true
      no_log: true

    - name: Materialize observed PVE identity, never legacy Fleet IP
      ansible.builtin.copy:
        dest: "{{ inventory_dir }}/pve.yml"
        content: "{{ {'pve': {'host': pve_observed.ipv4, 'node': pve_observed.node, 'port': 8006, 'tls': {'sha256_fingerprint': pve_observed.tls_sha256_fingerprint}}} | to_nice_yaml(indent=2) }}"
        owner: root
        group: semaphore
        mode: '0640'
      become: true
      no_log: true

    - name: Register exactly the commissioned PVE root SSH target
      ansible.builtin.add_host:
        name: media_pve
        groups: dh_media_native_pve
        ansible_host: "{{ pve_observed.ipv4 }}"
        ansible_user: root
        ansible_connection: ssh
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/dh_pve_admin_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/dh_pve_known_hosts
          -o ConnectTimeout=10
        site: "{{ site }}"
        media_vm: "{{ media_vm }}"
        media_vm_action: "{{ media_vm_action }}"
        media_raw_disk_action: "{{ media_raw_disk_action }}"
      changed_when: false
      no_log: true

    - name: Publish sanitized native deployment plan
      ansible.builtin.debug:
        msg:
          result: MEDIA_NATIVE_PREPARED
          site: "{{ site.id }}"
          pve: "{{ pve_observed.ipv4 }}"
          vmid: "{{ media_vm.vmid }}"
          vm_action: "{{ media_vm_action }}"
          disk_action: "{{ media_raw_disk_action }}"
          disk_wwn: "{{ media_vm.storage.disk.wwn }}"
          site_inventory_git_blob: "{{ media_site_file.json.sha }}"
          no_legacy_worker: true

- name: Media 80 | Native PVE preflight and declared VM creation
  hosts: dh_media_native_pve
  gather_facts: false
  become: false
  tasks:
    - name: Require native commissioned root access to the actual PVE host
      ansible.builtin.include_role:
        name: infrastructure_access
      vars:
        infrastructure_access_capability: host_manage

    - name: Verify PVE/CT/hardware ownership before any VM or disk writes
      ansible.builtin.script: >-
        {{ playbook_dir }}/../scripts/dh-media-pve-preflight.py
        --site {{ site.id }}
        --vm-action {{ media_vm_action }}
        --disk-action {{ media_raw_disk_action }}
      register: media_pve_preflight
      changed_when: false

    - name: Require completed independent hardware and VM preflight
      ansible.builtin.assert:
        that:
          - "'MEDIA_PVE_PREFLIGHT=PASS' in media_pve_preflight.stdout"
        fail_msg: MEDIA_PVE_HARDWARE_PREFLIGHT_BLOCKED

    - name: Provision only the declared PVE media VM by native Ansible SSH
      ansible.builtin.script: >-
        {{ playbook_dir }}/../bootstrap/dh-pve-media-deploy.py
        --site {{ site.id }}
        --vm-action {{ media_vm_action }}
        --raw-disk-action {{ media_raw_disk_action }} --apply
      register: media_vm_provision
      changed_when: >-
        'VM_CREATED=YES' in media_vm_provision.stdout
        or 'VM_RECREATE=' in media_vm_provision.stdout

    - name: Confirm exact managed VM running before touching guest data disk
      ansible.builtin.command:
        argv: [qm, status, "{{ media_vm.vmid }}"]
      register: media_qm_running
      changed_when: false

    - name: Refuse to configure an absent, stopped, or foreign VM
      ansible.builtin.assert:
        that:
          - "media_qm_running.stdout == 'status: running'"
        fail_msg: MEDIA_VM_NOT_RUNNING_AFTER_NATIVE_PROVISION

    # The QGA-to-PVE channel is authenticated using the already pinned PVE
    # SSH key. Do NOT trust ssh-keyscan on its own after a VM recreation.
    - name: Read new Media guest ED25519 host key over commissioned PVE QEMU Guest Agent
      ansible.builtin.command:
        argv:
          - qm
          - guest
          - exec
          - "{{ media_vm.vmid }}"
          - --
          - /bin/cat
          - /etc/ssh/ssh_host_ed25519_key.pub
      register: media_guest_hostkey_qga
      changed_when: false
      retries: 60
      delay: 5
      until: >-
        media_guest_hostkey_qga.rc == 0
        and ((media_guest_hostkey_qga.stdout | from_json).exited | int) == 1
        and ((media_guest_hostkey_qga.stdout | from_json).exitcode | int) == 0

    - name: Remember only the trusted Media guest SSH algorithm and public key
      ansible.builtin.set_fact:
        media_verified_ed25519_key: >-
          {{ ((media_guest_hostkey_qga.stdout | from_json)['out-data'] | trim).split()[:2] | join(' ') }}

    - name: Require a single valid Media guest ED25519 host key before network verification
      ansible.builtin.assert:
        that:
          - "media_verified_ed25519_key is match('^ssh-ed25519 [A-Za-z0-9+/]{60,}={0,2}
- name: Media 80 | Configure approved Debian media apps and one-time ZFS
  hosts: site_runner
  gather_facts: false
  become: false
  tasks:
    - name: Independently read advertised ED25519 key from Media guest SSH endpoint
      ansible.builtin.command:
        argv:
          - ssh-keyscan
          - -T
          - '5'
          - -t
          - ed25519
          - "{{ media_vm.network.ipv4.split('/')[0] }}"
      register: media_ssh_keyscan
      changed_when: false
      retries: 30
      delay: 5
      until: >-
        media_ssh_keyscan.rc == 0
        and (
          (media_vm.network.ipv4.split('/')[0] ~ ' ' ~
          hostvars['media_pve'].media_verified_ed25519_key)
          in media_ssh_keyscan.stdout_lines
        )

    - name: Verify SSH network identity equals the key read from authenticated QGA
      ansible.builtin.assert:
        that:
          - >-
            (media_vm.network.ipv4.split('/')[0] ~ ' ' ~
            hostvars['media_pve'].media_verified_ed25519_key)
            in media_ssh_keyscan.stdout_lines
        fail_msg: MEDIA_SSH_HOSTKEY_NETWORK_QGA_MISMATCH

    - name: Inspect dedicated Media guest SSH trust file without following symlinks
      ansible.builtin.stat:
        path: /var/lib/semaphore/.ssh/dh_media_guest_known_hosts
        follow: false
      register: media_ssh_trust_before
      become: true

    - name: Reject symlinks, directories, or foreign SSH trust file paths
      ansible.builtin.assert:
        that:
          - "not media_ssh_trust_before.stat.exists or media_ssh_trust_before.stat.isreg"
          - "not (media_ssh_trust_before.stat.islnk | default(false))"
        fail_msg: MEDIA_SSH_HOSTKEY_FILE_UNSAFE

    - name: Atomically pin the newly recreated guest key with correct semaphore ownership
      ansible.builtin.copy:
        dest: /var/lib/semaphore/.ssh/dh_media_guest_known_hosts
        content: "{{ media_vm.network.ipv4.split('/')[0] }} {{ hostvars['media_pve'].media_verified_ed25519_key }}\n"
        owner: semaphore
        group: semaphore
        mode: '0600'
        follow: false
      become: true

    - name: Verify SSH trust file owner, group, type, and mode
      ansible.builtin.stat:
        path: /var/lib/semaphore/.ssh/dh_media_guest_known_hosts
        follow: false
      register: media_ssh_trust_after

    - name: Refuse missing or unreadable guest trust file
      ansible.builtin.assert:
        that:
          - "media_ssh_trust_after.stat.isreg"
          - "media_ssh_trust_after.stat.pw_name == 'semaphore'"
          - "media_ssh_trust_after.stat.gr_name == 'semaphore'"
          - "media_ssh_trust_after.stat.mode == '0600'"
        fail_msg: MEDIA_SSH_TRUST_WRONG_OWNER_OR_MODE

    - name: Confirm connection as semaphore with strict SSH identity checking
      ansible.builtin.command:
        argv:
          - ssh
          - -i
          - /var/lib/semaphore/.ssh/dh_pve_admin_ed25519
          - -o
          - BatchMode=yes
          - -o
          - IdentitiesOnly=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - UserKnownHostsFile=/var/lib/semaphore/.ssh/dh_media_guest_known_hosts
          - -o
          - ConnectTimeout=8
          - "debian@{{ media_vm.network.ipv4.split('/')[0] }}"
          - /bin/true
      changed_when: false
      retries: 24
      delay: 5
      register: media_guest_ssh_verified
      until: media_guest_ssh_verified.rc == 0

    - name: Register newly commissioned Debian media VM using pinned runner SSH
      ansible.builtin.add_host:
        name: media_server
        groups: dh_media_native_guest
        ansible_host: "{{ media_vm.network.ipv4.split('/')[0] }}"
        ansible_user: debian
        ansible_connection: ssh
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/dh_pve_admin_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/dh_media_guest_known_hosts
        media_owner_slug: "{{ site.owner_slug }}"
        site: "{{ site }}"
        media_vm_action: "{{ media_vm_action }}"
        media_raw_disk_action: "{{ media_raw_disk_action }}"
        media_vm: >-
          {{
            media_vm | combine({
              'plex_agent': {
                'mqtt': {
                  'username': lookup('ansible.builtin.env', 'DH_MQTT_USERNAME'),
                  'password': DH_MQTT_PASSWORD
                }
              }
            }, recursive=True)
          }}
      changed_when: false
      no_log: true

- name: Media 80 | Apply existing media guest setup role
  hosts: dh_media_native_guest
  gather_facts: false
  become: true
  pre_tasks:
    - name: Wait for Debian 13 SSH/cloud-init after PVE VM creation
      ansible.builtin.wait_for_connection:
        delay: 5
        sleep: 6
        connect_timeout: 8
        timeout: 540
      changed_when: false
  roles:
    - media_guest_setup
)"
          - "not ((media_guest_hostkey_qga.stdout | from_json)['out-truncated'] | bool)"
        fail_msg: MEDIA_QGA_HOST_KEY_INVALID

- name: Media 80 | Configure approved Debian media apps and one-time ZFS
  hosts: site_runner
  gather_facts: false
  become: false
  tasks:
    - name: Register newly commissioned Debian media VM using pinned runner SSH
      ansible.builtin.add_host:
        name: media_server
        groups: dh_media_native_guest
        ansible_host: "{{ media_vm.network.ipv4.split('/')[0] }}"
        ansible_user: debian
        ansible_connection: ssh
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/semaphore/.ssh/dh_pve_admin_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=accept-new
          -o UserKnownHostsFile=/var/lib/semaphore/.ssh/dh_media_guest_known_hosts
        media_owner_slug: "{{ site.owner_slug }}"
        site: "{{ site }}"
        media_vm_action: "{{ media_vm_action }}"
        media_raw_disk_action: "{{ media_raw_disk_action }}"
        media_vm: >-
          {{
            media_vm | combine({
              'plex_agent': {
                'mqtt': {
                  'username': lookup('ansible.builtin.env', 'DH_MQTT_USERNAME'),
                  'password': DH_MQTT_PASSWORD
                }
              }
            }, recursive=True)
          }}
      changed_when: false
      no_log: true

- name: Media 80 | Apply existing media guest setup role
  hosts: dh_media_native_guest
  gather_facts: false
  become: true
  pre_tasks:
    - name: Wait for Debian 13 SSH/cloud-init after PVE VM creation
      ansible.builtin.wait_for_connection:
        delay: 5
        sleep: 6
        connect_timeout: 8
        timeout: 540
      changed_when: false
  roles:
    - media_guest_setup
