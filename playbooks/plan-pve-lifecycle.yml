---
- name: Plan PVE guest lifecycle
  hosts: site_runner
  gather_facts: false
  become: false

  pre_tasks:
    - name: Load site PVE variables
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve.yml"

    - name: Load site PVE lifecycle target
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/pve_lifecycle.yml"

  roles:
    - role: pve_audit
    - role: pve_lifecycle_plan
