---
# Безопасная проверка запуска Ansible через Semaphore UI.
# Не требует доступа к PVE/TrueNAS и не изменяет инфраструктуру.
- name: Verify Semaphore UI executes Ansible from fleet repository
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Show successful read-only smoke test
      ansible.builtin.debug:
        msg:
          status: PASS
          test: semaphore_ansible_smoke
          inventory_host: "{{ inventory_hostname }}"
          ansible_version: "{{ ansible_version.full }}"
