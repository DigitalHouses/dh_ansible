---
- name: Fail closed unless private Fleet declares SMB access identities
  ansible.builtin.assert:
    that:
      - media_vm.file_access is defined
      - media_vm.file_access is mapping
      - media_vm.file_access.accounts is defined
      - media_vm.file_access.accounts is sequence
      - media_vm.file_access.accounts is not string
      - media_vm.file_access.accounts | length > 0
      - media_vm.storage.mode == 'readwrite'
    fail_msg: MEDIA_FILE_ACCESS_FLEET_REQUIRED

- name: Reject invalid SMB accounts before any destructive PVE action
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z][a-z0-9_-]{2,30}$')
      - item.name not in ['root', 'debian', 'nobody', 'plex', 'jellyfin', 'radarr', 'sonarr', 'prowlarr', 'qbittorrent', 'filestash', 'samba']
      - item.role in ['reader', 'writer']
      - item.password is string
      - item.password | length >= 16
      - item.password | regex_search('[\\r\\n]') is none
    fail_msg: MEDIA_FILE_ACCESS_ACCOUNT_INVALID
  loop: '{{ media_vm.file_access.accounts }}'
  no_log: true

- name: Reject duplicated SMB account identities before PVE worker
  ansible.builtin.assert:
    that:
      - (media_vm.file_access.accounts | map(attribute='name') | list | unique | length) == (media_vm.file_access.accounts | length)
    fail_msg: MEDIA_FILE_ACCESS_DUPLICATE_IDENTITIES
