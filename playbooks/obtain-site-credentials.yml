---
# Site Task 05. Semaphore 2.19.16 Survey target=env avoids Ansible CLI
# --extra-vars password exposure; a blank field always means KEEP.
- name: 05 — Ввести credentials объекта (Semaphore native)
  hosts: site_runner
  gather_facts: false
  become: false
  pre_tasks:
    - name: Load exact site identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Verify trusted local site runner
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == 'runner'
          - (ansible_connection | default('')) == 'local'
          - site.id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')

    - name: Read live runner hostname
      ansible.builtin.command:
        argv: [hostname]
      register: dh_site_credential_hostname
      changed_when: false

    - name: Reject another site's runner
      ansible.builtin.assert:
        that: dh_site_credential_hostname.stdout == 'ansible-' ~ site.id

  tasks:
    - name: Save only supplied values using native Semaphore localhost API
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ playbook_dir }}/../scripts/semaphore-obtain-credentials.py"
          - --site
          - "{{ site.id }}"
      environment:
        DH_INPUT_GITHUB_PROVISION_TOKEN: "{{ lookup('ansible.builtin.env', 'DH_INPUT_GITHUB_PROVISION_TOKEN') }}"
        DH_INPUT_MQTT_USERNAME: "{{ lookup('ansible.builtin.env', 'DH_INPUT_MQTT_USERNAME') }}"
        DH_INPUT_MQTT_PASSWORD: "{{ lookup('ansible.builtin.env', 'DH_INPUT_MQTT_PASSWORD') }}"
        DH_INPUT_PVE_API_AUDIT_TOKEN: "{{ lookup('ansible.builtin.env', 'DH_INPUT_PVE_API_AUDIT_TOKEN') }}"
        DH_INPUT_PVE_API_WRITE_TOKEN: "{{ lookup('ansible.builtin.env', 'DH_INPUT_PVE_API_WRITE_TOKEN') }}"
        DH_INPUT_CLOUDFLARE_API_TOKEN: "{{ lookup('ansible.builtin.env', 'DH_INPUT_CLOUDFLARE_API_TOKEN') }}"
      become: true
      register: dh_obtain_result
      changed_when: dh_obtain_result.rc == 0
      no_log: true
      diff: false

    - name: Show safe next step, without submitted values
      ansible.builtin.debug:
        msg:
          site: "{{ site.id }}"
          result: "SUBMISSION_COMPLETE_RUN_06_FOR_VALIDATION"
          backend: "Native Semaphore Variable Groups / Secrets"
          partial_updates: "Blank fields left unchanged"
          secrets_in_log: false
