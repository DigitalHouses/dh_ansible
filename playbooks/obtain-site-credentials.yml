---
# Task 05 pilot. Only dummy test values; the real credential schema follows E2E.
# Semaphore 2.19.16 Secret Survey target=env keeps these secrets out of CLI argv.
- name: 05 — Сохранить тестовые credentials в Semaphore
  hosts: site_runner
  gather_facts: false
  become: false
  pre_tasks:
    - name: Load local runner site identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Verify exact local Ansible runner
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == 'runner'
          - (ansible_connection | default('')) == 'local'
          - site.id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')

    - name: Read runner hostname
      ansible.builtin.command:
        argv: [hostname]
      register: dh_runner_hostname
      changed_when: false

    - name: Verify site ownership before modifying any Semaphore resource
      ansible.builtin.assert:
        that:
          - dh_runner_hostname.stdout == 'ansible-' ~ site.id

  tasks:
    - name: Persist only provided test credentials via Semaphore localhost API
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ playbook_dir }}/../scripts/semaphore-obtain-credentials.py"
          - --site
          - "{{ site.id }}"
      environment:
        DH_TEST_KEYSTORE_PASSWORD: "{{ lookup('ansible.builtin.env', 'DH_TEST_KEYSTORE_PASSWORD') }}"
        DH_TEST_VARIABLE_SECRET: "{{ lookup('ansible.builtin.env', 'DH_TEST_VARIABLE_SECRET') }}"
      become: true
      register: dh_obtain_result
      changed_when: >-
        (lookup('ansible.builtin.env', 'DH_TEST_KEYSTORE_PASSWORD') | length > 0)
        or (lookup('ansible.builtin.env', 'DH_TEST_VARIABLE_SECRET') | length > 0)
      no_log: true
      diff: false

    - name: Show secret-safe enrollment result
      ansible.builtin.debug:
        msg:
          site: "{{ site.id }}"
          phase: PILOT_NATIVE_SEMAPHORE_CREDENTIALS
          key_store: "{{ 'SUBMITTED' if lookup('ansible.builtin.env', 'DH_TEST_KEYSTORE_PASSWORD') else 'UNCHANGED' }}"
          variable_group: "{{ 'SUBMITTED' if lookup('ansible.builtin.env', 'DH_TEST_VARIABLE_SECRET') else 'UNCHANGED' }}"
          submitted_values_not_printed: true
          note: "Only dummy test credentials; verify in Semaphore UI and next task."
