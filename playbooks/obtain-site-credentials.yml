---
# Semaphore 2.20, pinned bootstrap: Task 05 Survey fields use
# target=env (required by the installed, root-owned Task 00 catalog seeder).
# Values enter Ansible via the controller and reach native URI modules as
# module data, never as shell arguments or custom helper parameters.
# One native Variable Group named "Empty" is already linked to every template
# by the accepted bootstrap. Preserve its ID/name and add var-type secrets.
- name: 05 — Obtain site credentials using native Semaphore API
  hosts: site_runner
  gather_facts: false
  become: false
  vars:
    dh_semaphore_api: https://127.0.0.1:3000/api
    dh_secret_group_name: Empty
    dh_input_values:
      DH_GITHUB_PROVISION_TOKEN: "{{ lookup('ansible.builtin.env', 'DH_INPUT_GITHUB_PROVISION_TOKEN') }}"
      DH_MQTT_BROKER_HOST: "{{ lookup('ansible.builtin.env', 'DH_INPUT_MQTT_BROKER_HOST') }}"
      DH_MQTT_USERNAME: "{{ lookup('ansible.builtin.env', 'DH_INPUT_MQTT_USERNAME') }}"
      DH_MQTT_PASSWORD: "{{ lookup('ansible.builtin.env', 'DH_INPUT_MQTT_PASSWORD') }}"
      DH_PVE_ROOT_PASSWORD: "{{ lookup('ansible.builtin.env', 'DH_INPUT_PVE_ROOT_PASSWORD') }}"
      DH_PBS_ADMIN_PASSWORD: "{{ lookup('ansible.builtin.env', 'DH_INPUT_PBS_ADMIN_PASSWORD') }}"
      DH_B2_KEY_ID: "{{ lookup('ansible.builtin.env', 'DH_INPUT_B2_KEY_ID') }}"
      DH_B2_APPLICATION_KEY: "{{ lookup('ansible.builtin.env', 'DH_INPUT_B2_APPLICATION_KEY') }}"
      DH_CLOUDFLARE_API_TOKEN: "{{ lookup('ansible.builtin.env', 'DH_INPUT_CLOUDFLARE_API_TOKEN') }}"
    dh_secret_names:
      - DH_GITHUB_PROVISION_TOKEN
      - DH_MQTT_PASSWORD
      - DH_PVE_ROOT_PASSWORD
      - DH_PBS_ADMIN_PASSWORD
      - DH_B2_KEY_ID
      - DH_B2_APPLICATION_KEY
      - DH_CLOUDFLARE_API_TOKEN

  pre_tasks:
    - name: Read local site identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Require one trusted local runner
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == 'runner'
          - (ansible_connection | default('')) == 'local'
          - site.id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')

    - name: Observe actual runner name
      ansible.builtin.command:
        argv: [hostname]
      register: dh_runner_name
      changed_when: false

    - name: Reject wrong site
      ansible.builtin.assert:
        that:
          - dh_runner_name.stdout == 'ansible-' ~ site.id

  tasks:
    - name: Select only nonblank submitted fields
      ansible.builtin.set_fact:
        dh_supplied: "{{ dh_input_values | dict2items | rejectattr('value', 'equalto', '') | list | items2dict }}"
      no_log: true

    - name: Validate submitted inputs before API writes
      ansible.builtin.assert:
        that:
          - item.value is string
          - item.value | length <= 8192
          # Keep delimiter tokens OUT of the Jinja source itself: writing
          # "{%" in a quoted regex triggers Ansible template parsing before
          # regex_search runs (Ansible 2.21 and Semaphore 2.20 live Task 05).
          - "item.value | regex_search('[{][{]|[{][%]|[{][#]') is none"
        fail_msg: "CREDENTIAL_FIELD_INVALID: input not accepted"
      loop: "{{ dh_supplied | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    - name: Validate the supplied broker IPv4/DNS endpoint
      ansible.builtin.assert:
        that:
          - dh_supplied.DH_MQTT_BROKER_HOST | length <= 253
          - dh_supplied.DH_MQTT_BROKER_HOST is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
          - "'..' not in dh_supplied.DH_MQTT_BROKER_HOST"
          - not dh_supplied.DH_MQTT_BROKER_HOST.endswith('.')
          - not dh_supplied.DH_MQTT_BROKER_HOST.endswith('-')
        fail_msg: MQTT_BROKER_HOST_INVALID
      when: "'DH_MQTT_BROKER_HOST' in dh_supplied"
      no_log: true

    - name: Save provided values in the existing Semaphore Variable Group
      when: dh_supplied | length > 0
      block:
        - name: Read existing root-owned site-local API token
          ansible.builtin.slurp:
            src: /root/dh-semaphore-catalog-api-token
          become: true
          register: dh_token
          no_log: true

        - name: Read Semaphore project identities
          ansible.builtin.uri:
            url: "{{ dh_semaphore_api }}/projects"
            method: GET
            headers:
              Authorization: "Bearer {{ dh_token.content | b64decode | trim }}"
            ca_path: /etc/semaphore/tls.crt
            validate_certs: true
            use_proxy: false
            follow_redirects: none
            return_content: true
            status_code: 200
          register: dh_projects_response
          changed_when: false
          no_log: true

        - name: Match exactly one site project
          ansible.builtin.set_fact:
            dh_site_projects: "{{ dh_projects_response.json | selectattr('name', 'equalto', site.id) | list }}"
          no_log: true

        - name: Confirm project identity before changes
          ansible.builtin.assert:
            that:
              - dh_site_projects | length == 1
              - dh_site_projects[0].id is number
              - dh_site_projects[0].id | int > 0
            fail_msg: "SEMAPHORE_PROJECT_NOT_FOUND_OR_AMBIGUOUS"

        - name: Read native Variable Groups
          ansible.builtin.uri:
            url: "{{ dh_semaphore_api }}/project/{{ dh_site_projects[0].id }}/environment?sort=name&order=asc"
            method: GET
            headers:
              Authorization: "Bearer {{ dh_token.content | b64decode | trim }}"
            ca_path: /etc/semaphore/tls.crt
            validate_certs: true
            use_proxy: false
            follow_redirects: none
            return_content: true
            status_code: 200
          register: dh_groups_response
          changed_when: false
          no_log: true

        - name: Match exactly the native group bound by Bootstrap
          ansible.builtin.set_fact:
            dh_groups: "{{ dh_groups_response.json | selectattr('name', 'equalto', dh_secret_group_name) | list }}"
          no_log: true

        - name: Require the group's canonical identity
          ansible.builtin.assert:
            that:
              - dh_groups | length == 1
              - dh_groups[0].id is number
              - dh_groups[0].id | int > 0
              - dh_groups[0].project_id | int == dh_site_projects[0].id | int
            fail_msg: "SEMAPHORE_VARIABLE_GROUP_NOT_FOUND_OR_AMBIGUOUS"

        - name: Read full native Variable Group metadata
          ansible.builtin.uri:
            url: "{{ dh_semaphore_api }}/project/{{ dh_site_projects[0].id }}/environment/{{ dh_groups[0].id }}"
            method: GET
            headers:
              Authorization: "Bearer {{ dh_token.content | b64decode | trim }}"
            ca_path: /etc/semaphore/tls.crt
            validate_certs: true
            use_proxy: false
            follow_redirects: none
            return_content: true
            status_code: 200
          register: dh_group_response
          changed_when: false
          no_log: true

        - name: Validate existing group and secret names
          ansible.builtin.assert:
            that:
              - dh_group_response.json.id == dh_groups[0].id
              - dh_group_response.json.project_id == dh_site_projects[0].id
              - dh_group_response.json.name == dh_secret_group_name
              - dh_group_response.json.json is string
              - dh_group_response.json.env is string
              - (dh_group_response.json.secrets | default([])) is sequence
              - dh_group_response.json.secret_storage_id | default(0) in [0, none]
              - not (dh_group_response.json.sync_enabled | default(false))
            fail_msg: "SEMAPHORE_GROUP_IDENTITY_DRIFT"
          no_log: true

        - name: Reject duplicate secret metadata and unexpected types
          ansible.builtin.assert:
            that:
              - (dh_group_response.json.secrets | default([]) | selectattr('name', 'equalto', item) | list | length) <= 1
              - (dh_group_response.json.secrets | default([]) | selectattr('name', 'equalto', item) | list | map(attribute='type') | list | difference(['var']) | length) == 0
            fail_msg: "SEMAPHORE_SECRET_METADATA_DRIFT"
          loop: "{{ dh_secret_names }}"
          no_log: true

        - name: Prepare nonsecret MQTT login without modifying other values
          ansible.builtin.set_fact:
            dh_group_environment: >-
              {{
                (dh_group_response.json.env | from_json)
                | combine({'DH_MQTT_BROKER_HOST': dh_supplied.DH_MQTT_BROKER_HOST}
                          if 'DH_MQTT_BROKER_HOST' in dh_supplied else {})
                | combine({'DH_MQTT_USERNAME': dh_supplied.DH_MQTT_USERNAME}
                          if 'DH_MQTT_USERNAME' in dh_supplied else {})
              }}
            dh_secret_operations: []
          no_log: true

        - name: Prepare only submitted secret upserts
          ansible.builtin.set_fact:
            dh_secret_operations: >-
              {{
                dh_secret_operations
                + [
                  {
                    'name': item,
                    'type': 'var',
                    'secret': dh_supplied[item],
                    'operation': 'update' if (dh_existing | length > 0) else 'create'
                  }
                  | combine({'id': dh_existing[0].id} if (dh_existing | length > 0) else {})
                ]
              }}
          vars:
            dh_existing: "{{ dh_group_response.json.secrets | default([]) | selectattr('name', 'equalto', item) | list }}"
          loop: "{{ dh_secret_names }}"
          when: item in dh_supplied
          no_log: true

        - name: Update only the existing native group using HTTPS API
          ansible.builtin.uri:
            url: "{{ dh_semaphore_api }}/project/{{ dh_site_projects[0].id }}/environment/{{ dh_groups[0].id }}"
            method: PUT
            headers:
              Authorization: "Bearer {{ dh_token.content | b64decode | trim }}"
            body_format: json
            body:
              id: "{{ dh_groups[0].id }}"
              project_id: "{{ dh_site_projects[0].id }}"
              name: "{{ dh_secret_group_name }}"
              json: "{{ dh_group_response.json.json }}"
              env: "{{ dh_group_environment | to_json }}"
              secrets: "{{ dh_secret_operations }}"
            ca_path: /etc/semaphore/tls.crt
            validate_certs: true
            use_proxy: false
            follow_redirects: none
            status_code: [200, 204]
            timeout: 20
          no_log: true
          diff: false

        - name: Verify group metadata after write without reading secret values
          ansible.builtin.uri:
            url: "{{ dh_semaphore_api }}/project/{{ dh_site_projects[0].id }}/environment/{{ dh_groups[0].id }}"
            method: GET
            headers:
              Authorization: "Bearer {{ dh_token.content | b64decode | trim }}"
            ca_path: /etc/semaphore/tls.crt
            validate_certs: true
            use_proxy: false
            follow_redirects: none
            return_content: true
            status_code: 200
          register: dh_after
          changed_when: false
          no_log: true

        - name: Confirm stored names and nonsecret username
          ansible.builtin.assert:
            that:
              - dh_after.json.id == dh_groups[0].id
              - (dh_after.json.secrets | default([]) | map(attribute='name') | list) is superset(dh_secret_operations | map(attribute='name') | list)
              - (dh_after.json.env | from_json).get('DH_MQTT_BROKER_HOST') == dh_supplied.DH_MQTT_BROKER_HOST if 'DH_MQTT_BROKER_HOST' in dh_supplied else true
              - (dh_after.json.env | from_json).get('DH_MQTT_USERNAME') == dh_supplied.DH_MQTT_USERNAME if 'DH_MQTT_USERNAME' in dh_supplied else true
            fail_msg: "SEMAPHORE_CREDENTIAL_METADATA_NOT_SAVED"
          no_log: true

      rescue:
        - name: Stop safely without exposing credentials or response bodies
          ansible.builtin.fail:
            msg: "OBTAIN_CREDENTIALS_BLOCKED: Semaphore API/metadata check failed; no blind retry."

    - name: Report safe enrollment summary
      ansible.builtin.debug:
        msg:
          result: "{{ 'OBTAIN_CREDENTIALS_SUBMITTED' if dh_supplied | length > 0 else 'NO_CHANGES' }}"
          site: "{{ site.id }}"
          submitted_fields: "{{ dh_supplied.keys() | list }}"
          other_fields: KEEP
          storage: "Semaphore Variable Group / Secrets"
          verified_authentication: false
          next: "Run 06-Проверить credentials объекта"
