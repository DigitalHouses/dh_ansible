---
- name: Set fleet-wide TrueNAS human administrator password
  hosts: site_runner
  gather_facts: false
  become: false

  vars_prompt:
    - name: fleet_truenas_human_admin_password_input
      prompt: "Fleet-wide TrueNAS human administrator password"
      private: true
      confirm: true

  pre_tasks:
    - name: Load site identity variables
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Require ephemeral Fleet Vault password file
      ansible.builtin.assert:
        that:
          - fleet_vault_password_file_override is defined
          - fleet_vault_password_file_override | length > 0
        fail_msg: "Fleet-wide password update requires the operator-held Fleet master password."

    - name: Validate fleet-wide TrueNAS administrator password input
      ansible.builtin.assert:
        that:
          - fleet_truenas_human_admin_password_input | length >= 8
        fail_msg: "Fleet-wide TrueNAS administrator password must be at least 8 characters."
      no_log: true

  tasks:
    - name: Persist fleet-wide TrueNAS administrator password in encrypted Fleet Vault
      fleet_vault_update:
        path: "{{ fleet_vault_file_override | mandatory }}"
        vault_password_file: "{{ fleet_vault_password_file_override }}"
        site_id: "{{ site.id }}"
        migrate_flat_pve: true
        site_update: {}
        shared_update:
          truenas_human_admin_password: "{{ fleet_truenas_human_admin_password_input }}"
      register: fleet_truenas_human_admin_vault_update
      no_log: true

    - name: Report fleet-wide TrueNAS administrator credential state
      ansible.builtin.debug:
        msg:
          result: PASS
          vault_changed: "{{ fleet_truenas_human_admin_vault_update.changed }}"
          scope: fleet
          secret_values_reported: false
