---
# Task 05: GitHub CLI device authorization, then read-only use of private Fleet Git.
# Executed locally as the unprivileged Semaphore user; no root worker.
- name: 05 — Авторизоваться в GitHub и скачать private Fleet
  hosts: site_runner
  gather_facts: false
  become: false
  vars:
    dh_auth_dir: /var/lib/semaphore/.dh-credentials
    dh_gh_archive: "{{ dh_auth_dir }}/gh_2.102.0_linux_amd64.tar.gz"
    dh_gh_bin: "{{ dh_auth_dir }}/gh_2.102.0_linux_amd64/bin/gh"
    dh_gh_config: "{{ dh_auth_dir }}/gh"
    dh_fleet_dir: "{{ dh_auth_dir }}/fleet"
    dh_gh_env:
      GH_CONFIG_DIR: "{{ dh_gh_config }}"
      GH_PROMPT_DISABLED: "1"
      BROWSER: /bin/true
      GIT_TERMINAL_PROMPT: "0"
  pre_tasks:
    - name: Load local runner identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"
    - name: Verify local-only execution
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == 'runner'
          - (ansible_connection | default('')) == 'local'
          - site.id is defined
          - site.id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')
    - name: Read runner hostname
      ansible.builtin.command: hostname
      register: dh_runner_hostname
      changed_when: false
    - name: Check runner hostname
      ansible.builtin.assert:
        that: dh_runner_hostname.stdout == 'ansible-' ~ site.id
  tasks:
    - name: Create private credentials directory
      ansible.builtin.file:
        path: "{{ dh_auth_dir }}"
        state: directory
        mode: '0700'
    - name: Download pinned GitHub CLI to runner user directory
      ansible.builtin.get_url:
        url: https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz
        dest: "{{ dh_gh_archive }}"
        checksum: sha256:bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
        mode: '0600'
    - name: Extract GitHub CLI without system package installation
      ansible.builtin.unarchive:
        src: "{{ dh_gh_archive }}"
        dest: "{{ dh_auth_dir }}"
        remote_src: true
        creates: "{{ dh_gh_bin }}"
    - name: Check whether GitHub is already authorized for private Fleet
      ansible.builtin.command:
        argv:
          - "{{ dh_gh_bin }}"
          - api
          - repos/DigitalHouses/dh_ansible_fleet_detail
          - --jq
          - .full_name
      environment: "{{ dh_gh_env }}"
      register: dh_gh_existing
      changed_when: false
      failed_when: false
      no_log: true
    - name: Remove previous disposable device-code output
      ansible.builtin.file:
        path: "{{ dh_auth_dir }}/github-login.log"
        state: absent
      when: dh_gh_existing.rc != 0
    - name: Start GitHub device login without local browser
      ansible.builtin.shell: |
        set -o pipefail
        umask 077
        printf '\n' | "{{ dh_gh_bin }}" auth login --web --hostname github.com --git-protocol https --scopes repo --skip-ssh-key --insecure-storage > "{{ dh_auth_dir }}/github-login.log" 2>&1
      args:
        executable: /bin/bash
      environment: "{{ dh_gh_env }}"
      async: 780
      poll: 0
      register: dh_gh_auth_job
      when: dh_gh_existing.rc != 0
    - name: Wait until GitHub CLI prints one-time code
      ansible.builtin.shell: |
        grep -Eo '[A-Z0-9]{4}-[A-Z0-9]{4}' "{{ dh_auth_dir }}/github-login.log" | head -n 1
      args:
        executable: /bin/bash
      register: dh_device_code
      changed_when: false
      failed_when: false
      until: dh_device_code.stdout | length == 9
      retries: 30
      delay: 2
      when: dh_gh_existing.rc != 0
    - name: Show GitHub device code to administrator
      ansible.builtin.debug:
        msg:
          - "Откройте https://github.com/login/device"
          - "Код GitHub: {{ dh_device_code.stdout }}"
          - "Подтвердите доступ к приватному репозиторию; задача продолжит сама."
      when: dh_gh_existing.rc != 0
    - name: Wait for administrator to approve GitHub login
      ansible.builtin.async_status:
        jid: "{{ dh_gh_auth_job.ansible_job_id }}"
      register: dh_gh_auth_result
      until: dh_gh_auth_result is finished
      retries: 110
      delay: 5
      no_log: true
      when: dh_gh_existing.rc != 0
    - name: Validate GitHub private Fleet access
      ansible.builtin.command:
        argv:
          - "{{ dh_gh_bin }}"
          - api
          - repos/DigitalHouses/dh_ansible_fleet_detail
          - --jq
          - .full_name
      environment: "{{ dh_gh_env }}"
      register: dh_gh_verify
      changed_when: false
      no_log: true
    - name: Check verified repository name
      ansible.builtin.assert:
        that: dh_gh_verify.stdout == 'DigitalHouses/dh_ansible_fleet_detail'
    - name: Detect existing private Fleet clone
      ansible.builtin.stat:
        path: "{{ dh_fleet_dir }}/.git"
      register: dh_fleet_git
    - name: Clone private Fleet once using authenticated GitHub CLI
      ansible.builtin.command:
        argv:
          - "{{ dh_gh_bin }}"
          - repo
          - clone
          - DigitalHouses/dh_ansible_fleet_detail
          - "{{ dh_fleet_dir }}"
      environment: "{{ dh_gh_env }}"
      when: not dh_fleet_git.stat.exists
      no_log: true
    - name: Update previously cloned private Fleet
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ dh_fleet_dir }}"
          - pull
          - --ff-only
      environment: "{{ dh_gh_env }}"
      when: dh_fleet_git.stat.exists
      register: dh_fleet_update
      changed_when: dh_fleet_update.stdout is not search('Already up to date')
      no_log: true
    - name: Check encrypted Vault file is present
      ansible.builtin.stat:
        path: "{{ dh_fleet_dir }}/secrets/fleet.vault.yml"
      register: dh_fleet_vault
    - name: Require encrypted Fleet Vault
      ansible.builtin.assert:
        that:
          - dh_fleet_vault.stat.isreg | default(false)
          - dh_fleet_vault.stat.size | default(0) > 16
        fail_msg: "Private Fleet Vault missing; authorization not accepted"
    - name: Show result without secrets
      ansible.builtin.debug:
        msg:
          result: GITHUB_PRIVATE_FLEET_PASS
          site: "{{ site.id }}"
          next_task: "06-Ввести master password Fleet Vault"
