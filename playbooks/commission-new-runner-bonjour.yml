---
# Invoked once from PVE installer on a NEW Debian runner after SSH PVE enrollment.
# Do not run on an existing mature CT through resume / reconcile.
- name: Commission self-published Bonjour for newly created site Ansible runner
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  pre_tasks:
    - name: Validate fixed-purpose first-boot mDNS invocation
      ansible.builtin.assert:
        that:
          - dh_runner_mdns_first_boot is defined
          - dh_runner_mdns_first_boot | bool
          - dh_runner_hostname is match('^ansible-[a-z][a-z0-9-]{2,50}$')
          - dh_runner_cidr is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}/24$')
          - dh_pve_ip is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
        fail_msg: RUNNER_MDNS_UNAPPROVED

    - name: Add verified PVE host only as independent mDNS LAN probe executor
      ansible.builtin.add_host:
        name: dh_new_runner_mdns_pve
        ansible_host: "{{ dh_pve_ip }}"
        ansible_connection: ssh
        ansible_user: ansible-linux
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: /var/lib/ansible/.ssh/pve_host_write_ed25519
        ansible_ssh_common_args: >-
          -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=/var/lib/ansible/.ssh/pve_host_audit_known_hosts
      changed_when: false

  roles:
    - role: guest_network_discovery
      vars:
        guest_network_discovery_approved: "{{ dh_runner_mdns_first_boot }}"
        guest_network_discovery_hostname: "{{ dh_runner_hostname }}"
        guest_network_discovery_ip: "{{ dh_runner_cidr.split('/')[0] }}"
        guest_network_discovery_cidr: "{{ dh_runner_cidr }}"
        guest_network_discovery_provider: avahi
        guest_network_discovery_delegate: dh_new_runner_mdns_pve
