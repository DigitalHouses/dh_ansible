---
# Existing runner root worker calls this only after media VM has been provisioned.
- name: Resolve existing media VM from site inventory
  hosts: site_runner
  gather_facts: false
  become: false
  tasks:
    - name: Load site media VM data
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/media_vm.yml"

    - name: Require protected site MQTT runtime
      ansible.builtin.assert:
        that:
          - dh_media_runtime_secret_file is defined
          - dh_media_runtime_secret_file is match('^/run/dh-media-runtime-[a-z0-9-]+[.]yml
      ansible.builtin.add_host:
        name: media_server
        groups: dh_media_guest
        ansible_host: "{{ media_vm.network.ipv4.split('/')[0] }}"
        ansible_user: debian
        ansible_ssh_private_key_file: /var/lib/ansible/.ssh/pve_host_write_ed25519
        ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
        media_vm: "{{ media_vm | combine({'plex_agent': {'mqtt': {'username': dh_media_runtime.runtime_secrets.site_secrets.plex_agent.mqtt.username, 'password': dh_media_runtime.runtime_secrets.site_secrets.plex_agent.mqtt.password}}}, recursive=True) }}"
      changed_when: false
      no_log: true

- name: Configure media applications on existing Debian VM
  hosts: dh_media_guest
  gather_facts: false
  become: true
  pre_tasks:
    - name: Wait for freshly booted Debian SSH, cloud-init user and Python
      ansible.builtin.wait_for_connection:
        delay: 3
        sleep: 5
        connect_timeout: 8
        timeout: 420
      changed_when: false
  roles:
    - media_guest_setup
)
        fail_msg: MEDIA_SITE_RUNTIME_NOT_PROVISIONED

    - name: Inspect root-only runner MQTT secret
      ansible.builtin.stat:
        path: "{{ dh_media_runtime_secret_file }}"
        follow: false
      register: media_runtime_file_stat
      no_log: true

    - name: Require exact runtime file permissions
      ansible.builtin.assert:
        that:
          - media_runtime_file_stat.stat.isreg | default(false)
          - media_runtime_file_stat.stat.pw_name == 'root'
          - media_runtime_file_stat.stat.gr_name == 'root'
          - media_runtime_file_stat.stat.mode == '0600'
        fail_msg: MEDIA_RUNTIME_FILE_UNSAFE
      no_log: true

    - name: Load scoped MQTT from PVE runtime
      ansible.builtin.include_vars:
        file: "{{ dh_media_runtime_secret_file }}"
        name: dh_media_runtime
      no_log: true

    - name: Check site scoped MQTT presence
      ansible.builtin.assert:
        that:
          - dh_media_runtime.runtime_secrets.schema_version | int == 1
          - dh_media_runtime.runtime_secrets.site_id == 'serzhan-home'
          - dh_media_runtime.runtime_secrets.site_secrets.plex_agent.mqtt.username | length > 0
          - dh_media_runtime.runtime_secrets.site_secrets.plex_agent.mqtt.password | length > 0
        fail_msg: MEDIA_SITE_MQTT_SECRET_INVALID
      no_log: true

    - name: Resolve guest SSH target without extra Semaphore inventory
      ansible.builtin.add_host:
        name: media_server
        groups: dh_media_guest
        ansible_host: "{{ media_vm.network.ipv4.split('/')[0] }}"
        ansible_user: debian
        ansible_ssh_private_key_file: /var/lib/ansible/.ssh/pve_host_write_ed25519
        ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
        media_vm: "{{ media_vm }}"
      changed_when: false

- name: Configure media applications on existing Debian VM
  hosts: dh_media_guest
  gather_facts: false
  become: true
  pre_tasks:
    - name: Wait for freshly booted Debian SSH, cloud-init user and Python
      ansible.builtin.wait_for_connection:
        delay: 3
        sleep: 5
        connect_timeout: 8
        timeout: 420
      changed_when: false
  roles:
    - media_guest_setup
