---
# Fixed-purpose PVE worker supplies one-site MQTT runtime in /run.
- name: Resolve existing media VM and validate site-only runtime
  hosts: site_runner
  gather_facts: false
  become: false
  tasks:
    - name: Load canonical site identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"

    - name: Load media VM data
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/media_vm.yml"

    - name: Require a fixed-format root-owned temporary MQTT file
      ansible.builtin.assert:
        that:
          - dh_media_runtime_secret_file is defined
          - dh_media_runtime_secret_file is match('^/run/dh-media-runtime-[A-Za-z0-9-]+[.]yml$')
        fail_msg: MEDIA_SITE_RUNTIME_NOT_PROVISIONED

    - name: Inspect runtime metadata without exposing secrets
      ansible.builtin.stat:
        path: "{{ dh_media_runtime_secret_file }}"
        follow: false
      register: media_runtime_file_stat
      no_log: true

    - name: Require root-only runtime permissions
      ansible.builtin.assert:
        that:
          - media_runtime_file_stat.stat.isreg | default(false)
          - media_runtime_file_stat.stat.pw_name == 'root'
          - media_runtime_file_stat.stat.gr_name == 'root'
          - media_runtime_file_stat.stat.mode == '0600'
        fail_msg: MEDIA_RUNTIME_FILE_UNSAFE
      no_log: true

    - name: Read scoped site MQTT runtime
      ansible.builtin.include_vars:
        file: "{{ dh_media_runtime_secret_file }}"
        name: dh_media_runtime
      no_log: true

    - name: Require exact site MQTT identity
      ansible.builtin.assert:
        that:
          - dh_media_runtime.runtime_secrets.schema_version | int == 1
          - dh_media_runtime.runtime_secrets.site_id == site.id
          - dh_media_runtime.runtime_secrets.site_secrets.plex_agent.mqtt.username | length > 0
          - dh_media_runtime.runtime_secrets.site_secrets.plex_agent.mqtt.password | length > 0
        fail_msg: MEDIA_SITE_MQTT_RUNTIME_INVALID
      no_log: true

    - name: Resolve guest connection and scoped MQTT credentials
      ansible.builtin.add_host:
        name: media_server
        groups: dh_media_guest
        ansible_host: "{{ media_vm.network.ipv4.split('/')[0] }}"
        ansible_user: debian
        ansible_ssh_private_key_file: /var/lib/ansible/.ssh/pve_host_write_ed25519
        ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
        ansible_become: true
        ansible_python_interpreter: /usr/bin/python3
        media_vm: "{{ media_vm | combine({'plex_agent': {'mqtt': {'username': dh_media_runtime.runtime_secrets.site_secrets.plex_agent.mqtt.username, 'password': dh_media_runtime.runtime_secrets.site_secrets.plex_agent.mqtt.password}}}, recursive=True) }}"
      changed_when: false
      no_log: true

- name: Configure media applications on existing Debian VM
  hosts: dh_media_guest
  gather_facts: false
  become: true
  pre_tasks:
    - name: Wait for freshly booted Debian SSH and Python
      ansible.builtin.wait_for_connection:
        delay: 3
        sleep: 5
        connect_timeout: 8
        timeout: 420
      changed_when: false
  roles:
    - media_guest_setup
