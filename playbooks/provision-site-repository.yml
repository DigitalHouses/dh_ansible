---
# Reusable site data repository, no passwords or common Ansible code.
# DigitalHouses is currently a GitHub USER account: POST /user/repos.
# Existing private repo is ADOPTED only if its site marker is verified.
- name: 07 — Provision private repository for this site
  hosts: site_runner
  gather_facts: false
  become: false
  vars:
    dh_git_owner: DigitalHouses
    dh_git_name: "site-{{ site.id }}"
    dh_git_api: "https://api.github.com/repos/{{ dh_git_owner }}/{{ dh_git_name }}"
    dh_site_semaphore_api: https://127.0.0.1:3000/api
    dh_site_key_name: "GitHub site-{{ site.id }} · read-only"
    dh_site_deploy_title: "digitalhouses-{{ site.id }}-semaphore-ro"
    dh_site_semaphore_repo_name: "DigitalHouses site data (private)"
    dh_site_git_ssh_url: "git@github.com:{{ dh_git_owner }}/{{ dh_git_name }}.git"
    dh_git_marker:
      schema: 1
      site_id: "{{ site.id }}"
      purpose: digitalhouses_ansible_site
    dh_git_headers:
      Authorization: "Bearer {{ DH_GITHUB_PROVISION_TOKEN }}"
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
  module_defaults:
    ansible.builtin.uri:
      headers: "{{ dh_git_headers }}"
      use_proxy: false
      validate_certs: true
      follow_redirects: none
      timeout: 15
  pre_tasks:
    - name: Load canonical site identity
      ansible.builtin.include_vars:
        file: "{{ inventory_dir }}/group_vars/all.yml"
    - name: Restrict execution to the matching site runner
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'runner'
          - ansible_play_hosts_all | length == 1
          - (ansible_connection | default('')) == 'local'
          - site.id is match('^[a-z][a-z0-9]*(-[a-z0-9]+)+$')
          - site.id == site.owner_slug ~ '-' ~ site.type
    - name: Read actual site runner hostname
      ansible.builtin.command:
        argv: [hostname]
      changed_when: false
      register: dh_git_runner
    - name: Refuse another site runner
      ansible.builtin.assert:
        that: dh_git_runner.stdout == 'ansible-' ~ site.id
  tasks:
    - name: Check presence of GitHub provisioning identity
      ansible.builtin.set_fact:
        dh_git_token_present: "{{ DH_GITHUB_PROVISION_TOKEN is defined and (DH_GITHUB_PROVISION_TOKEN | default('') | length >= 20) }}"
      no_log: true
    - name: Require initial GitHub credential saved by Task 05
      ansible.builtin.assert:
        that: dh_git_token_present
        fail_msg: GITHUB_PROVISION_TOKEN_MISSING_USE_TASK_05

    - name: Verify authenticated GitHub owner
      ansible.builtin.uri:
        url: https://api.github.com/user
        method: GET
        status_code: [200, 401, 403]
      register: dh_git_actor
      changed_when: false
      no_log: true
    - name: Refuse token from another GitHub account
      ansible.builtin.assert:
        that:
          - dh_git_actor.status == 200
          - dh_git_actor.json.login | default('') == dh_git_owner
          - dh_git_actor.json.type | default('') == 'User'
        fail_msg: GITHUB_PROVISION_ACCOUNT_MISMATCH

    - name: Locate the exact site repository
      ansible.builtin.uri:
        url: "{{ dh_git_api }}"
        method: GET
        status_code: [200, 404]
      register: dh_git_before
      changed_when: false
      no_log: true

    - name: Create only a missing PRIVATE site repository
      ansible.builtin.uri:
        url: https://api.github.com/user/repos
        method: POST
        body_format: json
        body:
          name: "{{ dh_git_name }}"
          private: true
          auto_init: true
          description: "DigitalHouses private Ansible inventory · {{ site.id }}"
          has_issues: false
          has_projects: false
          has_wiki: false
        status_code: [201, 401, 403, 409, 422, 429]
      register: dh_git_created
      when: dh_git_before.status == 404
      no_log: true

    # Keep the GitHub response/body and token under no_log. Only the numeric
    # HTTP status and a fixed operator hint may appear in the task log.
    - name: Require successful private repository creation or safe adoption
      ansible.builtin.assert:
        that:
          - dh_git_before.status == 200 or dh_git_created.status | default(0) == 201
        fail_msg: >-
          GITHUB_PRIVATE_REPO_CREATION_BLOCKED:
          HTTP {{ dh_git_created.status | default(0) | int }}.
          {% if dh_git_created.status | default(0) | int in [401, 403] %}
          Verify the PAT has Repository creation: Read and write
          (or Administration: Read and write), and access to the DigitalHouses account.
          {% elif dh_git_created.status | default(0) | int == 422 %}
          GitHub rejected the repository request: check name collision, account limits
          and validation in the GitHub account; no existing repository is overwritten.
          {% elif dh_git_created.status | default(0) | int == 429 %}
          GitHub rate-limited repository creation; retry after the API limit resets.
          {% elif dh_git_created.status | default(0) | int == 409 %}
          GitHub reported a creation conflict; inspect the repository before retrying.
          {% else %}
          GitHub did not confirm creation; inspect API availability and account permissions.
          {% endif %}
      when: dh_git_before.status == 404

    - name: Verify actual repository identity after creation or adoption
      ansible.builtin.uri:
        url: "{{ dh_git_api }}"
        method: GET
        status_code: 200
      register: dh_git_repo
      changed_when: false
      no_log: true
    - name: Demand exact private repository identity
      ansible.builtin.assert:
        that:
          - dh_git_repo.json.owner.login == dh_git_owner
          - dh_git_repo.json.owner.type == 'User'
          - dh_git_repo.json.full_name == dh_git_owner ~ '/' ~ dh_git_name
          - dh_git_repo.json.private == true
          - not dh_git_repo.json.archived
          - dh_git_repo.json.default_branch | length > 0
        fail_msg: GITHUB_SITE_REPO_NOT_PRIVATE_OR_WRONG_OWNER

    - name: Examine existing site marker before any initialization
      ansible.builtin.uri:
        url: "{{ dh_git_api }}/contents/.digitalhouses/site.json"
        method: GET
        status_code: [200, 404]
      register: dh_git_marker_before
      changed_when: false
      no_log: true
    - name: Never adopt an unrelated or mismatched site marker
      ansible.builtin.assert:
        that:
          - (dh_git_marker_before.json.content | b64decode | from_json).schema == 1
          - (dh_git_marker_before.json.content | b64decode | from_json).site_id == site.id
          - (dh_git_marker_before.json.content | b64decode | from_json).purpose == 'digitalhouses_ansible_site'
        fail_msg: GITHUB_EXISTING_REPOSITORY_MARKER_MISMATCH
      when:
        - dh_git_before.status == 200
        - dh_git_marker_before.status == 200
      no_log: true

    # GitHub may successfully create the private repository and initialize its
    # README, then Task 07 may fail before installing the identity marker.
    # Recover only a strictly pristine, GitHub-autoinitialized repository:
    # same owner/private/site name, exactly one initial commit and README.
    # Any other unmarked repository stays immutable and is rejected.
    - name: Inspect initial commit of an existing unmarked site repository
      ansible.builtin.uri:
        url: "{{ dh_git_api }}/commits?sha={{ dh_git_repo.json.default_branch }}&per_page=2"
        method: GET
        status_code: 200
      register: dh_git_pristine_commits
      changed_when: false
      no_log: true
      when:
        - dh_git_before.status == 200
        - dh_git_marker_before.status == 404

    - name: Inspect full tree of an existing unmarked site repository
      ansible.builtin.uri:
        url: "{{ dh_git_api }}/git/trees/{{ dh_git_repo.json.default_branch }}?recursive=1"
        method: GET
        status_code: 200
      register: dh_git_pristine_tree
      changed_when: false
      no_log: true
      when:
        - dh_git_before.status == 200
        - dh_git_marker_before.status == 404

    - name: Verify initial README of an existing unmarked site repository
      ansible.builtin.uri:
        url: "{{ dh_git_api }}/contents/README.md"
        method: GET
        status_code: 200
      register: dh_git_pristine_readme
      changed_when: false
      no_log: true
      when:
        - dh_git_before.status == 200
        - dh_git_marker_before.status == 404

    - name: Reject unmarked repository unless it is an untouched Task 07 initialization
      ansible.builtin.assert:
        that:
          - dh_git_repo.json.default_branch == 'main'
          - not (dh_git_pristine_tree.json.truncated | default(true))
          - (dh_git_pristine_tree.json.tree | length) == 1
          - dh_git_pristine_tree.json.tree[0].path == 'README.md'
          - dh_git_pristine_tree.json.tree[0].type == 'blob'
          - (dh_git_pristine_commits.json | length) == 1
          - dh_git_pristine_commits.json[0].commit.message == 'Initial commit'
          - (dh_git_pristine_commits.json[0].parents | length) == 0
          - dh_git_pristine_commits.json[0].author.login == dh_git_owner
          - (dh_git_pristine_readme.json.content | b64decode) == '# ' ~ dh_git_name ~ '\nDigitalHouses private Ansible inventory · ' ~ site.id ~ '\n'
        fail_msg: GITHUB_UNMARKED_REPOSITORY_NOT_PRISTINE_REFUSE_ADOPTION
      when:
        - dh_git_before.status == 200
        - dh_git_marker_before.status == 404
      no_log: true

    - name: Approve recovery of a pristine initial repository
      ansible.builtin.set_fact:
        dh_git_pristine_recovery: true
      when:
        - dh_git_before.status == 200
        - dh_git_marker_before.status == 404

    - name: Initialize identity marker after fresh creation or verified pristine recovery
      ansible.builtin.uri:
        url: "{{ dh_git_api }}/contents/.digitalhouses/site.json"
        method: PUT
        body_format: json
        body:
          message: "Initialize DigitalHouses site identity"
          branch: "{{ dh_git_repo.json.default_branch }}"
          content: "{{ dh_git_marker | to_nice_json | b64encode }}"
        status_code: 201
      when:
        - dh_git_before.status == 404 or (dh_git_pristine_recovery | default(false))
        - dh_git_marker_before.status == 404
      no_log: true
    - name: Initialize nonsecret site inventory after fresh creation or verified pristine recovery
      ansible.builtin.uri:
        url: "{{ dh_git_api }}/contents/inventories/{{ site.id }}/site.yml"
        method: PUT
        body_format: json
        body:
          message: "Initialize nonsecret site inventory"
          branch: "{{ dh_git_repo.json.default_branch }}"
          content: "{{ {'site': {'id': site.id, 'owner_slug': site.owner_slug, 'type': site.type}} | to_nice_yaml | b64encode }}"
        status_code: 201
      when: dh_git_before.status == 404 or (dh_git_pristine_recovery | default(false))
      no_log: true

    - name: Read back site repository ownership marker
      ansible.builtin.uri:
        url: "{{ dh_git_api }}/contents/.digitalhouses/site.json"
        method: GET
        status_code: 200
      register: dh_git_marker_after
      changed_when: false
      no_log: true
    - name: Verify exact site marker readback
      ansible.builtin.assert:
        that:
          - (dh_git_marker_after.json.content | b64decode | from_json).schema == 1
          - (dh_git_marker_after.json.content | b64decode | from_json).site_id == site.id
          - (dh_git_marker_after.json.content | b64decode | from_json).purpose == 'digitalhouses_ansible_site'
        fail_msg: GITHUB_SITE_MARKER_READBACK_FAILED
      no_log: true
    - name: Read back site inventory
      ansible.builtin.uri:
        url: "{{ dh_git_api }}/contents/inventories/{{ site.id }}/site.yml"
        method: GET
        status_code: 200
      register: dh_git_inventory_after
      changed_when: false
      no_log: true
    - name: Verify site inventory has the correct identity
      ansible.builtin.assert:
        that:
          - (dh_git_inventory_after.json.content | b64decode | from_yaml).site.id == site.id
        fail_msg: GITHUB_SITE_INVENTORY_READBACK_FAILED
      no_log: true

    - name: Commission routine private repository access through native Semaphore and GitHub APIs
      ansible.builtin.import_tasks: tasks/site-repository-readonly-access.yml

    - name: Report safe site repository result
      ansible.builtin.debug:
        msg:
          site: "{{ site.id }}"
          repository: "{{ dh_git_owner }}/{{ dh_git_name }}"
          private: true
          action: "{{ 'CREATED' if dh_git_before.status == 404 else 'RECOVERED' if (dh_git_pristine_recovery | default(false)) else 'ADOPTED' }}"
          marker: VERIFIED
          inventory: VERIFIED
          routine_read_only_access: "{{ dh_site_repository_access_status }}"
