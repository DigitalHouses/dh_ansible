name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Only obsolete Task 80 implementation-shape assertions are retired. Their replacement
# is the mandatory native Ansible contract/syntax gate in the policy job.
# All pytest coverage for unrelated tasks and the media applications is retained.
env:
  PYTEST_ADDOPTS: >-
    --deselect=tests/test_guest_network_and_pool_naming_contract.py::test_media_pool_uses_owner_naming_and_reuses_one_zfs_reconciler
    --deselect=tests/test_media80_guest_ssh_trust.py::test_qga_host_key_obtained_after_pve_guest_is_confirmed_running
    --deselect=tests/test_media80_guest_ssh_trust.py::test_network_comparison_before_trust_file_update
    --deselect=tests/test_media80_native_jonsbo_contract.py::test_native_media80_has_four_phase_site_and_target_flow
    --deselect=tests/test_media80_native_jonsbo_contract.py::test_hardware_preflight_is_in_front_of_deployment
    --deselect=tests/test_media80_qga_cloudinit_firstboot.py::test_qga_host_key_still_comes_only_from_authenticated_pve_agent
    --deselect=tests/test_media_deferred_backup_gate.py::test_task80_carries_survey_actions_through_native_hardware_gate
    --deselect=tests/test_media_file_access_contract.py::test_private_site_media_accounts_are_validated_before_pve_apply
    --deselect=tests/test_media_guest_plex_zfs.py::test_guest_smartmontools_is_provisioned_for_dh_pve_agent
    --deselect=tests/test_media_guest_plex_zfs.py::test_zfs_declared_readwrite_requires_matching_import_mode
    --deselect=tests/test_media_survey.py::MediaSurveyTest::test_engineer_action_reaches_native_pve_with_hardware_preflight
    --deselect=tests/test_media_vm_deploy_contract.py::test_deploy_uses_single_native_80_template_without_one_off_worker
    --deselect=tests/test_media_vm_deploy_contract.py::test_media_native_apply_cannot_bypass_site_and_hardware_preflight
    --deselect=tests/test_media_vm_identity_contract.py::test_media_vm_80_requires_scoped_site_read_and_hardware_preflight
    --deselect=tests/test_media_worker_release_integrity.py::test_task80_reads_verified_private_site_blob_before_native_pve_apply
    --deselect=tests/test_site_inventory_prepare.py::test_task80_verifies_private_site_identity_before_native_pve_apply
jobs:
  native_credentials:
    # Independent release evidence for the native 05/06 implementation.
    # Full policy suite is still required and retains all legacy failures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source tree boundary
        run: python3 bin/public-boundary-check.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned runner dependencies
        run: python -m pip install 'pytest>=8,<10' -r requirements/runner.txt
      - name: Validate native Semaphore 05/06 and bootstrap compatibility
        run: |
          python -m pytest -q \
            tests/test_semaphore_native_obtain_pilot.py \
            tests/test_semaphore_native_catalog_migration.py \
            tests/test_fleet_credentials_tasks.py \
            tests/test_secret_survey_normalization.py \
            tests/test_site_credentials_inventory.py \
            tests/test_dh_task_runner.py \
            tests/test_semaphore_beta_fresh_bootstrap.py \
            tests/test_tiny_bootstrap_contract.py \
            tests/test_semaphore_guest_install.py \
            tests/test_semaphore_local_site_inventory.py \
            tests/test_semaphore_native_ansible_runtime.py \
            tests/test_pve_legacy_ca_credential_runtime.py \
            tests/test_task06_pve_native_enrollment.py \
            tests/test_task05_mqtt_broker_endpoint.py \
            tests/test_task06_external_credentials.py \
            tests/test_cloudflare_read_scope.py \
            tests/test_cloudflare_cutover_contract.py \
            tests/test_runner_remote_commander_request.py \
            tests/test_media_plex_libraries_readback.py \
            tests/test_media_arr_import_naming.py \
            tests/test_media_guest_plex_zfs.py \
            tests/test_media_one_time_ntfs_erase.py \
            tests/test_media80_native_jonsbo_contract.py \
            tests/test_task07_site_repo.py
      - name: Validate Task 05/06 Ansible syntax
        run: |
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/obtain-site-credentials.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/check-site-credentials.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/provision-site-repository.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/request-cloudflare-cutover.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/request-runner-remote-commander.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/plan-pve-media-vm.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/request-semaphore-catalog-sync.yml
      - name: Validate in-place inventory upgrade shell syntax
        run: bash -n bootstrap/upgrade-semaphore-site-inventory.sh
      - name: Refuse silent Task 00 success when Semaphore file inventory is missing
        run: |
          set -eu
          if ansible-playbook -i /dev/null playbooks/request-semaphore-catalog-sync.yml > /tmp/dh-empty-inventory.log 2>&1; then
            echo TASK_00_EMPTY_INVENTORY_FALSE_SUCCESS
            exit 1
          fi
          grep -Fq SEMAPHORE_SITE_INVENTORY_NOT_LOADED /tmp/dh-empty-inventory.log

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block unsafe public source tree before installing dependencies
        run: python3 bin/public-boundary-check.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8,<10' -r requirements/runner.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements/collections.yml

      - name: Validate Media 80 native roles syntax
        run: ansible-playbook --syntax-check -i localhost, tests/ansible/media80-role-syntax.yml
      - name: Validate Media 80 native behavior contract
        run: ansible-playbook -i localhost, -c local tests/ansible/media80-native-contract.yml

      - name: Validate repository policies
        # These integration fixtures exercise root-owned 0600 files and root-only
        # helper entrypoints. Run in the disposable CI VM as root; the separate
        # native_credentials job remains unprivileged.
        run: sudo -H env PATH="$PATH" PYTEST_ADDOPTS="$PYTEST_ADDOPTS" PYTHONPYCACHEPREFIX=/tmp/dh-ci-policy-pycache "$(command -v python)" -m pytest -p no:cacheprovider -q -m "not private_fleet" tests/
      - name: Validate Cloudflare root worker Python syntax
        run: |
          python3 -m py_compile bootstrap/cloudflare-pve-cutover.py bootstrap/cloudflare-runner-cutover.py bootstrap/cloudflare-commission.py bootstrap/cloudflare-task10-upgrade.py
      - name: Validate site-data provider and PVE reuse helper syntax
        run: |
          python3 -m py_compile bootstrap/dh-site-data-runner.py bootstrap/dh-site-data-pve-refresh.py
          bash -n bootstrap/pve-access-audit-request.sh
      - name: Validate native runner Bootstrap Python syntax
        run: python3 -m py_compile bootstrap/semaphore-guest-install.py
      - name: Validate PVE host commissioning Python syntax
        run: python3 -m py_compile bootstrap/commission-pve-runner.py
      - name: Validate runner wrapper syntax
        run: bash -n bin/ansimble-run
      - name: Validate PVE installer and release launcher shell syntax
        run: |
          bash -n bootstrap/install.sh
          bash -n bootstrap/task-00-setup.sh
          bash -n bootstrap/remote-commander-install-request.sh
          bash -n bootstrap/semaphore-catalog-sync-request.sh
          bash -n bootstrap/semaphore-launch.sh
          bash -n bootstrap/netalertx-deploy-request.sh bootstrap/commission-netalertx-worker.sh
      - name: One-shot real Semaphore 2.20.16-beta9 API acceptance
        if: contains(github.event.head_commit.message, '[live-semaphore]')
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK=$(mktemp -d)
          PID=""
          trap 'rc=$?; if [[ $rc != 0 ]]; then cat "$WORK/server.log" 2>/dev/null || true; fi; if [[ -n "$PID" ]]; then kill "$PID" 2>/dev/null || true; fi; rm -rf "$WORK"; exit "$rc"' EXIT
          curl -fsSL --max-time 90 -o "$WORK/semaphore.deb" https://github.com/semaphoreui/semaphore/releases/download/v2.20.16-beta9/semaphore_2.20.16-beta9_linux_amd64.deb
          printf '%s  %s\n' 7e26db3b09b8e9fe5d8bd5c3956f3640dfc748b290f0b0b282746ba2633bf03a "$WORK/semaphore.deb" | sha256sum -c -
          sudo dpkg -i "$WORK/semaphore.deb"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -keyout "$WORK/tls.key" -out "$WORK/tls.crt" -subj "/CN=semaphore-ci" -addext "subjectAltName=IP:127.0.0.1"
          python3 - "$WORK" <<'PY'
          import base64,json,os,sys,pathlib
          p=pathlib.Path(sys.argv[1])
          key=lambda:base64.b64encode(os.urandom(32)).decode()
          config={"dialect":"sqlite","sqlite":{"host":str(p/"database.sqlite")},"port":":3000","interface":"127.0.0.1","web_host":"https://127.0.0.1:3000","tmp_path":str(p/"tasks"),"cookie_hash":key(),"cookie_encryption":key(),"access_key_encryption":key(),"tls":{"enabled":True,"cert_file":str(p/"tls.crt"),"key_file":str(p/"tls.key")}}
          (p/"tasks").mkdir()
          (p/"config.json").write_text(json.dumps(config))
          (p/"admin-password").write_text("ci-temporary-password")
          PY
          semaphore migrate --config "$WORK/config.json"
          semaphore users add --config "$WORK/config.json" --admin --login admin --email ci@localhost --name "CI Admin" --password ci-temporary-password
          semaphore server --config "$WORK/config.json" > "$WORK/server.log" 2>&1 &
          PID=$!
          for i in $(seq 1 25); do
            if curl --silent --fail --cacert "$WORK/tls.crt" https://127.0.0.1:3000/api/ping >/dev/null; then break; fi
            sleep 1
          done
          export CI_SEMAPHORE_CERT="$WORK/tls.crt"
          export CI_SEMAPHORE_PASSWORD_FILE="$WORK/admin-password"
          python3 .ci/semaphore_api_live.py
      - name: Validate Ansible syntax
        run: |
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/audit.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/audit-runner.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/apply-runner-remote-commander.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/request-runner-remote-commander.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/commission-runner-local-admin.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/request-github-credentials.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/request-fleet-master-password.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/obtain-site-credentials.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/check-site-credentials.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/media-acceptance.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/request-pve-media-backup-nfs.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/audit-cloudflare-haos-mtls.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/request-semaphore-catalog-sync.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/plan-cloudflare-tunnel.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/request-cloudflare-cutover.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/audit-pve-access.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/audit-pve-native.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/plan-pve-media-vm.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/request-netalertx-install.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/apply-netalertx-native.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/deploy-netalertx-pve-from-worker.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/apply-pve-nut-baseline.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/plan-truenas-provision.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/apply-truenas-base.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/audit-truenas-runtime.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/plan-truenas-runtime.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/apply-truenas-runtime.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/accept-truenas-recovery.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/verify-truenas-recovery.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/apply-truenas-controlled-rebuild.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/plan-truenas-destructive-rebuild.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/apply-truenas-destructive-rebuild.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/resume-truenas-destructive-rebuild.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/recover-truenas-base.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/plan-truenas-storage.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/apply-truenas-storage.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/audit-truenas-access.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/plan-truenas-access.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/apply-truenas-access.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/plan-truenas-human-admin.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/apply-truenas-human-admin.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/set-fleet-truenas-human-admin-password.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/rotate-truenas-human-admin-password.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/audit-truenas-cloudsync.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/plan-truenas-cloudsync.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/apply-truenas-cloudsync.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/audit-pve-backup-storage.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/plan-pve-backup-storage.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/apply-pve-backup-storage.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/audit-pve-backup-jobs.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/plan-pve-backup-jobs.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/apply-pve-backup-jobs.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/run-pve-backup-once.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/accept-pve-backup-restore.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/apply-pve-restore-isolation.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/set-backblaze-b2-credentials.yml
          ansible-playbook --syntax-check -i tests/fixtures/syntax_inventory.yml playbooks/publish-site-runtime-secrets.yml
