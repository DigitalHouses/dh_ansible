---
# Run locally in CI. Tests desired contracts without creating infrastructure.
- name: CI | Validate native Semaphore credential, site, and media contracts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    root: "{{ playbook_dir }}/../.."
    catalog: "{{ lookup('ansible.builtin.file', root ~ '/catalog/semaphore-tasks.json') | from_json }}"
    task05: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/obtain-site-credentials.yml') }}"
    task06: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/check-site-credentials.yml') }}"
    task07: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/provision-site-repository.yml') }}"
    task80: "{{ lookup('ansible.builtin.file', root ~ '/playbooks/plan-pve-media-vm.yml') }}"
    runtime: "{{ lookup('ansible.builtin.file', root ~ '/scripts/dh-task-runner.py') }}"
  tasks:
    - name: Find one canonical Task 05, 06, 07 and 80
      ansible.builtin.set_fact:
        dh_t05: "{{ catalog.tasks | selectattr('title', 'match', '^05-') | list }}"
        dh_t06: "{{ catalog.tasks | selectattr('title', 'match', '^06-') | list }}"
        dh_t07: "{{ catalog.tasks | selectattr('title', 'match', '^07-') | list }}"
        dh_t80: "{{ catalog.tasks | selectattr('title', 'match', '^80-') | list }}"

    - name: Verify catalog uniqueness, dispatch and required credential inputs
      ansible.builtin.assert:
        that:
          - catalog.schema == 1
          - dh_t05 | length == 1
          - dh_t06 | length == 1
          - dh_t07 | length == 1
          - dh_t80 | length == 1
          - dh_t05[0].playbook == 'playbooks/obtain-site-credentials.yml'
          - dh_t06[0].playbook == 'playbooks/check-site-credentials.yml'
          - dh_t07[0].playbook == 'playbooks/provision-site-repository.yml'
          - dh_t80[0].playbook == 'playbooks/plan-pve-media-vm.yml'
          - "'DH_INPUT_PVE_ROOT_PASSWORD' in (dh_t05[0].survey_vars | map(attribute='name') | list)"
          - "'DH_INPUT_PBS_ADMIN_PASSWORD' in (dh_t05[0].survey_vars | map(attribute='name') | list)"
          - "'DH_INPUT_MQTT_BROKER_HOST' in (dh_t05[0].survey_vars | map(attribute='name') | list)"
          - "'DH_INPUT_GITHUB_PROVISION_TOKEN' in (dh_t05[0].survey_vars | map(attribute='name') | list)"

    - name: Verify independent VM and disk choices, without extra consent
      ansible.builtin.assert:
        that:
          - "(dh_t80[0].survey_vars | map(attribute='name') | list) == ['media_vm_action', 'media_raw_disk_action']"
          - "(dh_t80[0].survey_vars[0]['values'] | map(attribute='value') | sort | list) == ['create', 'keep', 'recreate']"
          - "(dh_t80[0].survey_vars[1]['values'] | map(attribute='value') | sort | list) == ['erase', 'import']"
          - "'media_vm.approvals' not in task80"
          - "'dh-media-pve-preflight.py' not in task80"
          - "'dh-pve-media-deploy.py' not in task80"

    - name: Verify credential write/read scopes and site repository private boundary
      ansible.builtin.assert:
        that:
          - "'ca_path: /etc/semaphore/tls.crt' in task05"
          - "'no_log: true' in task05"
          - "'DH_PVE_ROOT_PASSWORD' in task06"
          - "'StrictHostKeyChecking=yes' in task06"
          - "'ca_path: /etc/semaphore/tls.crt' not in task07 or 'validate_certs: false' not in task07"
          - "'GITHUB_SITE_REPO_NOT_PRIVATE_OR_WRONG_OWNER' in task07"
          - "'GITHUB_EXISTING_REPOSITORY_MARKER_MISMATCH' in task07"
          - "'GITHUB_SITE_MARKER_READBACK_FAILED' in task07"
          - "'GITHUB_SITE_INVENTORY_READBACK_FAILED' in task07"
          - "'validate_certs: false' not in task05"
          - "'validate_certs: false' not in task06"
          - "'validate_certs: false' not in task07"
          - "'validate_certs: false' not in task80"

    - name: Confirm generic runner keeps pinned release and role paths
      ansible.builtin.assert:
        that:
          - "'ANSIBLE_ROLES_PATH' in runtime"
          - "'CHECKOUT_SHA_MISMATCH' in runtime"
          - "'StrictHostKeyChecking=yes' in task80"
          - "'site-' in task80"
          - "'media80_native: true' in task80"
