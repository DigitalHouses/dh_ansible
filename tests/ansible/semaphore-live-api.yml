---
# Live Semaphore server integration: official API via stock Ansible URI module.
- name: Release | Verify running Semaphore HTTPS authentication
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    semaphore_ci_url: https://127.0.0.1:3000/api
    semaphore_ci_ca: "{{ lookup('ansible.builtin.env', 'CI_SEMAPHORE_CERT') }}"
    semaphore_ci_password_file: "{{ lookup('ansible.builtin.env', 'CI_SEMAPHORE_PASSWORD_FILE') }}"
  tasks:
    - name: Verify trusted CI certificate and password file exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ semaphore_ci_ca }}"
        - "{{ semaphore_ci_password_file }}"
      register: release_ci_files

    - name: Refuse CI without exact ephemeral trusted material
      ansible.builtin.assert:
        that:
          - release_ci_files.results | map(attribute='stat.isreg') | list == [true, true]

    - name: Check Semaphore availability over verified HTTPS
      ansible.builtin.uri:
        url: "{{ semaphore_ci_url }}/ping"
        method: GET
        ca_path: "{{ semaphore_ci_ca }}"
        validate_certs: true
        status_code: [200, 204]
        return_content: true
      register: release_semaphore_ping
      changed_when: false

    - name: Authenticate a dedicated ephemeral CI administrator
      ansible.builtin.uri:
        url: "{{ semaphore_ci_url }}/auth/login"
        method: POST
        body_format: json
        body:
          auth: admin
          password: "{{ lookup('ansible.builtin.file', semaphore_ci_password_file) | trim }}"
        ca_path: "{{ semaphore_ci_ca }}"
        validate_certs: true
        status_code: [200, 204]
        return_content: true
      register: release_semaphore_login
      changed_when: false
      no_log: true

    - name: Require login session cookie from official API
      ansible.builtin.assert:
        that:
          - release_semaphore_login.cookies_string | default('') | length > 0
      no_log: true

    - name: Confirm authenticated project list through official API
      ansible.builtin.uri:
        url: "{{ semaphore_ci_url }}/projects"
        method: GET
        headers:
          Cookie: "{{ release_semaphore_login.cookies_string }}"
        ca_path: "{{ semaphore_ci_ca }}"
        validate_certs: true
        status_code: 200
        return_content: true
      register: release_semaphore_projects
      changed_when: false
      no_log: true

    - name: Verify authentication and project-list response
      ansible.builtin.assert:
        that:
          - release_semaphore_projects.json is sequence
          - release_semaphore_projects.json is not string
