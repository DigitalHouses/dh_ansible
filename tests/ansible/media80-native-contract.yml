---
# Native Ansible contract check. No custom Python tests or VM/disk writes.
- name: Media 80 | Verify separation of VM, disk and guest lifecycles
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    media80_source: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../playbooks/plan-pve-media-vm.yml') }}"
    media80_vm_source: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/media_vm_provision/tasks/main.yml') }}"
    media80_zfs_source: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/media_native_zfs/tasks/main.yml') }}"
    media80_guest_source: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/media_guest_setup/tasks/main.yml') }}"
  tasks:
    - name: Parse native Ansible task definitions
      ansible.builtin.set_fact:
        media80_plays: "{{ media80_source | from_yaml }}"
        media80_vm_tasks: "{{ media80_vm_source | from_yaml }}"
        media80_zfs_tasks: "{{ media80_zfs_source | from_yaml }}"
        media80_guest_tasks: "{{ media80_guest_source | from_yaml }}"

    - name: Validate all Task 80 YAML when clauses are string expressions
      ansible.builtin.assert:
        that:
          - >-
            item.when is string or
            (item.when is sequence and item.when is not mapping
             and (item.when | reject('string') | list | length) == 0)
        fail_msg: "MEDIA80_INVALID_YAML_WHEN_TYPE: {{ item.name }}"
      loop: "{{ media80_vm_tasks + media80_zfs_tasks + media80_guest_tasks + media80_plays[0].tasks + media80_plays[1].tasks + media80_plays[2].tasks + media80_plays[3].pre_tasks }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.when is defined

    - name: Require VM protection condition remains a YAML string
      ansible.builtin.assert:
        that:
          - >-
            (media80_vm_tasks | selectattr('name', 'equalto',
             'Restore configured VM deletion protection when missing') | first)['when'][1] is string

    - name: Require lsblk column lists to be single argv elements
      ansible.builtin.assert:
        that:
          - >-
            (media80_zfs_tasks | selectattr('name', 'equalto',
             'List physical disks without vendor, WWN or NTFS assumptions') | first)
            ['ansible.builtin.command'].argv == ['lsblk', '-J', '-o', 'NAME,PATH,TYPE']
          - >-
            (media80_zfs_tasks | selectattr('name', 'equalto',
             'Read partitions of the selected physical disk only') | first)
            ['ansible.builtin.command'].argv ==
            ['lsblk', '-J', '-o', 'PATH,TYPE', '{{ media_sata_disk }}']

    - name: Check the real Task 80 dispatch path
      ansible.builtin.assert:
        that:
          - media80_plays | length == 4
          - "'dh-pve-media-deploy.py' not in media80_source"
          - "'dh-media-pve-preflight.py' not in media80_source"
          - "'ansible.builtin.script' not in media80_source"
          - "'media80_native: true' in media80_source"
          - "'ansible.builtin.include_role' in media80_source"
          - "'name: media_vm_provision' in media80_source"
          - "'media_vm.approvals' not in media80_source"
          - "'backup_export is defined' not in media80_source"

    - name: Confirm recreate and create share exactly one VM creation task
      ansible.builtin.assert:
        that:
          - >-
            media80_vm_tasks | selectattr('name', 'equalto',
            'Create VM through one shared create/recreate block') | list | length == 1
          - >-
            (media80_vm_tasks | selectattr('name', 'equalto',
            'Create VM through one shared create/recreate block') | first)['when'] ==
            "media_vm_action in ['create', 'recreate']"
          - >-
            (media80_vm_tasks | selectattr('name', 'equalto',
            'Remove only selected VM and its virtual disks') | first)['when'] ==
            "media_vm_action == 'recreate'"
          - >-
            (media80_vm_tasks | selectattr('name', 'equalto',
            'Start VM only when stopped') | first)['when'] ==
            "media_vm_effective_power.stdout == 'status: stopped'"

    - name: Confirm no destructive ZFS tasks run for import
      ansible.builtin.assert:
        that:
          - >-
            (media80_zfs_tasks | selectattr('name', 'equalto',
            'Destroy only an active single-disk ZFS pool on the selected SATA drive')
            | first)['when'][0] == "media_raw_disk_action == 'erase'"
          - >-
            (media80_zfs_tasks | selectattr('name', 'equalto',
            'Wipe only the physical SATA disk and its partitions') | first)['when'] ==
            "media_raw_disk_action == 'erase'"
          - >-
            (media80_zfs_tasks | selectattr('name', 'equalto',
            'Clear obsolete partition table on the explicitly selected SATA disk')
            | first)['when'] == "media_raw_disk_action == 'erase'"
          - >-
            (media80_zfs_tasks | selectattr('name', 'equalto',
            'Create requested new ZFS pool from the sole SATA disk')
            | first)['when'] == "media_raw_disk_action == 'erase'"
          - >-
            (media80_zfs_tasks | selectattr('name', 'equalto',
            'Import requested pool only, without mounting during discovery')
            | first)['when'][0] == "media_raw_disk_action == 'import'"

    - name: Verify six independent operator selections without six workflows
      ansible.builtin.assert:
        that:
          - "(['create', 'keep', 'recreate'] | product(['import', 'erase']) | list | length) == 6"
          - "(media80_vm_tasks | selectattr('name', 'equalto', 'Create VM through one shared create/recreate block') | list | length) == 1"
          - "(media80_zfs_tasks | selectattr('name', 'equalto', 'Wipe only the physical SATA disk and its partitions') | list | length) == 1"
          - "'media_vm_action' in media80_source"
          - "'media_raw_disk_action' in media80_source"

    - name: Require real safety checks to precede all destructive operations
      ansible.builtin.assert:
        that:
          - >-
            (media80_vm_tasks | map(attribute='name') | list).index('Protect any existing VM from foreign ownership') <
            (media80_vm_tasks | map(attribute='name') | list).index('Remove only selected VM and its virtual disks')
          - >-
            (media80_vm_tasks | map(attribute='name') | list).index('Require dedicated SATA PCI function to have no other QEMU owner') <
            (media80_vm_tasks | map(attribute='name') | list).index('Create VM through one shared create/recreate block')
          - >-
            (media80_zfs_tasks | map(attribute='name') | list).index('Never allow physical media disk to be the guest system disk') <
            (media80_zfs_tasks | map(attribute='name') | list).index('Destroy only an active single-disk ZFS pool on the selected SATA drive')
          - >-
            (media80_zfs_tasks | map(attribute='name') | list).index('Do not erase disks with other active filesystem mounts') <
            (media80_zfs_tasks | map(attribute='name') | list).index('Destroy only an active single-disk ZFS pool on the selected SATA drive')
          - "'--destroy-unreferenced-disks' not in media80_vm_source"
          - "'MEDIA_SELECTED_PCI_DEVICE_NOT_AHCI' in media80_source"
          - "'MEDIA_VM_RECREATE_FOREIGN_VOLUME' in media80_vm_source"
          - "'MEDIA_SATA_DISK_COUNT_MUST_EQUAL_ONE' in media80_zfs_source"
          - "'MEDIA_ZFS_POOL_ON_WRONG_DISK' in media80_zfs_source"

    - name: Verify QGA SSH trust is pinned before connecting as the guest user
      ansible.builtin.assert:
        that:
          - >-
            (media80_plays[1].tasks | map(attribute='name') | list).index('Apply native Ansible VM lifecycle for selected action') <
            (media80_plays[1].tasks | map(attribute='name') | list).index('Read new Media guest ED25519 host key over commissioned PVE QEMU Guest Agent')
          - >-
            (media80_plays[2].tasks | map(attribute='name') | list).index('Independently read advertised ED25519 key from Media guest SSH endpoint') <
            (media80_plays[2].tasks | map(attribute='name') | list).index('Verify SSH network identity equals the key read from authenticated QGA')
          - >-
            (media80_plays[2].tasks | map(attribute='name') | list).index('Verify SSH network identity equals the key read from authenticated QGA') <
            (media80_plays[2].tasks | map(attribute='name') | list).index('Atomically pin the newly recreated guest key with correct semaphore ownership')
          - >-
            (media80_plays[2].tasks | map(attribute='name') | list).index('Atomically pin the newly recreated guest key with correct semaphore ownership') <
            (media80_plays[2].tasks | map(attribute='name') | list).index('Register newly commissioned Debian media VM using pinned runner SSH')
          - "'StrictHostKeyChecking=yes' in media80_source"
          - "'StrictHostKeyChecking=accept-new' not in media80_source"
          - "'StrictHostKeyChecking=no' not in media80_source"
          - "'media_site_repo.json.private == true' in media80_source"
          - "'media_site_file.json.sha is match' in media80_source"

    - name: Verify guest packages, pool mode, and Plex validation remain present
      ansible.builtin.assert:
        that:
          - "'smartmontools' in media80_guest_source"
          - "'zfs-dkms' in media80_guest_source"
          - "'plexmediaserver' in media80_guest_source"
          - "'media_pool_readonly.stdout' in media80_guest_source"
          - "'media_plex_http.status == 200' in media80_guest_source"
          - "'nfs_backups.yml' in media80_guest_source"
          - "'Preserve legacy NFS export only for non-80 callers' in media80_guest_source"
          - "'not (media80_native | default(false) | bool)' in media80_guest_source"

    - name: Verify legacy worker stays isolated and native import is conditional
      ansible.builtin.assert:
        that:
          - >-
            (media80_guest_tasks | selectattr('name', 'equalto',
            'Reconcile physical SATA disk and ZFS using native Ansible')
            | first)['when'] == "media80_native | default(false) | bool"
          - >-
            (media80_guest_tasks | selectattr('name', 'equalto',
            'Reconcile physical SATA disk and ZFS using native Ansible')
            | first)['ansible.builtin.include_role'].name == 'media_native_zfs'
          - >-
            (media80_guest_tasks | selectattr('name', 'equalto',
            'Reconcile physical ZFS pool and declared datasets')
            | first)['when'] == "not (media80_native | default(false) | bool)"
          - "'dh-media-storage.py' not in media80_zfs_source"
